[package]
name = "atto-compiler-browser"
version = "0.2.0"
edition = "2021"
# Only the browser compiler CLI is an executable target in this crate.
# Legacy src/main.rs and src/bin/ci_verify.rs belong to a separate host
# program and must not be auto-built without their own dependencies.
autobins = false
license = "MIT"
description = "AttoLang subset compiler targeting browser WebAssembly, itself built for wasm32"

[lib]
name = "atto_compiler"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[[bin]]
name = "attoc"
path = "src/bin/attoc.rs"
