# generated by zed-pkg-test/test-org-fleet
name: apply test organization fleet

on:
  workflow_dispatch:
    inputs:
      organization:
        description: Test organization to provision
        required: true
        default: all
        type: choice
        options:
          - all
          - zed-pkg-test
          - 3fa-app-test
          - declarative-migrations-test
          - cliptown-test
          - claritas-viz-test
          - embedded-alerts-test
          - evento-globolo-test
          - fiducia-cloud-test
          - memebank-test
          - opto-sync-test
          - quaestor-ledger-test
          - sonus-auris-test
          - messaging-intel-test
          - scintilla-run-test
          - file-tunnel-test
          - shared-auth-test
          - hypesiege-test
          - streempilot-test
      repository:
        description: Optional repository-name glob, for example clients-*-consumer
        required: false
        default: ""
        type: string
      authentication:
        description: Secret-backed credential source; auto prefers FLEET_GH_TOKEN
        required: true
        default: auto
        type: choice
        options:
          - auto
          - pat
          - github-app
      confirm:
        description: Type APPLY_TEST_FLEET to authorize repository creation and PR writes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apply-test-org-fleet-${{ inputs.organization }}
  cancel-in-progress: false

jobs:
  select:
    name: Validate authorization and select organizations
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      organizations: ${{ steps.matrix.outputs.organizations }}
    steps:
      - id: matrix
        name: Require explicit confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirm }}
          SELECTED_ORGANIZATION: ${{ inputs.organization }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "APPLY_TEST_FLEET" ]]; then
            echo "::error::Confirmation must be exactly APPLY_TEST_FLEET"
            exit 1
          fi

          all='["zed-pkg-test","3fa-app-test","declarative-migrations-test","cliptown-test","claritas-viz-test","embedded-alerts-test","evento-globolo-test","fiducia-cloud-test","memebank-test","opto-sync-test","quaestor-ledger-test","sonus-auris-test","messaging-intel-test","scintilla-run-test","file-tunnel-test","shared-auth-test","hypesiege-test","streempilot-test"]'
          case "$SELECTED_ORGANIZATION" in
            all)
              selected="$all"
              ;;
            zed-pkg-test|3fa-app-test|declarative-migrations-test|cliptown-test|claritas-viz-test|embedded-alerts-test|evento-globolo-test|fiducia-cloud-test|memebank-test|opto-sync-test|quaestor-ledger-test|sonus-auris-test|messaging-intel-test|scintilla-run-test|file-tunnel-test|shared-auth-test|hypesiege-test|streempilot-test)
              selected="[\"$SELECTED_ORGANIZATION\"]"
              ;;
            *)
              echo "::error::Refusing unknown organization: $SELECTED_ORGANIZATION"
              exit 1
              ;;
          esac
          printf 'organizations=%s\n' "$selected" >> "$GITHUB_OUTPUT"

  apply:
    name: Provision ${{ matrix.organization }}
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        organization: ${{ fromJSON(needs.select.outputs.organizations) }}
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate the immutable fleet contract
        run: |
          node --check scripts/bootstrap-test-org-fleet.mjs
          node --check scripts/validate-test-org-fleet.mjs
          node scripts/validate-test-org-fleet.mjs
          node --test tests/test-org-fleet.test.mjs

      - name: Select a secret-backed credential
        id: auth
        shell: bash
        env:
          REQUESTED_AUTHENTICATION: ${{ inputs.authentication }}
          STORED_FLEET_PAT: ${{ secrets.FLEET_GH_TOKEN }}
          FLEET_APP_CLIENT_ID: ${{ vars.FLEET_APP_CLIENT_ID }}
          FLEET_APP_PRIVATE_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          has_pat=false
          has_app=false
          [[ -n "$STORED_FLEET_PAT" ]] && has_pat=true
          [[ -n "$FLEET_APP_CLIENT_ID" && -n "$FLEET_APP_PRIVATE_KEY" ]] && has_app=true

          case "$REQUESTED_AUTHENTICATION" in
            auto)
              if [[ "$has_pat" == true ]]; then
                selected=pat
              elif [[ "$has_app" == true ]]; then
                selected=github-app
              else
                echo "::error::Configure FLEET_GH_TOKEN or both FLEET_APP_CLIENT_ID and FLEET_APP_PRIVATE_KEY"
                exit 1
              fi
              ;;
            pat)
              if [[ "$has_pat" != true ]]; then
                echo "::error::authentication=pat requires the FLEET_GH_TOKEN Actions secret"
                exit 1
              fi
              selected=pat
              ;;
            github-app)
              if [[ "$has_app" != true ]]; then
                echo "::error::authentication=github-app requires FLEET_APP_CLIENT_ID and FLEET_APP_PRIVATE_KEY"
                exit 1
              fi
              selected=github-app
              ;;
            *)
              echo "::error::Unsupported authentication mode: $REQUESTED_AUTHENTICATION"
              exit 1
              ;;
          esac

          printf 'mode=%s\n' "$selected" >> "$GITHUB_OUTPUT"
          echo "Using $selected authentication for ${{ matrix.organization }}"

      - name: Mint a short-lived installation token
        if: steps.auth.outputs.mode == 'github-app'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FLEET_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: ${{ matrix.organization }}
          permission-administration: write
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write
          permission-workflows: write

      - name: Export the stored PAT without logging it
        if: steps.auth.outputs.mode == 'pat'
        shell: bash
        env:
          STORED_FLEET_PAT: ${{ secrets.FLEET_GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STORED_FLEET_PAT"
          printf 'GH_TOKEN=%s\n' "$STORED_FLEET_PAT" >> "$GITHUB_ENV"

      - name: Export the short-lived App token without logging it
        if: steps.auth.outputs.mode == 'github-app'
        shell: bash
        env:
          FLEET_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$FLEET_APP_TOKEN"
          printf 'GH_TOKEN=%s\n' "$FLEET_APP_TOKEN" >> "$GITHUB_ENV"

      - name: Verify organization visibility
        shell: bash
        env:
          FLEET_ORGANIZATION: ${{ matrix.organization }}
        run: |
          set -euo pipefail
          gh api "orgs/$FLEET_ORGANIZATION" --silent

      - name: Create or adopt repositories, push commits, and open draft PRs
        shell: bash
        env:
          FLEET_ORGANIZATION: ${{ matrix.organization }}
          FLEET_REPOSITORY_FILTER: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          args=(--apply --org "$FLEET_ORGANIZATION" --concurrency 1)
          if [[ -n "$FLEET_REPOSITORY_FILTER" ]]; then
            args+=(--repo "$FLEET_REPOSITORY_FILTER")
          fi
          node scripts/bootstrap-test-org-fleet.mjs "${args[@]}"

      - name: Record completion
        shell: bash
        env:
          FLEET_ORGANIZATION: ${{ matrix.organization }}
          FLEET_AUTHENTICATION: ${{ steps.auth.outputs.mode }}
        run: |
          {
            echo "## $FLEET_ORGANIZATION"
            echo
            echo "Authentication: $FLEET_AUTHENTICATION"
            echo
            echo "Repository creation/adoption, generated branch commits, and draft pull requests completed."
          } >> "$GITHUB_STEP_SUMMARY"
