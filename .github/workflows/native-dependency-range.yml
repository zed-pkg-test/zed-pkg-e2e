name: zed native dependency range contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zed_interfaces_ref:
        description: Immutable zed-interfaces commit to certify
        required: false
        default: c872714fdb9a811e4a01f70082dbd61252975f47

permissions:
  contents: read

concurrency:
  group: zed-native-dependency-range-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ZED_INTERFACES_REF: ${{ github.event.inputs.zed_interfaces_ref || 'c872714fdb9a811e4a01f70082dbd61252975f47' }}

jobs:
  native-dependency-range:
    name: Native dependency range and lock
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Require immutable interface pin
        run: |
          set -euo pipefail
          [[ "$ZED_INTERFACES_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out canary harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact zed-interfaces candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_REF }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install stable Rust with formatter and Clippy
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Verify formatter and deterministic schema
        run: |
          set -euo pipefail
          cd zed-interfaces
          cargo fmt --all -- --check
          test -s schemas/native-dependency-lock.json
          cp schemas/native-dependency-lock.json \
            "$RUNNER_TEMP/native-dependency-lock.checked-in.json"
          cargo run --locked --example generate_schemas
          git diff --exit-code -- schemas/native-dependency-lock.json
          cmp "$RUNNER_TEMP/native-dependency-lock.checked-in.json" \
            schemas/native-dependency-lock.json
          sha256sum schemas/native-dependency-lock.json \
            | tee "$RUNNER_TEMP/native-dependency-lock-schema.sha256"
          cargo run --locked --example generate_schemas
          sha256sum --check "$RUNNER_TEMP/native-dependency-lock-schema.sha256"
          git diff --exit-code -- schemas/native-dependency-lock.json

      - name: Run complete interface gates
        run: |
          set -euo pipefail
          cd zed-interfaces
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check

      - name: Compile and run external consumer offline
        run: |
          set -euo pipefail
          fixture=harness/fixtures/native-dependency-consumer
          cargo generate-lockfile --offline --manifest-path "$fixture/Cargo.toml"
          cargo run --locked --offline --manifest-path "$fixture/Cargo.toml"

      - name: Capture certification evidence
        if: always()
        run: |
          set +e
          evidence="$RUNNER_TEMP/native-dependency-range-evidence"
          mkdir -p "$evidence/src" "$evidence/examples" "$evidence/schemas" "$evidence/consumer"
          cp zed-interfaces/src/native_dependency.rs "$evidence/src/" 2>/dev/null
          cp zed-interfaces/src/lib.rs "$evidence/src/" 2>/dev/null
          cp zed-interfaces/examples/generate_schemas.rs "$evidence/examples/" 2>/dev/null
          cp zed-interfaces/schemas/native-dependency-lock.json "$evidence/schemas/" 2>/dev/null
          cp harness/fixtures/native-dependency-consumer/Cargo.lock "$evidence/consumer/" 2>/dev/null
          cp "$RUNNER_TEMP/native-dependency-lock-schema.sha256" "$evidence/" 2>/dev/null
          git -C zed-interfaces diff > "$evidence/certification.patch" 2>&1
          git -C zed-interfaces status --porcelain=v1 --untracked-files=all \
            > "$evidence/interfaces-status.txt" 2>&1

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-dependency-range-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-dependency-range-evidence
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
