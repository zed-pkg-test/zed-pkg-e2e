name: external nix export plan

on:
  pull_request:
    paths:
      - ".github/workflows/nix-export-plan.yml"
      - ".zed-nix-plan-cli-ref"
      - "scripts/nix_export_plan_canary.py"
      - "docs/nix-export-plan-canary.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix-export-plan.yml"
      - ".zed-nix-plan-cli-ref"
      - "scripts/nix_export_plan_canary.py"
      - "docs/nix-export-plan-canary.md"
  workflow_dispatch:
    inputs:
      zed_cli_ref:
        description: Optional immutable zed-cli commit override
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: external-nix-export-plan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Independent frozen plan replay on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Check out harness and reviewed pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
          show-progress: false

      - name: Load immutable CLI pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          override="${{ github.event.inputs.zed_cli_ref || '' }}"
          if [[ -n "$override" ]]; then
            ref="$override"
          else
            ref="$(tr -d '[:space:]' < harness/.zed-nix-plan-cli-ref)"
          fi
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'zed-cli=%s\n' "$ref"

      - name: Check out exact zed-cli implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ steps.pin.outputs.ref }}
          path: zed-cli
          persist-credentials: false
          show-progress: false

      - name: Check out immutable single-package fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg-test/node-lib
          ref: 222cdf57f48530fce8e6c1f58632d9676203512e
          path: node-fixture
          persist-credentials: false
          show-progress: false

      - name: Check out immutable polyglot fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg-test/polyglot-lib
          ref: 998964aa58e49595547650b4a8da407b7a2283a9
          path: polyglot-fixture
          persist-credentials: false
          show-progress: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Verify current interface pin and build exact CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-cli rev-parse HEAD)" = "${{ steps.pin.outputs.ref }}"
          test "$(git -C node-fixture rev-parse HEAD)" = 222cdf57f48530fce8e6c1f58632d9676203512e
          test "$(git -C polyglot-fixture rev-parse HEAD)" = 998964aa58e49595547650b4a8da407b7a2283a9
          grep -F 'rev = "c2e049006453c26ca8ca291783f681fce75cb01f"' zed-cli/Cargo.toml
          grep -F '#c2e049006453c26ca8ca291783f681fce75cb01f' zed-cli/Cargo.lock
          cargo fmt --all --check --manifest-path zed-cli/Cargo.toml
          cargo build --release --locked --manifest-path zed-cli/Cargo.toml --bin zed
          mkdir -p "$RUNNER_TEMP/zed-plan-bin"
          install -m 0755 zed-cli/target/release/zed "$RUNNER_TEMP/zed-plan-bin/zed"
          python3 - "$RUNNER_TEMP/zed-plan-bin/zed" "$RUNNER_TEMP/zed-plan-bin/SHA256SUMS" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          binary = Path(sys.argv[1])
          output = Path(sys.argv[2])
          output.write_text(f"{hashlib.sha256(binary.read_bytes()).hexdigest()}  zed\n", encoding="utf-8")
          PY
          cat "$RUNNER_TEMP/zed-plan-bin/SHA256SUMS"
          "$RUNNER_TEMP/zed-plan-bin/zed" --version

      - name: Run single-package, prebuilt-bin, and polyglot canaries
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-nix-export-plan-canary
        run: |
          set -euo pipefail
          test ! -e "$WORK_ROOT"
          python3 harness/scripts/nix_export_plan_canary.py \
            --node-fixture node-fixture \
            --polyglot-fixture polyglot-fixture \
            --zed "$RUNNER_TEMP/zed-plan-bin/zed" \
            --work-root "$WORK_ROOT"

      - name: Prove sources and workflow are immutable and read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C zed-cli status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C node-fixture status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C polyglot-fixture status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import re
          from pathlib import Path

          workflow = Path('harness/.github/workflows/nix-export-plan.yml').read_text()
          pin = Path('harness/.zed-nix-plan-cli-ref').read_text().strip()
          assert re.fullmatch(r'[0-9a-f]{40}', pin)
          assert 'permissions:\n  contents: read' in workflow
          assert 'persist-credentials: false' in workflow
          assert 'ubuntu-24.04' in workflow and 'macos-15' in workflow
          for exact in (
              '222cdf57f48530fce8e6c1f58632d9676203512e',
              '998964aa58e49595547650b4a8da407b7a2283a9',
              'c2e049006453c26ca8ca291783f681fce75cb01f',
          ):
              assert exact in workflow
          for match in re.finditer(r'^\s*uses:\s*([^\s]+)$', workflow, re.MULTILINE):
              assert re.search(r'@[0-9a-f]{40}$', match.group(1)), match.group(1)
          for forbidden in (
              'contents' + ': write',
              'git' + ' push',
              'pull_request' + '_target:',
              'id-token' + ': write',
              'packages' + ': write',
              'secrets' + ': inherit',
              'ref:' + ' main',
          ):
              assert forbidden not in workflow, forbidden
          PY

      - name: Collect failure diagnostics
        if: failure()
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-nix-export-plan-canary
        shell: bash
        run: |
          set +e
          diagnostics="$WORK_ROOT/diagnostics"
          mkdir -p "$diagnostics"
          git -C zed-cli status --porcelain=v1 --untracked-files=all \
            > "$diagnostics/zed-cli-status.txt" 2>&1
          git -C node-fixture status --porcelain=v1 --untracked-files=all \
            > "$diagnostics/node-fixture-status.txt" 2>&1
          git -C polyglot-fixture status --porcelain=v1 --untracked-files=all \
            > "$diagnostics/polyglot-fixture-status.txt" 2>&1
          python3 - "$WORK_ROOT" "$diagnostics/work-tree.txt" <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          rows = []
          if root.exists():
              for current, dirs, files in os.walk(root, followlinks=False):
                  current_path = Path(current)
                  for name in sorted(dirs + files):
                      path = current_path / name
                      relative = path.relative_to(root).as_posix()
                      if path.is_symlink():
                          rows.append(f"l {relative} -> {os.readlink(path)}")
                      elif path.is_dir():
                          rows.append(f"d {relative}")
                      else:
                          rows.append(f"f {relative}")
          output.write_text("\n".join(rows) + ("\n" if rows else ""), encoding="utf-8")
          PY

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-export-plan-diagnostics-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zed-nix-export-plan-canary/diagnostics
          if-no-files-found: warn
          retention-days: 3
          include-hidden-files: false
