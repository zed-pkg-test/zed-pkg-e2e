name: Zed Clients polyglot SDK matrix

on:
  pull_request:
    paths:
      - .github/workflows/reusable-polyglot-sdk-matrix.yml
      - .github/workflows/zed-clients-polyglot.yml
  workflow_dispatch:
    inputs:
      client_ref:
        description: zed-clients git ref to validate
        required: true
        default: main
        type: string
  repository_dispatch:
    types: [client-sdk-updated]
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: zed-clients-polyglot-sdk-${{ github.event.pull_request.number || inputs.client_ref || github.event.client_payload.client_ref || 'main' }}
  cancel-in-progress: true

jobs:
  sdk:
    uses: ./.github/workflows/reusable-polyglot-sdk-matrix.yml
    with:
      client_repository: zed-pkg/zed-clients
      client_ref: ${{ inputs.client_ref || github.event.client_payload.client_ref || 'main' }}
      interfaces_repository: zed-pkg/zed-interfaces
      interfaces_ref: main
    secrets:
      CLIENT_SDK_READ_TOKEN: ${{ secrets.CLIENT_SDK_READ_TOKEN }}
