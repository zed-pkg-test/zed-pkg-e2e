name: DEN-591 one-shot harness correction

on:
  push:
    branches:
      - agent/den-591-install-boundary-canaries

permissions:
  contents: write

concurrency:
  group: den-591-script-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-591-install-boundary-canaries
          fetch-depth: 0
          persist-credentials: true
      - name: Correct generated Dockerfiles and remove every store input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/install_boundaries.py')
          source = path.read_text(encoding='utf-8')

          old = '''    def remove_store_and_registry(self) -> None:
              self.log("\\n== Remove all registry and store inputs before image builds ==")
              shutil.rmtree(self.registry)
              for path in self.shm_paths:
                  if path.exists():
                      shutil.rmtree(path)
              if self.registry.exists() or any(path.exists() for path in self.shm_paths):
                  raise AssertionError("store or registry input survived the ownership boundary")

          '''
          new = '''    def remove_store_and_registry(self) -> None:
              self.log("\\n== Remove all registry and store inputs before image builds ==")
              shutil.rmtree(self.registry)
              publish_homes = self.root / "publish-homes"
              if publish_homes.exists():
                  shutil.rmtree(publish_homes)
              for path in self.shm_paths:
                  if path.exists():
                      shutil.rmtree(path)
              if (
                  self.registry.exists()
                  or publish_homes.exists()
                  or any(path.exists() for path in self.shm_paths)
              ):
                  raise AssertionError("store or registry input survived the ownership boundary")

          '''
          if source.count(old) != 1:
              raise SystemExit('expected exactly one store-removal block')
          source = source.replace(old, new)

          start = source.index('    def write_runtime_dockerfiles(self) -> tuple[Path, Path]:')
          end = source.index('    def build_and_roundtrip_images', start)
          replacement = '''    def write_runtime_dockerfiles(self) -> tuple[Path, Path]:
              node = self.dockerfiles / "node.Dockerfile"
              node.write_text(
                  "ARG NODE_IMAGE\\n"
                  "FROM ${NODE_IMAGE}\\n"
                  "WORKDIR /app\\n"
                  "COPY --chown=node:node . .\\n"
                  "USER node\\n"
                  "CMD [\\\"node\\\", \\\"src/main.js\\\"]\\n",
                  encoding="utf-8",
              )
              rust = self.dockerfiles / "rust.Dockerfile"
              rust.write_text(
                  "ARG RUST_IMAGE\\n"
                  "ARG DEBIAN_IMAGE\\n"
                  "FROM ${RUST_IMAGE} AS build\\n"
                  "WORKDIR /app\\n"
                  "COPY . .\\n"
                  "RUN cargo +1.90.0 build --release --offline\\n"
                  "FROM ${DEBIAN_IMAGE}\\n"
                  "WORKDIR /app\\n"
                  "COPY --from=build /app/target/release/rust-app /usr/local/bin/rust-app\\n"
                  "COPY --from=build --chown=65532:65532 /app/.vendor /app/.vendor\\n"
                  "COPY --from=build --chown=65532:65532 /app/.zed /app/.zed\\n"
                  "COPY --from=build --chown=65532:65532 /app/.zpkg.toml /app/.zpkg.toml\\n"
                  "COPY --from=build --chown=65532:65532 /app/.zpkg.lock /app/.zpkg.lock\\n"
                  "USER 65532:65532\\n"
                  "CMD [\\\"/usr/local/bin/rust-app\\\"]\\n",
                  encoding="utf-8",
              )
              return node, rust

          '''
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

          python3 -m py_compile scripts/install_boundaries.py
          python3 - <<'PY'
          import importlib.util
          import sys
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('install_boundaries', 'scripts/install_boundaries.py')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          harness = object.__new__(module.Harness)
          harness.dockerfiles = Path(tempfile.mkdtemp())
          node, rust = module.Harness.write_runtime_dockerfiles(harness)
          assert node.read_text(encoding='utf-8').splitlines()[:2] == [
              'ARG NODE_IMAGE', 'FROM ${NODE_IMAGE}'
          ]
          assert rust.read_text(encoding='utf-8').splitlines()[:3] == [
              'ARG RUST_IMAGE', 'ARG DEBIAN_IMAGE', 'FROM ${RUST_IMAGE} AS build'
          ]
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/install_boundaries.py
          git commit -m 'test(DEN-591): correct runtime boundary generation'
          git push origin HEAD:agent/den-591-install-boundary-canaries
