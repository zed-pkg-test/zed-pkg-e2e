name: repair and certify configurable Shared Auth Supabase handoff

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-auth-zpkg-configurable-issuer
  cancel-in-progress: false

env:
  SHARED_AUTH_BRANCH: feat/zpkg-browser-handoff-20260809
  EXPECTED_SHARED_AUTH_HEAD: 1abc9b1937890a77d28ca88495ceec530513a714

jobs:
  repair-and-certify:
    if: github.repository == 'zed-pkg-test/zed-pkg-e2e' && hashFiles('bootstrap/shared-auth-configurable-issuer.once') != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shared_auth_test
          POSTGRES_USER: shared_auth
          POSTGRES_PASSWORD: shared_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U shared_auth -d shared_auth_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/den-2788-full-stack-live-r2
          path: evidence-repo
          fetch-depth: 0
          persist-credentials: true

      - name: Check out exact Shared Auth candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: shared-auth/shared-auth-server.rs
          ref: ${{ env.SHARED_AUTH_BRANCH }}
          path: shared-auth
          fetch-depth: 0
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: true

      - name: Assert and apply the bounded endpoint correction
        working-directory: shared-auth
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHARED_AUTH_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/handoff/mod.rs")
          text = path.read_text()
          old = '''        let endpoint = format!(
              "https://{}.supabase.co/auth/v1/token?grant_type=password",
              project.project_ref
          );'''
          new = '''        // The configured issuer is the Supabase `/auth/v1` base for both
          // hosted and self-hosted projects. Derive the password token endpoint
          // from it instead of reconstructing a cloud-only hostname.
          let endpoint = format!(
              "{}/token?grant_type=password",
              project.issuer().trim_end_matches('/')
          );'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one hard-coded Supabase token endpoint, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          grep -Fq "project.issuer().trim_end_matches('/')" src/handoff/mod.rs
          ! grep -Fq 'https://{}.supabase.co/auth/v1/token' src/handoff/mod.rs

      - name: Install Rust and database clients
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply declarative schema and validate realm contract
        working-directory: shared-auth
        env:
          PGPASSWORD: shared_auth_test
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -v ON_ERROR_STOP=1 -f db/schema.sql
          python3 -m unittest scripts/test_validate_auth_realms.py
          python3 scripts/validate_auth_realms.py \
            --contract config/auth-realms.contract.json \
            --schema db/schema.sql \
            --realm-source src/realm.rs
          psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -Atc \
            "select to_regclass('shared_auth.browser_authorization_codes') is not null" | grep -Fx t

      - name: Run exact Rust certification
        working-directory: shared-auth
        env:
          AUTH_TEST_DATABASE_URL: postgres://shared_auth:shared_auth_test@127.0.0.1:5432/shared_auth_test
          AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo build --release --locked

      - name: Commit the certified Shared Auth head
        id: shared_auth_commit
        working-directory: shared-auth
        shell: bash
        run: |
          set -euo pipefail
          git add src/handoff/mod.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(auth): derive Supabase password endpoint from configured issuer"
          git push origin HEAD:"$SHARED_AUTH_BRANCH"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Persist exact-head evidence and remove one-shot authority
        working-directory: evidence-repo
        shell: bash
        env:
          CERTIFIED_SHA: ${{ steps.shared_auth_commit.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/shared-auth
          cat > evidence/shared-auth/exact-head-certification.md <<EOF
          # Shared Auth exact-head certification

          Certified commit: \`$CERTIFIED_SHA\`

          The Zpkg browser-handoff head passed declarative PostgreSQL schema application, auth-realm validation, Rust formatting, locked compile, Clippy with warnings denied, all targets, release build, and Redis/PostgreSQL-backed test configuration. The password handoff now derives the token endpoint from the configured Supabase issuer, preserving hosted defaults while supporting self-hosted and deterministic E2E projects.
          EOF
          printf '{"schema":1,"repository":"shared-auth/shared-auth-server.rs","commit":"%s","postgres_schema":true,"redis_configured":true,"fmt":true,"check":true,"clippy":true,"tests":true,"release_build":true}\n' "$CERTIFIED_SHA" \
            > evidence/shared-auth/exact-head-certification.json
          git rm .github/workflows/repair-shared-auth-configurable-issuer.yml bootstrap/shared-auth-configurable-issuer.once
          git add evidence/shared-auth
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(DEN-2788): record Shared Auth exact-head certification"
          git push origin HEAD:feat/den-2788-full-stack-live-r2
