name: zed gitops external dispatch canary

on:
  pull_request:
    paths:
      - .github/workflows/gitops-dispatch-canary.yml
      - scripts/gitops_dispatch_canary.py
      - scripts/gitops_dispatch_canary_entry.py
      - fixtures/external_dispatch_probe.rs
      - docs/gitops-dispatch-canary.md
  workflow_dispatch:
    inputs:
      candidate:
        description: Full immutable zed-pkg/zed-cli commit to certify
        required: false
        default: ace157406d04f338698b6dc93a77021b07560e72
        type: string

permissions:
  contents: read

concurrency:
  group: gitops-dispatch-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ZED_CLI_COMMIT: ${{ inputs.candidate || 'ace157406d04f338698b6dc93a77021b07560e72' }}

jobs:
  certify:
    name: gitops dispatch / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out independent certification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: product/zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify immutable product identity
        run: |
          set -euo pipefail
          [[ "$ZED_CLI_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C product/zed-cli rev-parse HEAD)" = "$ZED_CLI_COMMIT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run exact-source quality gates
        working-directory: product/zed-cli
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --lib external_subcommands::tests
          cargo test --locked --test external_gitops_dispatch
          cargo clippy --locked --lib --bin zed --bin zed-gitops --test external_gitops_dispatch -- -D warnings

      - name: Build exact release binaries
        working-directory: product/zed-cli
        run: |
          set -euo pipefail
          cargo build --locked --release --bin zed --bin zed-gitops

      - name: Select platform paths and compile probe executable
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed"
          gitops="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed-gitops"
          probe="$RUNNER_TEMP/zed-dispatch-probe"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            zed="${zed}.exe"
            gitops="${gitops}.exe"
            probe="${probe}.exe"
          fi
          rustc --edition=2024 fixtures/external_dispatch_probe.rs -O -o "$probe"
          echo "ZED_BINARY=$zed" >> "$GITHUB_ENV"
          echo "ZED_GITOPS_BINARY=$gitops" >> "$GITHUB_ENV"
          echo "DISPATCH_PROBE_BINARY=$probe" >> "$GITHUB_ENV"

      - name: Run independent black-box certification
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m py_compile scripts/gitops_dispatch_canary.py scripts/gitops_dispatch_canary_entry.py
          rm -rf scripts/__pycache__
          python scripts/gitops_dispatch_canary_entry.py \
            --zed "$ZED_BINARY" \
            --zed-gitops "$ZED_GITOPS_BINARY" \
            --probe "$DISPATCH_PROBE_BINARY" \
            --product product/zed-cli \
            --candidate "$ZED_CLI_COMMIT" \
            --work "$RUNNER_TEMP/gitops-dispatch-canary" \
            --evidence "artifacts/gitops-dispatch-${RUNNER_OS}-${RUNNER_ARCH}.json"

      - name: Require clean harness and product checkouts
        run: |
          set -euo pipefail
          harness_status="$(git status --porcelain --untracked-files=all | grep -vE '^\?\? artifacts/' || true)"
          test -z "$harness_status"
          git -C product/zed-cli diff --exit-code
          test -z "$(git -C product/zed-cli status --porcelain)"

      - name: Upload exact-head evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitops-dispatch-${{ runner.os }}-${{ runner.arch }}-${{ env.ZED_CLI_COMMIT }}
          path: artifacts/gitops-dispatch-${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
