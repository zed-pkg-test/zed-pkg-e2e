name: consolidated OCI interoperability contract

on:
  pull_request:
    paths:
      - ".github/workflows/oci-interop-consolidated.yml"
      - "scripts/oci_plan_contract.py"
      - "scripts/oci_layout_contract.py"
      - "scripts/oci_oras_push_contract.py"
      - "docs/oci-plan-contract.md"
      - "docs/oci-layout-contract.md"
      - "docs/oci-oras-push-contract.md"
  workflow_dispatch:
    inputs:
      zed_cli_ref:
        description: Exact 40-character zed-pkg/zed-cli OCI candidate
        required: true
        default: 172cdbc39a72cbf28fc3170d35bc4d3fd832f65d
        type: string

permissions:
  contents: read

concurrency:
  group: oci-interop-consolidated-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  HARNESS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  ZED_CLI_REF: ${{ inputs.zed_cli_ref || '172cdbc39a72cbf28fc3170d35bc4d3fd832f65d' }}
  ZED_INTERFACES_REF: 2082012d1903783a89200c3bd44d2659a6daf872
  NODE_LIB_REF: 2d41e658a382fdff27ef87a0db24dbaff280a685
  NODE_APP_REF: ef794674647b3620e711f4f855865f8ad3340498
  POLYGLOT_LIB_REF: e62ceb6337324a294d4fc861692a267ff0db97d0
  REGISTRY_IMAGE: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
  REGISTRY_HOST: 127.0.0.1:5000
  REGISTRY_USERNAME: zed-contract
  REGISTRY_PASSWORD: zed-contract-password-not-a-secret

jobs:
  contract:
    name: Exact plan, layout, and authenticated-push candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Validate immutable inputs
        run: |
          set -euo pipefail
          [[ "$HARNESS_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZED_CLI_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZED_INTERFACES_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NODE_LIB_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NODE_APP_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$POLYGLOT_LIB_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REGISTRY_IMAGE" =~ ^registry@sha256:[0-9a-f]{64}$ ]]

      - name: Check out exact harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HARNESS_REF }}
          path: harness
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact zed CLI candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact node library fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/node-lib
          ref: ${{ env.NODE_LIB_REF }}
          path: fixtures/node-lib
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact node application fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/node-app
          ref: ${{ env.NODE_APP_REF }}
          path: fixtures/node-app
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact polyglot fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/polyglot-lib
          ref: ${{ env.POLYGLOT_LIB_REF }}
          path: fixtures/polyglot-lib
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install exact stable ORAS CLI
        uses: oras-project/setup-oras@4fb5323ce5e4debde6f8fe277e461b0815a75992
        with:
          version: 1.3.2

      - name: Install declared Rust tools and registry prerequisites
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apache2-utils strace
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version
          oras version
          strace --version | head -1
          docker version

      - name: Verify exact checkouts and harness syntax
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$HARNESS_REF"
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_CLI_REF"
          test "$(git -C fixtures/node-lib rev-parse HEAD)" = "$NODE_LIB_REF"
          test "$(git -C fixtures/node-app rev-parse HEAD)" = "$NODE_APP_REF"
          test "$(git -C fixtures/polyglot-lib rev-parse HEAD)" = "$POLYGLOT_LIB_REF"
          test -z "${ZED_PKG_TOKEN:-}"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile \
            harness/scripts/oci_plan_contract.py \
            harness/scripts/oci_layout_contract.py \
            harness/scripts/oci_oras_push_contract.py

      - name: Generate exact combined lock and validate candidate
        run: |
          set -euo pipefail
          grep -F "rev = \"$ZED_INTERFACES_REF\"" zed-cli/Cargo.toml
          cargo update --manifest-path zed-cli/Cargo.toml \
            -p zed-interfaces \
            --precise "$ZED_INTERFACES_REF"
          grep -F "rev=$ZED_INTERFACES_REF#$ZED_INTERFACES_REF" zed-cli/Cargo.lock
          mkdir -p evidence/lock
          cp zed-cli/Cargo.lock evidence/lock/Cargo.lock
          sha256sum evidence/lock/Cargo.lock > evidence/lock/SHA256SUMS
          cargo fmt --all --check --manifest-path zed-cli/Cargo.toml
          cargo test --locked --manifest-path zed-cli/Cargo.toml --all-targets oci
          cargo test --locked --manifest-path zed-cli/Cargo.toml --all-targets cli_oci
          cargo test --locked --manifest-path zed-cli/Cargo.toml --all-targets oci_command
          cargo clippy --locked --manifest-path zed-cli/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed
          zed-cli/target/release/zed --version

      - name: Run immutable publication-plan contract
        run: |
          set -euo pipefail
          rm -rf evidence/plan
          python3 harness/scripts/oci_plan_contract.py \
            --zed zed-cli/target/release/zed \
            --strace "$(command -v strace)" \
            --node-lib fixtures/node-lib \
            --node-app fixtures/node-app \
            --polyglot-lib fixtures/polyglot-lib \
            --evidence evidence/plan

      - name: Run local image-layout contract
        run: |
          set -euo pipefail
          rm -rf evidence/layout
          python3 harness/scripts/oci_layout_contract.py \
            --zed zed-cli/target/release/zed \
            --strace "$(command -v strace)" \
            --node-lib fixtures/node-lib \
            --node-app fixtures/node-app \
            --polyglot-lib fixtures/polyglot-lib \
            --evidence evidence/layout

      - name: Start isolated basic-auth OCI registry
        run: |
          set -euo pipefail
          mkdir -p evidence registry-auth
          htpasswd -Bbn "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" > registry-auth/htpasswd
          chmod 600 registry-auth/htpasswd
          docker run --detach \
            --name zed-oci-contract-registry \
            --publish 127.0.0.1:5000:5000 \
            --volume "$PWD/registry-auth:/auth:ro" \
            --env REGISTRY_AUTH=htpasswd \
            --env REGISTRY_AUTH_HTPASSWD_REALM='Zed OCI Contract' \
            --env REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            "$REGISTRY_IMAGE"

          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
              "http://$REGISTRY_HOST/v2/" || true)
            if [[ "$status" == 200 ]]; then
              exit 0
            fi
            sleep 1
          done
          docker logs zed-oci-contract-registry >&2 || true
          echo 'registry did not become healthy' >&2
          exit 1

      - name: Run authenticated ORAS push contract
        run: |
          set -euo pipefail
          rm -rf evidence/push
          python3 harness/scripts/oci_oras_push_contract.py \
            --zed zed-cli/target/release/zed \
            --oras "$(command -v oras)" \
            --strace "$(command -v strace)" \
            --node-lib fixtures/node-lib \
            --registry "$REGISTRY_HOST" \
            --username "$REGISTRY_USERNAME" \
            --password "$REGISTRY_PASSWORD" \
            --evidence evidence/push

      - name: Capture and remove registry
        if: always()
        run: |
          set +e
          mkdir -p evidence
          docker inspect zed-oci-contract-registry > evidence/registry-inspect.json 2>&1
          docker logs zed-oci-contract-registry > evidence/registry.log 2>&1
          docker rm --force zed-oci-contract-registry
          rm -rf registry-auth

      - name: Reject test-password leakage from evidence
        if: always()
        run: |
          set -euo pipefail
          if grep --recursive --fixed-strings --binary-files=without-match \
            "$REGISTRY_PASSWORD" evidence; then
            echo 'test registry password leaked into uploaded evidence' >&2
            exit 1
          fi

      - name: Require clean exact checkouts
        if: always()
        run: |
          set -euo pipefail
          git -C zed-cli checkout -- Cargo.lock
          test -z "$(git -C harness status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C zed-cli status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C fixtures/node-lib status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C fixtures/node-app status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C fixtures/polyglot-lib status --porcelain=v1 --untracked-files=all)"

      - name: Upload consolidated OCI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-interop-consolidated-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false