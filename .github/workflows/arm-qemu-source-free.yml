name: Source-free ARM QEMU toolchain smoke
on:
  push:
    branches: [ci/source-free-arm-qemu-probe-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-cortexm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact source-free tree
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD^{tree}
      - name: Install ARM Clang, LLD and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 qemu-system-arm binutils
          clang-18 --version | head -1
          qemu-system-arm --version | head -1
      - name: Cross-link and execute two synthetic bare-metal ARM guests
        run: bash .github/ci/arm-qemu-source-free.sh
