name: oreslang-pr417-exact-mirror

on:
  push:
    branches:
      - ci/oreslang-pr417-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone public exact-tree mirror
        run: |
          git clone --depth=1 --branch ci/oreslang-pr417-rhs-20261006 \
            https://github.com/gha-indie-worker/gha-indie-worker-monorepo.git oreslang
          test "$(git -C oreslang rev-parse HEAD^{tree})" = "4d28294950c7ebc49c2b91d5d1c05b731525ea1a"

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0.2'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ github.token }}
          cache: maven

      - name: Focused RHS callable effects
        working-directory: oreslang
        run: >
          mvn -B -ntp -Dores.runtime.carriers=native
          -Dtest=RhsLambdaScopeTest,TrapOptionSemanticsTest test

      - name: Full JVM verification
        working-directory: oreslang
        run: mvn -B -ntp -Dores.runtime.carriers=native verify
