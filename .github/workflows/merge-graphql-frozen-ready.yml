name: merge frozen ready PRs through GraphQL

on:
  push:
    branches: [main]
    paths:
      - ".github/pr-merge/MERGE-GRAPHQL-FROZEN-READY"

permissions:
  contents: read

concurrency:
  group: merge-graphql-frozen-ready
  cancel-in-progress: false

jobs:
  merge:
    if: "${{ github.event.head_commit.message == 'chore: merge frozen ready PRs through GraphQL' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
    steps:
      - name: Check out trusted GraphQL-only merger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Revalidate, merge, and verify frozen exact heads
        shell: bash
        run: node .github/scripts/merge-graphql-frozen-ready.mjs
