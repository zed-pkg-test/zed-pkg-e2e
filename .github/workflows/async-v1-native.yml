name: Atto completed-Future compiled guest JVM and Native Image
on:
  pull_request:
    paths:
      - 'src/compiler/asyncv1/**'
      - 'tests/compiler/AttoAsyncV1CompilerProbe.java'
      - 'fixtures/async_v1/**'
      - 'ci/async/**'
      - '.github/workflows/async-v1-native.yml'
  push:
    branches: [feat/java-async-compiled-closed-future-v1-20261119]
permissions:
  contents: read
jobs:
  completed-future-compiled-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Compile positive and negative checked Atto source; execute JVM and Native Image
        env:
          ATTO_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ci/async/verify-compiled-completed-future.sh
