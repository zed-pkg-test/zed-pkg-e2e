name: revert duplicate lifecycle catalog edits

on:
  push:
    branches:
      - alexanderdmills/den-1439-mise-environment-e2e
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: lifecycle-catalog-revert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alexanderdmills/den-1439-mise-environment-e2e
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Restore lifecycle harness before the duplicate correction
        run: |
          set -euo pipefail
          git checkout 0a2c2f0ac9005e91007ddfdfe2bd05a02ec0dd5d -- scripts/lifecycle.py
          python3 -m py_compile scripts/lifecycle.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lifecycle.py
          git commit -m 'chore: defer lifecycle source-map fix to PR 24'
          git push origin HEAD:alexanderdmills/den-1439-mise-environment-e2e
