name: certify repaired zed inspect head

on:
  push:
    branches:
      - agent/den-2175-inspect-cli-contract
    paths:
      - .github/workflows/inspect-final-head-cert.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-final-head-cert
  cancel-in-progress: true

env:
  PRODUCT_REPO: zed-pkg/zed-cli
  PRODUCT_BRANCH: agent/den-2175-inspect-json-v1
  PRODUCT_PR: '235'
  EXPECTED_TIP_SUBJECT: 'style(DEN-2175): satisfy strict inspect Clippy gate'

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the self-repaired immutable product head
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${PRODUCT_REPO}.git"
          resolved=''
          for _ in $(seq 1 180); do
            sha="$(git ls-remote "$remote" "refs/heads/${PRODUCT_BRANCH}" | cut -f1)"
            if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              rm -rf "$RUNNER_TEMP/product-probe"
              git init -q "$RUNNER_TEMP/product-probe"
              git -C "$RUNNER_TEMP/product-probe" remote add origin "$remote"
              git -C "$RUNNER_TEMP/product-probe" fetch -q --depth=1 origin "$sha"
              subject="$(git -C "$RUNNER_TEMP/product-probe" show -s --format=%s FETCH_HEAD)"
              if [[ "$subject" == "$EXPECTED_TIP_SUBJECT" ]]; then
                resolved="$sha"
                break
              fi
            fi
            sleep 10
          done
          test -n "$resolved"
          echo "sha=$resolved" >> "$GITHUB_OUTPUT"
          echo "resolved_sha=$resolved" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove product PR points at the resolved head
        env:
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['PRODUCT_REPO']}/pulls/{os.environ['PRODUCT_PR']}"
          req = urllib.request.Request(url, headers={"Accept":"application/vnd.github+json","User-Agent":"zed-pkg-test-inspect-cert/1"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          assert data["state"] == "open", data["state"]
          assert data["head"]["ref"] == os.environ["PRODUCT_BRANCH"], data["head"]
          assert data["head"]["sha"] == os.environ["RESOLVED_SHA"], (data["head"]["sha"], os.environ["RESOLVED_SHA"])
          PY

  quality:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ZED_CLI_REF: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Install strict Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check rustfmt
        shell: bash
        run: cargo fmt --all --check --manifest-path zed-cli/Cargo.toml
      - name: Run library tests
        shell: bash
        run: cargo test --locked --manifest-path zed-cli/Cargo.toml --lib
      - name: Run inspect integration test
        shell: bash
        run: cargo test --locked --manifest-path zed-cli/Cargo.toml --test inspect_cli
      - name: Run Clippy with warnings denied
        shell: bash
        run: cargo clippy --locked --manifest-path zed-cli/Cargo.toml --all-targets -- -D warnings
      - name: Prove product branch stayed on the certified SHA
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote "https://github.com/${PRODUCT_REPO}.git" "refs/heads/${PRODUCT_BRANCH}" | cut -f1)"
          test "$current" = "$ZED_CLI_REF"

  contract:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      ZED_CLI_REF: ${{ needs.resolve.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build exact candidate
        run: |
          set -euo pipefail
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_CLI_REF"
          cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed
      - name: Prove offline JSON inspection never mutates project or loads credentials
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile
          repo = pathlib.Path.cwd()
          binary = repo / "zed-cli" / "target" / "release" / ("zed.exe" if os.name == "nt" else "zed")
          root = pathlib.Path(tempfile.mkdtemp(prefix="zed-inspect-", dir=pathlib.Path(os.environ.get("RUNNER_TEMP") or tempfile.gettempdir())))
          home = pathlib.Path(tempfile.mkdtemp(prefix="zed-home-", dir=pathlib.Path(os.environ.get("RUNNER_TEMP") or tempfile.gettempdir())))
          manifest = root / ".zpkg.toml"
          lock = root / ".zpkg.lock"
          staging = root / ".zpkg-staging"
          staging.mkdir()
          sentinel = staging / "sentinel"
          sentinel.write_text("must-survive", encoding="utf-8")
          manifest.write_text('[package]\norg = "acme"\nname = "inspect-fixture"\nversion = "1.0.0"\n\n[package.repository]\nvcs = "git"\nurl = "https://example.invalid/acme/inspect-fixture"\n', encoding="utf-8")
          lock.write_text("version = 1\n", encoding="utf-8")
          (home / "credentials.toml").write_text("malformed = [credential", encoding="utf-8")
          def snapshot(path):
              rows = {}
              for candidate in sorted(path.rglob("*")):
                  relative = candidate.relative_to(path).as_posix()
                  if candidate.is_symlink(): rows[relative] = ["symlink", os.readlink(candidate)]
                  elif candidate.is_file(): rows[relative] = ["file", hashlib.sha256(candidate.read_bytes()).hexdigest()]
                  elif candidate.is_dir(): rows[relative] = ["dir"]
              return rows
          env = os.environ.copy()
          env.update({"ZED_PKG_HOME":str(home),"ZED_PKG_TOKEN":"fake-env-token-that-must-not-escape","ZED_PKG_REGISTRY":"http://127.0.0.1:9"})
          def inspect():
              return subprocess.run([str(binary),"--token","fake-arg-token-that-must-not-escape","inspect","--format","json","--root",str(root.resolve())],cwd=root,env=env,text=True,capture_output=True,timeout=10,check=False)
          before = snapshot(root)
          result = inspect()
          after = snapshot(root)
          assert result.returncode == 0, result.stderr
          assert result.stderr == "", result.stderr
          assert result.stdout.count("\n") == 1, result.stdout
          report = json.loads(result.stdout)
          assert report["schema_version"].startswith("1."), report
          assert report["cli"] == {"implementation":"zed-pkg","command":"inspect","offline":True,"mutates_project":False,"loads_credentials":False}, report
          assert report["summary"]["recovery_pending"] is True, report
          assert report["summary"]["frozen_ready"] is False, report
          recovery = next(d for d in report["diagnostics"] if d["code"] == "RECOVERY_PENDING")
          action = recovery["actions"][0]
          assert action["argv"] == ["zed","install","--frozen"], action
          assert action["mutates_project"] is True, action
          assert action["requires_network"] is True, action
          assert action["executes_package_code"] is True, action
          assert before == after, (before, after)
          assert sentinel.read_text(encoding="utf-8") == "must-survive"
          assert "fake-env-token-that-must-not-escape" not in result.stdout + result.stderr
          assert "fake-arg-token-that-must-not-escape" not in result.stdout + result.stderr
          secret = "gh" + "p_fake_manifest_secret_that_must_not_escape"
          manifest.write_text(f'[package\nsecret = "{secret}"\n', encoding="utf-8")
          malformed_before = snapshot(root)
          malformed = inspect()
          malformed_after = snapshot(root)
          assert malformed.returncode == 0, malformed.stderr
          assert malformed.stderr == "", malformed.stderr
          malformed_report = json.loads(malformed.stdout)
          assert malformed_report["summary"]["health"] == "error", malformed_report
          assert any(d["code"] == "MANIFEST_INVALID" for d in malformed_report["diagnostics"]), malformed_report
          assert secret not in malformed.stdout + malformed.stderr
          assert malformed_before == malformed_after, (malformed_before, malformed_after)
          assert sentinel.read_text(encoding="utf-8") == "must-survive"
          print("certified", os.environ.get("RUNNER_OS_NAME"), os.environ["ZED_CLI_REF"])
          PY
      - name: Prove product branch stayed on the certified SHA
        run: |
          set -euo pipefail
          current="$(git ls-remote "https://github.com/${PRODUCT_REPO}.git" "refs/heads/${PRODUCT_BRANCH}" | cut -f1)"
          test "$current" = "$ZED_CLI_REF"
