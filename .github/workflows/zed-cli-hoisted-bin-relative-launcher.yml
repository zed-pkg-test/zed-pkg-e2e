name: Zed CLI hoisted-bin relative-launcher proof

on:
  push:
    branches:
      - proof/zed-cli-hoisted-bin-relative-launcher-20260924
    paths:
      - '.github/workflows/zed-cli-hoisted-bin-relative-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ZED_CLI_BASE: '44fcc6649464fe0b7a4a59e6d14485bed6907086'

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Fetch exact public zed-cli base
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/zed-pkg/zed-cli.git source
          git -C source checkout --detach "$ZED_CLI_BASE"
          test "$(git -C source rev-parse HEAD)" = "$ZED_CLI_BASE"
          test -z "$(git -C source status --porcelain --untracked-files=all)"

      - name: Apply exact hoisted-bin repair and regression
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ops.rs')
          text = path.read_text()
          old = r'''/// Hoist package-declared executables into `zed_modules/.bin/<name>` so
/// `zed run` and PATH-prepending wrappers find them without polluting the OS
/// PATH.
///
/// Hoisted bins are deliberately project-owned copies in both install modes.
/// In symlink mode the package target may resolve into the immutable global
/// store; chmod'ing that target would mutate the shared store inode for every
/// consumer. Copying the usually-small executable and setting permissions on
/// the destination preserves the store while retaining runnable bins.
fn hoist_bins(modules: &Path, bins: &BTreeMap<String, PathBuf>, _mode: InstallMode) -> Result<()> {
    if bins.is_empty() {
        return Ok(());
    }
    let bin_dir = modules.join(BIN_DIR);
    fs::create_dir_all(&bin_dir)?;
    for (name, target) in bins {
        if !target.exists() {
            eprintln!(
                "warning: bin `{name}` points at missing {}; skipping",
                target.display()
            );
            continue;
        }
        let destination = bin_dir.join(name);
        replace_dest(&destination)?;
        fs::copy(target, &destination)?;
        #[cfg(unix)]
        {
            use std::os::unix::fs::PermissionsExt;
            let mut permissions = fs::metadata(&destination)?.permissions();
            permissions.set_mode(permissions.mode() | 0o111);
            fs::set_permissions(&destination, permissions)?;
        }
    }
    Ok(())
}
'''
          new = r'''/// Hoist package-declared executables into `zed_modules/.bin/<name>` so
/// `zed run` and PATH-prepending wrappers find them without polluting the OS
/// PATH.
///
/// On Unix the hoisted entry is a project-local shim that execs the executable
/// at its package path. Byte-copying script launchers into `.bin` changes their
/// directory and breaks package-relative imports/resources (for example an ESM
/// launcher importing `../src/cli.mjs`). The relative shim keeps copy-mode
/// projects relocatable while preserving the launcher's package context.
///
/// Windows retains a project-owned copy because `zed run` already performs
/// extension/shebang dispatch there and portable symlink semantics are not
/// available.
fn hoist_bins(modules: &Path, bins: &BTreeMap<String, PathBuf>, _mode: InstallMode) -> Result<()> {
    if bins.is_empty() {
        return Ok(());
    }
    let bin_dir = modules.join(BIN_DIR);
    fs::create_dir_all(&bin_dir)?;
    for (name, target) in bins {
        if !target.exists() {
            eprintln!(
                "warning: bin `{name}` points at missing {}; skipping",
                target.display()
            );
            continue;
        }
        let destination = bin_dir.join(name);
        replace_dest(&destination)?;
        #[cfg(unix)]
        {
            use std::os::unix::fs::PermissionsExt;

            let relative = pathdiff_relative(&bin_dir, target)
                .to_string_lossy()
                .replace('\\', "/");
            let quoted = relative.replace('\'', "'\"'\"'");
            fs::write(
                &destination,
                format!("#!/bin/sh\nexec \"$(dirname \"$0\")\"/'{quoted}' \"$@\"\n"),
            )?;
            let mut permissions = fs::metadata(&destination)?.permissions();
            permissions.set_mode(permissions.mode() | 0o111);
            fs::set_permissions(&destination, permissions)?;
        }
        #[cfg(not(unix))]
        fs::copy(target, &destination)?;
    }
    Ok(())
}
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one hoist_bins implementation, found {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '''    #[test]\n    fn parse_age_units_and_default() {\n'''
          test = r'''    #[cfg(unix)]
    #[test]
    fn hoisted_bin_preserves_package_relative_launcher_context() -> Result<()> {
        use std::os::unix::fs::PermissionsExt;

        let temp = tempfile::tempdir()?;
        let modules = temp.path().join("zed_modules");
        let package = modules.join("acme/tool");
        fs::create_dir_all(package.join("bin"))?;
        fs::create_dir_all(package.join("src"))?;
        fs::write(package.join("src/payload.txt"), "package-relative-ok\n")?;
        let launcher = package.join("bin/tool");
        fs::write(
            &launcher,
            "#!/bin/sh\ncat \"$(dirname \"$0\")/../src/payload.txt\"\n",
        )?;
        let mut permissions = fs::metadata(&launcher)?.permissions();
        permissions.set_mode(permissions.mode() | 0o111);
        fs::set_permissions(&launcher, permissions)?;

        let bins = BTreeMap::from([("tool".to_string(), launcher)]);
        hoist_bins(&modules, &bins, InstallMode::Copy)?;

        let hoisted = modules.join(BIN_DIR).join("tool");
        let output = Command::new(&hoisted).output()?;
        assert!(output.status.success(), "{output:?}");
        assert_eq!(String::from_utf8(output.stdout)?, "package-relative-ok\n");
        let shim = fs::read_to_string(hoisted)?;
        assert!(shim.contains("exec \"$(dirname \"$0\")\"/"), "{shim}");
        assert!(shim.contains("../acme/tool/bin/tool"), "{shim}");
        Ok(())
    }

'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one test insertion marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, test + marker, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = 'src/ops.rs'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Canonical format and exact regression
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = 'src/ops.rs'
          cargo test --locked hoisted_bin_preserves_package_relative_launcher_context -- --exact --nocapture

      - name: Compile, unit-test, and lint the repaired library
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --lib
          cargo test --locked --lib
          cargo clippy --locked --lib -- -D warnings

      - name: Prove source confinement and publish exact proven blob as carrier evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$ZED_CLI_BASE"
          test "$(git -C source diff --name-only)" = 'src/ops.rs'
          git -C source diff --check
          mkdir -p evidence
          cp source/src/ops.rs evidence/zed-cli-ops.rs
          printf '%s\n' "$ZED_CLI_BASE" > evidence/zed-cli-base-sha.txt
          git -C source diff -- src/ops.rs > evidence/zed-cli-ops.patch
          git add evidence/zed-cli-ops.rs evidence/zed-cli-base-sha.txt evidence/zed-cli-ops.patch
          git diff --cached --check
          git config user.name 'zed-pkg-test proof automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'evidence: proven zed-cli hoisted-bin repair'
          git push origin HEAD:proof/zed-cli-hoisted-bin-relative-launcher-20260924
