# One-time encrypted credential handoff. Remove the START file after the selected apply run is dispatched.
name: secure fleet token handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/fleet-handoff/START"

permissions:
  contents: write

concurrency:
  group: secure-fleet-token-handoff
  cancel-in-progress: false

jobs:
  handoff:
    if: >-
      github.repository == 'zed-pkg-test/zed-pkg-e2e' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.removed, '.github/fleet-handoff/START')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publish an ephemeral encryption key for the selected organization
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LOGIN: ORESoftware
        run: |
          set -euo pipefail
          umask 077

          start_response="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/fleet-handoff/START?ref=$GITHUB_SHA")"
          handoff_organization="$(
            jq -r '.content' <<< "$start_response" \
              | tr -d '\n' \
              | base64 -d \
              | tr -d '\r' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          )"

          allowed_organizations=(
            all
            zed-pkg-test
            3fa-app-test
            declarative-migrations-test
            cliptown-test
            claritas-viz-test
            embedded-alerts-test
            evento-globolo-test
            fiducia-cloud-test
            memebank-test
            opto-sync-test
            quaestor-ledger-test
            sonus-auris-test
            messaging-intel-test
            scintilla-run-test
            file-tunnel-test
            shared-auth-test
            hypesiege-test
            hacker-house-medellin-test
            streempilot-test
          )
          allowed=false
          for candidate in "${allowed_organizations[@]}"; do
            if [[ "$candidate" == "$handoff_organization" ]]; then
              allowed=true
              break
            fi
          done
          if [[ "$allowed" != true ]]; then
            echo "::error::START must contain exactly one approved test organization or all"
            exit 1
          fi

          handoff_branch="agent/fleet-token-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          nonce="$(openssl rand -hex 32)"
          expires_at="$(date -u -d '+15 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          private_key="$RUNNER_TEMP/fleet-handoff-private.pem"
          public_key="$RUNNER_TEMP/fleet-handoff-public.pem"
          metadata="$RUNNER_TEMP/fleet-handoff-metadata.json"

          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:4096 \
            -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          fingerprint="$(openssl pkey -pubin -in "$public_key" -outform DER | sha256sum | awk '{print $1}')"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg organization "$handoff_organization" \
            --arg branch "$handoff_branch" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_sha "$GITHUB_SHA" \
            --arg nonce "$nonce" \
            --arg expected_login "$EXPECTED_LOGIN" \
            --arg fingerprint_sha256 "$fingerprint" \
            --arg expires_at "$expires_at" \
            '{
              repository: $repository,
              organization: $organization,
              branch: $branch,
              run_id: $run_id,
              run_attempt: $run_attempt,
              source_sha: $source_sha,
              nonce: $nonce,
              expected_login: $expected_login,
              fingerprint_sha256: $fingerprint_sha256,
              expires_at: $expires_at,
              algorithm: "RSA-OAEP-SHA256",
              ciphertext_path: ".github/fleet-handoff/ciphertext.b64"
            }' > "$metadata"

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$handoff_branch" \
            -f sha="$GITHUB_SHA" \
            --silent

          put_file() {
            local source_path="$1"
            local repository_path="$2"
            local message="$3"
            local encoded
            encoded="$(base64 -w0 "$source_path")"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$repository_path" \
              -f message="$message" \
              -f content="$encoded" \
              -f branch="$handoff_branch" \
              --silent
          }

          put_file "$public_key" ".github/fleet-handoff/public.pem" \
            "chore: publish ephemeral fleet handoff key"
          put_file "$metadata" ".github/fleet-handoff/metadata.json" \
            "chore: publish fleet handoff metadata"

          printf 'HANDOFF_BRANCH=%s\n' "$handoff_branch" >> "$GITHUB_ENV"
          printf 'HANDOFF_NONCE=%s\n' "$nonce" >> "$GITHUB_ENV"
          printf 'HANDOFF_ORGANIZATION=%s\n' "$handoff_organization" >> "$GITHUB_ENV"
          printf 'HANDOFF_PRIVATE_KEY=%s\n' "$private_key" >> "$GITHUB_ENV"
          printf 'HANDOFF_EXPIRES_AT=%s\n' "$expires_at" >> "$GITHUB_ENV"
          printf 'branch=%s\n' "$handoff_branch" >> "$GITHUB_OUTPUT"

          {
            echo "## Encrypted token handoff ready"
            echo
            echo "Selected organization: \`$handoff_organization\`"
            echo
            echo "Temporary branch: \`$handoff_branch\`"
            echo
            echo "Public-key fingerprint (SHA-256): \`$fingerprint\`"
            echo
            echo "Expires at: \`$expires_at\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Receive ciphertext, store the secret, and dispatch the selected fleet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LOGIN: ORESoftware
        run: |
          set -euo pipefail
          umask 077

          ciphertext_text="$RUNNER_TEMP/fleet-handoff-ciphertext.b64"
          ciphertext_binary="$RUNNER_TEMP/fleet-handoff-ciphertext.bin"
          payload_json="$RUNNER_TEMP/fleet-handoff-payload.json"
          found=false

          for _ in $(seq 1 180); do
            if response="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/fleet-handoff/ciphertext.b64?ref=$HANDOFF_BRANCH" 2>/dev/null)"; then
              jq -r '.content' <<< "$response" | tr -d '\n' | base64 -d > "$ciphertext_text"
              found=true
              break
            fi
            sleep 5
          done

          if [[ "$found" != true ]]; then
            echo "::error::No encrypted payload arrived before the handoff expired"
            exit 1
          fi

          base64 -d "$ciphertext_text" > "$ciphertext_binary"
          openssl pkeyutl -decrypt \
            -inkey "$HANDOFF_PRIVATE_KEY" \
            -in "$ciphertext_binary" \
            -out "$payload_json" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          payload_nonce="$(jq -er '.nonce | strings' "$payload_json")"
          fleet_token="$(jq -er '.token | strings' "$payload_json")"

          if [[ "$payload_nonce" != "$HANDOFF_NONCE" ]]; then
            echo "::error::Encrypted payload nonce mismatch"
            exit 1
          fi
          if (( ${#fleet_token} < 30 || ${#fleet_token} > 255 )); then
            echo "::error::Encrypted payload did not contain a plausible GitHub token"
            exit 1
          fi
          if [[ "$fleet_token" != ghp_* && "$fleet_token" != github_pat_* ]]; then
            echo "::error::Encrypted payload token prefix is not recognized"
            exit 1
          fi

          printf '::add-mask::%s\n' "$fleet_token"

          authenticated_login="$(GH_TOKEN="$fleet_token" gh api user --jq '.login')"
          if [[ "$authenticated_login" != "$EXPECTED_LOGIN" ]]; then
            echo "::error::Token authenticated as an unexpected GitHub account"
            exit 1
          fi

          if [[ "$HANDOFF_ORGANIZATION" == all ]]; then
            organizations=(
              zed-pkg-test
              3fa-app-test
              declarative-migrations-test
              cliptown-test
              claritas-viz-test
              embedded-alerts-test
              evento-globolo-test
              fiducia-cloud-test
              memebank-test
              opto-sync-test
              quaestor-ledger-test
              sonus-auris-test
              messaging-intel-test
              scintilla-run-test
              file-tunnel-test
              shared-auth-test
              hypesiege-test
              hacker-house-medellin-test
              streempilot-test
            )
          else
            organizations=("$HANDOFF_ORGANIZATION")
          fi
          for organization in "${organizations[@]}"; do
            GH_TOKEN="$fleet_token" gh api "orgs/$organization" --silent
          done

          printf '%s' "$fleet_token" \
            | GH_TOKEN="$fleet_token" gh secret set FLEET_GH_TOKEN \
                --repo "$GITHUB_REPOSITORY"

          if ! GH_TOKEN="$fleet_token" gh secret list --repo "$GITHUB_REPOSITORY" \
              | awk '{print $1}' | grep -Fxq FLEET_GH_TOKEN; then
            echo "::error::The encrypted repository secret could not be verified"
            exit 1
          fi

          GH_TOKEN="$fleet_token" gh workflow run apply-test-org-fleet.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f organization="$HANDOFF_ORGANIZATION" \
            -f authentication=pat \
            -f repository= \
            -f confirm=APPLY_TEST_FLEET

          unset fleet_token
          rm -f "$ciphertext_text" "$ciphertext_binary" "$payload_json" "$HANDOFF_PRIVATE_KEY"

          {
            echo
            echo "The encrypted \`FLEET_GH_TOKEN\` repository secret was stored successfully."
            echo
            echo "The \`$HANDOFF_ORGANIZATION\` apply workflow was dispatched on \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary handoff branch and key material
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          rm -f \
            "${HANDOFF_PRIVATE_KEY:-}" \
            "$RUNNER_TEMP/fleet-handoff-public.pem" \
            "$RUNNER_TEMP/fleet-handoff-metadata.json" \
            "$RUNNER_TEMP/fleet-handoff-ciphertext.b64" \
            "$RUNNER_TEMP/fleet-handoff-ciphertext.bin" \
            "$RUNNER_TEMP/fleet-handoff-payload.json"
          if [[ -n "${HANDOFF_BRANCH:-}" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/${HANDOFF_BRANCH#refs/heads/}" \
              --silent || true
          fi
