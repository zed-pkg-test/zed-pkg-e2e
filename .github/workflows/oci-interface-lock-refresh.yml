name: OCI consolidation materialization evidence

on:
  pull_request:
    paths:
      - ".github/workflows/oci-interface-lock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-consolidation-materialization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_REF: 46519548a84c9fa3a1c1d7d43208b3c396803643
  ZED_INTERFACES_REF: 2082012d1903783a89200c3bd44d2659a6daf872

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Check out exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install declared Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Generate exact lockfile and formatted candidate
        run: |
          set -euo pipefail
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_CLI_REF"
          grep -F "rev = \"$ZED_INTERFACES_REF\"" zed-cli/Cargo.toml
          cargo update --manifest-path zed-cli/Cargo.toml \
            -p zed-interfaces \
            --precise "$ZED_INTERFACES_REF"
          grep -F "rev=$ZED_INTERFACES_REF#$ZED_INTERFACES_REF" zed-cli/Cargo.lock
          cargo fmt --all --manifest-path zed-cli/Cargo.toml
          git -C zed-cli diff --check

          mkdir -p evidence/formatted-tree
          cp --parents \
            zed-cli/Cargo.lock \
            zed-cli/src/cli_oci.rs \
            zed-cli/src/oci_command.rs \
            zed-cli/src/oci.rs \
            zed-cli/src/oci_layout.rs \
            zed-cli/src/oci_push.rs \
            zed-cli/src/main.rs \
            zed-cli/src/lib.rs \
            zed-cli/src/completion.rs \
            zed-cli/src/nix_export_bundle/archive.rs \
            zed-cli/src/nix_export_bundle/templates.rs \
            zed-cli/tests/nix_export_bundle/common.rs \
            evidence/formatted-tree/
          git -C zed-cli diff --binary > evidence/formatted.patch
          sha256sum evidence/formatted-tree/zed-cli/Cargo.lock > evidence/SHA256SUMS
          git -C zed-cli status --short > evidence/status.txt

      - name: Run complete Rust validation
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path zed-cli/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path zed-cli/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed
          zed-cli/target/release/zed --help | grep -F 'oci'
          zed-cli/target/release/zed oci --help | grep -F 'plan'
          zed-cli/target/release/zed oci --help | grep -F 'push'
          zed-cli/target/release/zed interop nix bundle write --help | grep -F -- '--flake-lock'

      - name: Upload exact generated candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-consolidation-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false