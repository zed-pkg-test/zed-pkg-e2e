name: probe macOS paced fleet runner

on:
  push:
    branches: [agent/probe-macos-paced-runner]
    paths:
      - ".github/workflows/probe-macos-paced-runner.yml"

permissions:
  contents: read

concurrency:
  group: probe-macos-paced-runner
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install a pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: ''

      - name: Verify the fleet runtime without secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          git --version
          node --version
          bash --version | head -n 1
          node --check scripts/bootstrap-test-org-fleet-worktree-safe.mjs
          node scripts/validate-test-org-fleet.mjs
          node --test tests/bootstrap-retry-policy.test.mjs tests/paced-fleet-executor.test.mjs
          node -e 'fetch("https://api.github.com/rate_limit", {headers:{"user-agent":"zed-pkg-test-macos-probe"}}).then(r=>{if(!r.ok) throw new Error(String(r.status)); console.log("github-api-ok")})'
