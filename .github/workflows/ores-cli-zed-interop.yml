name: ores-cli zed-pkg interop

on:
  push:
    branches:
      - alex-oresc-zed-interop
  workflow_dispatch:

permissions:
  contents: read

env:
  ZED_CLI_SHA: 46c5e263bfc2b5c8c483fd5d7ffc7c61e538adbe

jobs:
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out immutable repaired zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: tmp/zed-cli
          persist-credentials: false

      - name: Install zed-cli declared Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(python3 - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('tmp/zed-cli/rust-toolchain.toml').read_text())
          print(data['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"

      - name: Certify exact zed-cli source reproducibly
        working-directory: tmp/zed-cli
        run: |
          cargo fmt --all -- --check
          cargo build --locked --release --bin zed

      - name: Create package-audit fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/oresc-zed-fixture"
          mkdir -p "$fixture/src"
          cat > "$fixture/Cargo.toml" <<'EOF'
          [package]
          name = "oresc-zed-fixture"
          version = "0.1.0"
          edition = "2021"
          license = "MIT"
          repository = "https://github.com/zed-pkg-test/zed-pkg-e2e"
          description = "zed-pkg and ores-cli audit interoperability fixture"
          EOF
          cat > "$fixture/src/lib.rs" <<'EOF'
          pub fn fixture() -> &'static str { "oresc-zed-fixture" }
          EOF
          cat > "$fixture/.zpkg.toml" <<'EOF'
          [package]
          org = "zed-pkg-test"
          name = "oresc-zed-fixture"
          version = "0.1.0"
          description = "zed-pkg and ores-cli audit interoperability fixture"
          license = "MIT"
          language = "rust"

          [package.repository]
          vcs = "git"
          url = "https://github.com/zed-pkg-test/zed-pkg-e2e"

          [build]
          command = "cargo build --release"
          outputs = ["target/release/liboresc_zed_fixture.rlib"]

          [publish.native]
          registry = "crates-io"
          package = "oresc-zed-fixture"

          [scripts]
          test = "cargo test"
          EOF
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"

      - name: Validate and pack fixture with repaired zed-cli
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/tmp/zed-cli/target/release/zed"
          "$zed" validate --manifest "$FIXTURE/.zpkg.toml"
          "$zed" inspect --root "$FIXTURE" --format json > "$RUNNER_TEMP/zed-inspect.json"
          test -s "$RUNNER_TEMP/zed-inspect.json"
          (cd "$FIXTURE" && cargo generate-lockfile && "$zed" pack)

      - name: Add and install canonical ores-cli through zed-pkg
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/tmp/zed-cli/target/release/zed"
          cd "$FIXTURE"
          ok=0
          for attempt in 1 2 3; do
            if "$zed" add oresoftware/ores-cli@^0.1; then
              ok=1
              break
            fi
            echo "zed registry add attempt $attempt failed" >&2
            sleep $((attempt * 2))
          done
          test "$ok" -eq 1
          "$zed" install --allow-build --adapter none
          test -f .zpkg.lock
          "$zed" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock
          "$zed" run oresc -- doctor

      - name: Run canonical ores-cli audits
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/tmp/zed-cli/target/release/zed"
          cd "$FIXTURE"
          "$zed" run oresc -- --no-json audit repo --path "$FIXTURE" --profile baseline
          "$zed" run oresc -- --no-json audit package --path "$FIXTURE"
