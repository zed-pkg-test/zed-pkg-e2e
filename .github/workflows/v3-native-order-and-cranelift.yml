name: Exact integrated lifecycle and parser regression
on:
  pull_request:
    branches: ['main']
    paths: ['.github/workflows/v3-native-order-and-cranelift.yml']
permissions: {}
jobs:
  java-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - name: Fetch and verify exact public source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.java.git 456b05ad8a6a159e9a98123f04fffed556568962
          git -C source -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 456b05ad8a6a159e9a98123f04fffed556568962
          test "$(git -C source rev-parse HEAD^{tree})" = 3c110925a471f2b44b385422a667a77f84600323
          test "$(git -C source write-tree)" = 3c110925a471f2b44b385422a667a77f84600323
          git -C source diff --quiet HEAD --
          test -z "$(git -C source ls-files --others --exclude-standard)"
          printf 'EXACT_PUBLIC_SOURCE|atto-lang/atto-source.java|456b05ad8a6a159e9a98123f04fffed556568962|3c110925a471f2b44b385422a667a77f84600323\n'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Run scoped compiler verification
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=TrapFailurePolicyTest,TrapResultSemanticsTest,CanonicalCallerTrapParityV1Test,AttoStrictTrapSourceAdmissionTest,GuestOrdinaryThrowTest,TypedValueMatchParameterTest,CheckedUnwrapPipelineExecutionTest -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
      - name: Main Python harness regression
        working-directory: source
        run: python3 -m unittest discover -s tests -p test_atto_libraries_v1_harness.py
  llvm-nio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 212f24d0b2291dfd45bd6d6e378caa5c987bac77
      SOURCE_TREE: 6a342f49dba8b98cf866d5f1ac44e99bf39c1abb
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - name: Exact public source
        run: |
          set -euo pipefail
          git init source
          cd source
          git -c credential.helper= -c core.askPass= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.llvm.git "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git fsck --no-dangling
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'EXACT_SOURCE sha=%s tree=%s\n' "$SOURCE_SHA" "$SOURCE_TREE"
      - name: Strict native build and focused self-owned teardown
        working-directory: source
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/build" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/build" --target oreslang-native-vm-nio-lifecycle-test -j2
          ctest --test-dir "$RUNNER_TEMP/build" -R '^native_vm_nio_lifecycle_and_rt_prestart$' --repeat until-fail:20 --output-on-failure --no-tests=error -V
      - name: Original full sanitizer gate
        working-directory: source
        env:
          ORES_NIO_EXPECT_HEAD: ${{ env.SOURCE_SHA }}
          ORES_NIO_EXPECT_TREE: ${{ env.SOURCE_TREE }}
        run: |
          set -euo pipefail
          bash scripts/test-native-vm-nio-host-sanitizers.sh
          echo SCOPE=NATIVE_HOST_SANITIZER_GATE
  cranelift-operator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check exact public Cranelift tree
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.cranelift.git e4f23ddebee7b67e16f0e0ff3ccef3266b534f7a
          git -C source -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = e4f23ddebee7b67e16f0e0ff3ccef3266b534f7a
          test "$(git -C source rev-parse HEAD^{tree})" = 490b592b543aaccf3a320adbd3f51ad68dddd560
          test "$(git -C source write-tree)" = 490b592b543aaccf3a320adbd3f51ad68dddd560
          git -C source diff --exit-code HEAD
      - name: Actual native regression
        working-directory: source
        run: cargo test --all-targets --locked
      - name: Formatting and lint differential
        if: always()
        working-directory: source
        run: |
          set -euo pipefail
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.cranelift.git 99fe0f708b3a1ee86f0a52215bd8ea857bc57c91
          git worktree add --detach "$RUNNER_TEMP/base" 99fe0f708b3a1ee86f0a52215bd8ea857bc57c91
          set +e
          (cd "$RUNNER_TEMP/base" && cargo fmt --all -- --check) > "$RUNNER_TEMP/base-fmt.log" 2>&1
          base_fmt=$?
          cargo fmt --all -- --check > "$RUNNER_TEMP/head-fmt.log" 2>&1
          head_fmt=$?
          cargo clippy --all-targets --locked -- -D warnings
          lint=$?
          set -e
          printf 'FORMAT_BASE=%s FORMAT_HEAD=%s STRICT_LINT=%s\n' "$base_fmt" "$head_fmt" "$lint"
          cat "$RUNNER_TEMP/head-fmt.log"
          test "$head_fmt" = 0
          test "$lint" = 0
