        run: |
          set -euo pipefail
          cargo test --manifest-path attolang-mirror/atto-source.rs/Cargo.toml --locked --offline --lib -- --nocapture
          cargo test --manifest-path attolang-mirror/atto-source.rs/Cargo.toml --locked --offline --test newtype_const_generic_admission -- --nocapture
          cargo test --manifest-path attolang-mirror/atto-source.rs/Cargo.toml --locked --offline --test newtype_scalar_guest -- --nocapture
          cargo test --manifest-path attolang-mirror/atto-source.rs/Cargo.toml --locked --offline --test newtype_runtime_guest -- --nocapture
      - name: Build attoc and execute static and runtime checked newtype Wasm guests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path attolang-mirror/atto-source.rs/Cargo.toml --locked --offline --bin attoc
          export ATTOC="$PWD/attolang-mirror/atto-source.rs/target/debug/attoc"
          node attolang-mirror/atto-source.rs/tests/newtype-scalar-guest.mjs
          node attolang-mirror/atto-source.rs/tests/newtype-runtime-guest.mjs
