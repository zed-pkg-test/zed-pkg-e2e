        run: |
          set -euo pipefail
          cargo test --manifest-path attolang-mirror/atto-source.rs/Cargo.toml --locked --offline --lib -- --nocapture
          cargo test --manifest-path attolang-mirror/atto-source.rs/Cargo.toml --locked --offline --test newtype_const_generic_admission -- --nocapture
