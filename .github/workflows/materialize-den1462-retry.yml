name: materialize corrected DEN-1462 export

on:
  pull_request:
    paths:
      - .github/workflows/materialize-den1462-retry.yml

permissions:
  contents: read

concurrency:
  group: materialize-den1462-retry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  DEN1462_REF: a914849da3c8e2556abccd437e6e539f320dcb3e

jobs:
  materialize:
    name: Validate and package DEN-1462
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact export candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.DEN1462_REF }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify immutable export candidate
        run: test "$(git -C source rev-parse HEAD)" = "$DEN1462_REF"

      - name: Install Rust validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Apply the complete reviewed export sequence
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/apply_den1462_mise_export.py
          python3 scripts/harden_den1462_export.py
          python3 scripts/fix_den1462_flags_contract.py
          python3 scripts/fix_den1462_selector_paths.py
          python3 scripts/harden_den1462_export_boundaries.py
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          cargo test --locked mise_export -- --nocapture
          cargo test --locked --test mise_export_cli -- --nocapture
          cargo test --locked cli::tests::environment_export_is_typed_and_rejects_ambiguous_write_modes -- --nocapture
          cargo test --locked cli::tests::cli_flags_toml_is_in_sync_with_clap -- --nocapture
          cargo clippy --locked --all-targets -- -D warnings

      - name: Remove temporary source materializers
        working-directory: source
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-den-1462-mise-export.yml \
            .github/workflows/apply-den-1462-export-boundaries.yml \
            scripts/apply_den1462_mise_export.py \
            scripts/harden_den1462_export.py \
            scripts/fix_den1462_flags_contract.py \
            scripts/fix_den1462_selector_paths.py \
            scripts/harden_den1462_export_boundaries.py
          git diff --check

      - name: Package the ordinary source delta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import tarfile

          source = Path('source')
          stage = Path('/tmp/den1462-materialized')
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)

          def lines(*args: str) -> list[str]:
              output = subprocess.check_output(['git', '-C', str(source), *args], text=True)
              return [line for line in output.splitlines() if line]

          changed = set(lines('diff', '--name-only', '--diff-filter=ACMRTUXB', 'HEAD'))
          changed.update(lines('ls-files', '--others', '--exclude-standard'))
          deleted = sorted(set(lines('diff', '--name-only', '--diff-filter=D', 'HEAD')))
          changed = sorted(changed)

          for relative in changed:
              src = source / relative
              if not src.is_file():
                  raise SystemExit(f'changed path is not a regular file: {relative}')
              dst = stage / 'files' / relative
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          (stage / 'base-sha.txt').write_text(
              subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True)
          )
          (stage / 'changed-files.txt').write_text('\n'.join(changed) + ('\n' if changed else ''))
          (stage / 'deleted-files.txt').write_text('\n'.join(deleted) + ('\n' if deleted else ''))

          with tarfile.open('/tmp/den1462-materialized.tar.gz', 'w:gz') as archive:
              archive.add(stage, arcname='den1462-materialized')
          PY

      - name: Upload validated DEN-1462 delta
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den1462-materialized-corrected
          path: /tmp/den1462-materialized.tar.gz
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
