name: mise tier-1 compatibility

on:
  pull_request:
    paths:
      - .github/workflows/mise-tier1-certification.yml
      - compat/mise/**
      - scripts/mise_tier1_certify.py
  workflow_dispatch:
    inputs:
      zed_ref:
        description: zed-pkg/zed-cli branch, tag, or commit to certify
        required: false
        default: feat/den-1420-mise-dev-adapter

permissions:
  contents: read

concurrency:
  group: mise-tier1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Tier 1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out certification repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out zed-cli
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ inputs.zed_ref || 'feat/den-1420-mise-dev-adapter' }}
          path: .zed-cli
          persist-credentials: false
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Build zed-cli
        working-directory: .zed-cli
        run: cargo build --locked

      - name: Select zed binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "ZED_BINARY=$GITHUB_WORKSPACE/.zed-cli/target/debug/zed.exe" >> "$GITHUB_ENV"
          else
            echo "ZED_BINARY=$GITHUB_WORKSPACE/.zed-cli/target/debug/zed" >> "$GITHUB_ENV"
          fi

      - name: Run tier-1 certification
        shell: bash
        run: |
          python scripts/mise_tier1_certify.py \
            --zed "$ZED_BINARY" \
            --fixtures compat/mise/fixtures \
            --report "mise-tier1-${RUNNER_OS}-${RUNNER_ARCH}.json"

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mise-tier1-${{ runner.os }}-${{ runner.arch }}
          path: mise-tier1-${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: warn
          retention-days: 14
