name: Atto exact public shift and frontend parity qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  shift-flow:
    if: github.head_ref == 'ci/atto-shift-proof-and-admission-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify exact public compiler source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= -c http.extraHeader= fetch --depth=1 https://github.com/atto-lang/atto-source.llvm.git a0b513eb3e766623301930eb9bcf9582b45715d1
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = a0b513eb3e766623301930eb9bcf9582b45715d1
          git -C source log -1 --format='%H %T'
          test -z "$(git -C source status --porcelain)"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 61a3e8656d2e23ab508151a18e0dbfe89ba86b64
          test "$(git -C source hash-object tests/formal/checked-shift/check_shift.py)" = a3dc5d425b6d4666c4d8eaed2242d0fe6bbb1fc8
          test "$(git -C source hash-object tests/formal/checked-shift/test_shift.py)" = 4513625af395245f0dad02a1204a06dd07bea412
      - name: Build production LLVM compiler and AOT auditor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 cmake ninja-build
          cmake -S source -B build -G Ninja -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$(llvm-config-18 --cmakedir)" -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build --target oreslang-llvmc --parallel 2
          rustc --edition=2021 -D warnings source/scripts/audit_no_gc_ir.rs -o build/oreslang-no-gc-ir-audit
      - name: Validate actual emitted shift IR and execute audited guest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv proof-env
          proof-env/bin/pip install --only-binary=:all: llvmlite==0.47.0
          proof-env/bin/python source/tests/formal/checked-shift/test_shift.py
          cat > shift.atto <<'ATTO'
          pub fnc left_shift(int a, int n): int { return a <<< n; }
          pub fnc right_shift(int a, int n): int { return a >>> n; }
          pub fnc sign_shift(int a, int n): int { return a ashr n; }
          pub fnc main(): int { return left_shift(8, 2) + right_shift(32, 2) + sign_shift(-8, 1) + 6; }
          ATTO
          build/oreslang-llvmc shift.atto > actual.ll
          cat actual.ll
          for pair in 'left_shift shl' 'right_shift lshr' 'sign_shift ashr'; do
            read -r symbol op <<< "$pair"
            proof-env/bin/python source/tests/formal/checked-shift/check_shift.py actual.ll "$symbol" "$op"
          done
          for level in 0 2; do
            ORESLANG_LLVMC="$PWD/build/oreslang-llvmc" ORES_NO_GC_IR_AUDIT="$PWD/build/oreslang-no-gc-ir-audit" ORESLANG_LLVM_AOT_OPT_LEVEL="$level" CLANG=clang-18 bash source/scripts/compile-aot.sh shift.atto "$PWD/shift-O$level"
            status=0
            "./shift-O$level" || status=$?
            test "$status" = 42
            echo "REAL_ATTO_SHIFT_GUEST_PASS O$level exit=$status"
          done
      - name: Require computed negative and oversized distances to trap
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          for op in '<<<' '>>>' 'ashr'; do
            for count in '(63 + 1)' '(0 - 1)'; do
              printf 'pub fnc sh(int a, int n): int { return a %s n; }\npub fnc main(): int { return sh(1, %s); }\n' "$op" "$count" > invalid.atto
              for level in 0 2; do
                ORESLANG_LLVMC="$PWD/build/oreslang-llvmc" ORES_NO_GC_IR_AUDIT="$PWD/build/oreslang-no-gc-ir-audit" ORESLANG_LLVM_AOT_OPT_LEVEL="$level" CLANG=clang-18 bash source/scripts/compile-aot.sh invalid.atto "$PWD/invalid-O$level"
                status=0
                "./invalid-O$level" || status=$?
                test "$status" -eq 132
                echo "REAL_ATTO_SHIFT_TRAP_PASS $op $count O$level"
              done
            done
          done

  result-idempotence:
    if: github.head_ref == 'ci/atto-shift-proof-and-admission-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify exact public Result forward-port
        shell: bash
        run: |
          set -euo pipefail
          git init source
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= -c http.extraHeader= fetch --depth=1 https://github.com/atto-lang/atto-source.llvm.git 098e0d77ca89f4d8c7a0cfc85f680127e9ac17d7
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 098e0d77ca89f4d8c7a0cfc85f680127e9ac17d7
          git -C source log -1 --format='%H %T'
          test -z "$(git -C source status --porcelain)"
          test "$(git -C source hash-object src/main/cpp/oreslang/frontend/Parser.cpp)" = 8926c26aff03f5449c1b1005d425287137d9587f
          test "$(git -C source hash-object src/main/cpp/oreslang/types/NativeSumTypes.hpp)" = a15c8503106d3513c1b762218a4a13094b81cc05
      - name: Build production LLVM compiler and AOT auditor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 cmake ninja-build
          cmake -S source -B build -G Ninja -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$(llvm-config-18 --cmakedir)" -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build --target oreslang-llvmc --parallel 2
          rustc --edition=2021 -D warnings source/scripts/audit_no_gc_ir.rs -o build/oreslang-no-gc-ir-audit
      - name: Execute actual idempotent Result source fixtures
        shell: bash
        run: |
          set -euo pipefail
          for name in ok err nested; do
            for level in 0 2; do
              ORESLANG_LLVMC="$PWD/build/oreslang-llvmc" ORES_NO_GC_IR_AUDIT="$PWD/build/oreslang-no-gc-ir-audit" ORESLANG_LLVM_AOT_OPT_LEVEL="$level" CLANG=clang-18 bash source/scripts/compile-aot.sh "source/tests/fixtures/trap-result-idempotent-$name.atto" "$PWD/guest-$name-O$level"
              status=0
              "./guest-$name-O$level" || status=$?
              test "$status" = 42
              echo "REAL_RESULT_IDEMPOTENCE_PASS $name O$level"
            done
          done
      - name: Require exact nominal type and scalar rejection diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for name in option wrong-type scalar; do
            status=0
            build/oreslang-llvmc "source/tests/fixtures/trap-result-idempotent-$name-reject.atto" > reject.ll 2> reject.err || status=$?
            test "$status" -ne 0
            test "$status" -lt 128
            test ! -s reject.ll
            cat reject.err
            case "$name" in
              option) grep -F 'native trap Option payload requires checked nested ownership ABI' reject.err;;
              wrong-type) grep -F 'native trap existing Result type does not match expected Result' reject.err;;
              scalar) grep -F 'native trap operand unsupported: only pure integer literals and checked arithmetic are lowered, or existing Result values' reject.err;;
            esac
            echo "RESULT_IDEMPOTENCE_REJECT_PASS $name"
          done
      - name: Preserve ordinary trap and terminal checked overflow gates
        shell: bash
        run: |
          set -euo pipefail
          bash source/scripts/test-trap-int-aot.sh "$PWD/build/oreslang-llvmc" clang-18 "$PWD/build/oreslang-no-gc-ir-audit" "$PWD/source/tests/fixtures/trap-int-native42.atto" "$PWD/source/tests/fixtures/trap-int-overflow-terminal.atto" "$PWD/source/scripts/compile-aot.sh"
  formatter-visibility:
    if: github.head_ref == 'ci/atto-shift-proof-and-admission-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact public current formatter and run focused regression
        shell: bash
        run: |
          set -euo pipefail
          git init source
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= -c http.extraHeader= fetch --depth=1 https://github.com/atto-lang/atto-format.git 48c9e34f8e1e6a57bc411d3112a63b0cf6907ded
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 48c9e34f8e1e6a57bc411d3112a63b0cf6907ded
          git -C source log -1 --format='%H %T'
          test -z "$(git -C source status --porcelain)"
          test "$(git -C source hash-object tests/export_visibility_provenance.rs)" = b639df8a339b81e2920a200d609be22a902041b5
          cd source
          cargo test --locked --test export_visibility_provenance
          cargo test --locked --test formatter
