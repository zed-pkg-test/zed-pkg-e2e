name: merge audited ready batch

on:
  push:
    branches: [main]
    paths:
      - ".github/pr-merge/MERGE-AUDITED-BATCH"

permissions:
  contents: read

concurrency:
  group: merge-audited-ready-batch
  cancel-in-progress: false

jobs:
  merge:
    if: "${{ github.event.head_commit.message == 'chore: merge audited ready batch' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
    steps:
      - name: Validate stored credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api user --jq '.login')" = "ORESoftware"

      - name: Check out the exact audited merger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Revalidate and merge audited exact heads
        shell: bash
        run: node .github/scripts/merge-audited-ready-batch.mjs
