name: Generate HHM test fleet expansion

on:
  push:
    branches:
      - agent/add-hhm-test-fleet
    paths:
      - scripts/add-hhm-test-fleet.mjs

permissions:
  contents: write

concurrency:
  group: generate-hhm-test-fleet
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'zed-pkg-test/zed-pkg-e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/add-hhm-test-fleet
          persist-credentials: true
          fetch-depth: 0
      - name: Generate deterministic manifest and contract changes
        run: |
          set -euo pipefail
          node --check scripts/add-hhm-test-fleet.mjs
          node scripts/add-hhm-test-fleet.mjs
          node scripts/validate-test-org-fleet.mjs
          node --test tests/test-org-fleet.test.mjs
          node scripts/export-test-org-fleet-index.mjs > "$RUNNER_TEMP/test-org-fleet-index.json"
          node -e "const x=require(process.argv[1]); if(x.pairCount!==19||x.specializedRepositoryCount!==319||x.managedRepositoryCount!==338||x.expectedRepositoryCount!==360) process.exit(1)" "$RUNNER_TEMP/test-org-fleet-index.json"
          git diff --check
      - name: Commit generated expansion to the branch
        env:
          BRANCH_NAME: agent/add-hhm-test-fleet
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bootstrap/test-org-fleet.json.gz.b64.parts \
            scripts/export-test-org-fleet-index.mjs \
            docs/test-org-fleet-index.md \
            tests/test-org-fleet.test.mjs \
            .github/workflows/apply-test-org-fleet.yml \
            .github/workflows/secure-fleet-token-handoff.yml
          git commit -m "test: add Hacker House Medellín test fleet"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
