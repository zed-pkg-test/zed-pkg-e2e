name: Atto exact-tree failed gate diagnostics
on:
  push:
    branches:
      - ci/atto-select-failure-diagnostics-20261126
  workflow_dispatch:
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - backend: java
            head: '822270fc0bc8b625d19208f0d249e03fc7df2fa3'
            tree: 'c11df0f90e7cf7cb6784cb29613ea1098f4f08cb'
            tests: 'ActorContinuationLedgerTest,ActorContinuationLedgerIntegrationTest,ActorCodeImageContinuationV1Test'
          - backend: java
            head: 'eddefbe63e074377663dfde9cf49229958d6ade9'
            tree: '4c5e4b7cb4e909be39cca9b692bb7c754c2bbb69'
            tests: 'DynamicSelectPlanGenerationTest'
          - backend: rs
            head: '913512c1e3d47eaf30a2a643857ea4e76ad45284'
            tree: 'd135f70c008335f7bf4625888b42484dfa9e69c5'
            tests: ''
    steps:
      - name: Anonymous public checkout and exact identity
        env:
          BACKEND: ${{ matrix.backend }}
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --depth=1 "https://github.com/atto-lang/atto-source.$BACKEND.git" "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$TREE_SHA"
      - name: Correct Java toolchain and execute JUnit
        if: matrix.backend == 'java'
        working-directory: source
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 not installed}"
          export PATH="$JAVA_HOME/bin:$PATH"
          javac -version
          mvn -version
          mvn -B -ntp -Dtest="$TESTS" test
      - name: Rust targeted compiler and guest diagnostics (format gate remains failed)
        if: matrix.backend == 'rs'
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 test --locked --test v2_select_plans
          cargo +1.85.1 build --locked --bin attoc
          node tests/node-v2-select-plans-guest.mjs
      - name: Check unchanged tracked tree
        if: always()
        working-directory: source
        env:
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_SHA"
          git diff --exit-code HEAD
