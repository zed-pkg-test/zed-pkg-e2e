name: bootstrap complete solver candidate-acquisition expectation

on:
  push:
    branches:
      - agent/den-1553-complete-solver-canary
    paths:
      - .github/workflows/complete-solver-overlap-count-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: complete-solver-overlap-count-bootstrap
  cancel-in-progress: false

jobs:
  update-and-remove-self:
    if: ${{ github.repository == 'zed-pkg-test/zed-pkg-e2e' && github.actor == 'ORESoftware' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact canary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1553-complete-solver-canary
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Require deterministic rejected-candidate acquisition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/complete_constraint_solver.py')
          text = path.read_text(encoding='utf-8')
          old = 'parse_prefetch(overlap_first.output) != (3, 5, 3)'
          new = 'parse_prefetch(overlap_first.output) != (3, 5, 4)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one first-overlap assertion, found {text.count(old)}')
          text = text.replace(old, new)
          old = 'parse_prefetch(overlap_second.output) != (3, 5, 3)'
          new = 'parse_prefetch(overlap_second.output) != (3, 5, 4)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one second-overlap assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile scripts/complete_constraint_solver.py
          grep -F 'parse_prefetch(overlap_first.output) != (3, 5, 4)' \
            scripts/complete_constraint_solver.py
          grep -F 'parse_prefetch(overlap_second.output) != (3, 5, 4)' \
            scripts/complete_constraint_solver.py

      - name: Remove the one-shot workflow and enforce bounded changes
        run: |
          set -euo pipefail
          rm .github/workflows/complete-solver-overlap-count-bootstrap.yml
          unexpected="$({ git status --porcelain=v1 || true; } \
            | awk '{print $2}' \
            | grep -Ev '^(scripts/complete_constraint_solver.py|.github/workflows/complete-solver-overlap-count-bootstrap.yml)$' \
            || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected bootstrap changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit the deterministic acquisition assertion and remove this workflow
        run: |
          set -euo pipefail
          git add \
            scripts/complete_constraint_solver.py \
            .github/workflows/complete-solver-overlap-count-bootstrap.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-1553): count deterministic rejected-candidate acquisition'
          git push origin HEAD:agent/den-1553-complete-solver-canary
