name: Java readonly shape ABI JVM + Graal Native Image
on:
  push:
    branches: [feat/java-shape-abi-native-proof-20261119]
  pull_request:
    paths:
      - 'src/shape/**'
      - 'tests/shape/**'
      - 'ci/shape/**'
      - '.github/workflows/java-shape-abi-native.yml'
permissions:
  contents: read
jobs:
  shape-host-jvm-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install GraalVM JDK25 Native Image
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Compile and execute real shape ABI host witness on JVM and native machine code
        env:
          ATTO_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ci/shape/verify-readonly-shape-native.sh
