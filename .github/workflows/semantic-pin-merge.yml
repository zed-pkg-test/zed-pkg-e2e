name: Semantic reconcile DEN-1418 certification pins

on:
  push:
    branches:
      - agent/den-1418-full-certification
    paths:
      - .github/workflows/semantic-pin-merge.yml

permissions:
  contents: write

concurrency:
  group: semantic-den-1418-certification
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the certified candidate pins to current harness structure
        env:
          EXPECTED_MAIN: 4c431458bd8dde8d4050f84c7f5914adf28049fe
          BRANCH_NAME: agent/den-1418-full-certification
          OLD_CLI: 8929a58c6591c7a964d7f91412665d7c8a4afdf3
          NEW_CLI: 3a91d64abf1fc0bdee6eab2ff804113b1429849f
        run: |
          set -euo pipefail
          workflow_head="$(git rev-parse HEAD)"
          original_head="$(git rev-parse HEAD^)"
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "$EXPECTED_MAIN" || {
            echo "main moved: expected $EXPECTED_MAIN, found $actual_main" >&2
            exit 23
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard "$original_head"
          git merge --no-commit --no-ff "$actual_main" || true

          files=(
            .github/workflows/e2e.yml
            .github/workflows/install-boundaries.yml
            .github/workflows/lifecycle.yml
          )
          git checkout "$actual_main" -- "${files[@]}"

          python3 - <<'PY'
          import os
          from pathlib import Path

          old = os.environ['OLD_CLI']
          new = os.environ['NEW_CLI']
          expected = {
              '.github/workflows/e2e.yml': 1,
              '.github/workflows/install-boundaries.yml': 2,
              '.github/workflows/lifecycle.yml': 2,
          }
          for filename, count in expected.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(
                      f'{filename}: expected {count} old candidate pins, found {actual}'
                  )
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          unresolved="$(git diff --name-only --diff-filter=U)"
          test -z "$unresolved" || {
            echo "unresolved paths:" >&2
            printf '%s\n' "$unresolved" >&2
            exit 24
          }
          test "$(grep -Roh "$NEW_CLI" "${files[@]}" | wc -l)" -eq 5
          ! grep -R "$OLD_CLI" "${files[@]}"

          git add -A
          git diff --cached --check
          git commit -m "Semantically promote the certified frozen-lock CLI baseline

          Preserve all current lifecycle, browser, install-boundary, Docker, OCI,
          and fixture assertions. Change only the five default immutable zed-cli
          pins certified by PR #10 and its exact-head workflow matrix."
          git push \
            --force-with-lease="refs/heads/$BRANCH_NAME:$workflow_head" \
            origin "HEAD:refs/heads/$BRANCH_NAME"
