name: Atto library allocation and compiler parity wave 4
on:
  push:
    branches: ['ci/atto-library-wave4-20261126']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: atto-platform-conformance
            head: 014e3ce77418ff438eb74b3efc1c4c0e2bcbabfa
            tree: 9d5af41fd71a2dacae108e86efb4ead5a4f0e8c7
            profile: allocation
          - repo: atto-platform-conformance
            head: e764150cfc76a313cac287bfdc3a21be4fc5f455
            tree: cb087cd59d527d04c39bf196db2fa6c0abc3eeab
            profile: arena-fixture
          - repo: atto-source.llvm
            head: 306ab06bc17096642e9fd9cdef677e2478aa19df
            tree: ddb967005590bd79758227f61e58c47451112242
            profile: llvm
          - repo: atto-source.rs
            head: c39241ea0d49ab276280f0c6e8b40cbeccb7516b
            tree: c401d020cf128cf26774e442ff574701211a2259
            profile: rust
          - repo: atto-source.js
            head: 1dc4804340a2a4609e564be66def1b633e1d33a0
            tree: 745e02dc1f2311795ef832e704d54db7334c6936
            profile: js
          - repo: atto-source.cranelift
            head: 1b4569aa1d409fae82663fcdf291b17ff91a0d4b
            tree: 3aab178099d1c0708a0bc9e0cfe12efe9818864d
            profile: cranelift
    steps:
      - name: Bind public exact head and tree
        env:
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_HEAD: ${{ matrix.head }}
          SOURCE_TREE: ${{ matrix.tree }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init source
          cd source
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$SOURCE_REPO.git" "$SOURCE_HEAD"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git log -1 --format='%H %T'
      - name: Allocation and copy target registry controls
        if: matrix.profile == 'allocation'
        working-directory: source
        run: node --test tests/default-allocation-copy-parity-v1.test.mjs tests/default-allocation-receipt-v1.test.mjs
      - name: Canonical arena guest identity
        if: matrix.profile == 'arena-fixture'
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters libraries/v1/alloc_arena_remaining_bounds.atto)" = c64314a4f5cb31ac26db5845db3e4ae2d4fb5576
          test -s libraries/v1/alloc_arena_remaining_bounds.atto
      - name: LLVM native compiler and full library corpus including arena guest
        if: matrix.profile == 'llvm'
        working-directory: source
        run: |
          set -euo pipefail
          python3 tests/test_atto_library_case_guard.py
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang llvm-dev
          cmake -S . -B "$RUNNER_TEMP/llvm" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "$RUNNER_TEMP/llvm" --parallel 2 --target oreslang-llvmc
          python3 tests/atto_libraries_v1.py --compiler "$RUNNER_TEMP/llvm/oreslang-llvmc" --clang "$(command -v clang)"
      - name: Rust compiler, constant import guests and library corpus
        if: matrix.profile == 'rust'
        working-directory: source
        run: |
          set -euo pipefail
          cargo build --locked --release --bin attoc
          node tests/constant_import_guest.mjs
          node tests/atto_libraries.mjs target/release/attoc
      - name: JavaScript compiler regressions and browser core
        if: matrix.profile == 'js'
        working-directory: source
        run: |
          set -euo pipefail
          npm run check
          npm test
          npm run test:core-browser
      - name: Cranelift host cache compiler tests and lint
        if: matrix.profile == 'cranelift'
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked --bin orescranelift incremental_object_tests::exact_native_object_reuse -- --nocapture
          cargo test --locked --lib sha256::tests:: -- --nocapture
          cargo test --locked --lib compiler_cache_key::tests:: -- --nocapture
          cargo test --locked --lib compiler_artifact_receipt::tests:: -- --nocapture
          cargo test --locked --lib compiler_artifact_store::tests:: -- --nocapture
          cargo test --locked --lib compiler_cache_key_policy::tests:: -- --nocapture
          cargo test --locked --lib compiler_cache_ledger::tests:: -- --nocapture
          cargo clippy --locked --all-targets -- -D warnings
      - name: Tracked source unchanged
        working-directory: source
        run: git diff --exit-code HEAD
