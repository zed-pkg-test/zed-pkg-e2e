name: bootstrap complete solver candidate repin

on:
  push:
    branches:
      - agent/den-1553-complete-solver-canary
    paths:
      - .github/workflows/complete-solver-repin-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: complete-solver-repin-bootstrap
  cancel-in-progress: false

jobs:
  repin-and-remove-self:
    if: ${{ github.repository == 'zed-pkg-test/zed-pkg-e2e' && github.actor == 'ORESoftware' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact canary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1553-complete-solver-canary
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Repin every default candidate reference exactly
        env:
          OLD_REF: 2cf69147ece5cdcc649de62dd043491de773a59b
          NEW_REF: 1c97cf3f0edde686200d245109351296b14d6e1a
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/complete-constraint-solver.yml')
          text = path.read_text(encoding='utf-8')
          old = os.environ['OLD_REF']
          new = os.environ['NEW_REF']
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two immutable candidate pins, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          grep -F "$NEW_REF" .github/workflows/complete-constraint-solver.yml
          ! grep -F "$OLD_REF" .github/workflows/complete-constraint-solver.yml

      - name: Remove the one-shot workflow and enforce bounded changes
        run: |
          set -euo pipefail
          rm .github/workflows/complete-solver-repin-bootstrap.yml
          unexpected="$({ git status --porcelain=v1 || true; } \
            | awk '{print $2}' \
            | grep -Ev '^(\.github/workflows/complete-constraint-solver.yml|\.github/workflows/complete-solver-repin-bootstrap.yml)$' \
            || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected repin changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit the immutable candidate pin and remove this workflow
        run: |
          set -euo pipefail
          git add \
            .github/workflows/complete-constraint-solver.yml \
            .github/workflows/complete-solver-repin-bootstrap.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(DEN-1553): repin yanked-policy solver candidate'
          git push origin HEAD:agent/den-1553-complete-solver-canary
