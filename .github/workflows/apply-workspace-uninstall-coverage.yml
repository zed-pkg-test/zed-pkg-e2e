name: apply workspace uninstall coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/augment_workspace_uninstall_coverage.py
      - .github/workflows/apply-workspace-uninstall-coverage.yml
  push:
    branches:
      - agent/recursive-install-e2e
    paths:
      - .github/augment_workspace_uninstall_coverage.py
      - .github/workflows/apply-workspace-uninstall-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-workspace-uninstall-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out E2E branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/recursive-install-e2e
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Apply uninstall coverage and immutable implementation pin
        run: |
          set -euo pipefail
          python3 .github/augment_workspace_uninstall_coverage.py
          python3 - <<'PY'
          from pathlib import Path

          old = "56e597b35deccc82bff7deee807f459a1def537d"
          new = "8cc6745c75fd46dabf2e383cbcfc14db5ff933da"
          workflows = [
              Path(".github/workflows/recursive-installs.yml"),
              Path(".github/workflows/recursive-installs-stress.yml"),
              Path(".github/workflows/install-recovery.yml"),
              Path(".github/workflows/org-app-installs.yml"),
          ]
          for path in workflows:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 2:
                  raise RuntimeError(f"{path}: expected two old pins, found {text.count(old)}")
              updated = text.replace(old, new)
              if updated.count(new) != 2:
                  raise RuntimeError(f"{path}: expected two new pins, found {updated.count(new)}")
              path.write_text(updated, encoding="utf-8")
          PY
          python3 -m py_compile scripts/org_app_installs.py
          grep -F 'workspace uninstall left projection' scripts/org_app_installs.py
          grep -F 'workspace post-uninstall restore accessed registry artifacts' scripts/org_app_installs.py
          grep -F 'workspace restored copy mode leaked symlinks' scripts/org_app_installs.py
          git diff --check

      - name: Commit and publish the validated E2E changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add \
            scripts/org_app_installs.py \
            .github/workflows/recursive-installs.yml \
            .github/workflows/recursive-installs-stress.yml \
            .github/workflows/install-recovery.yml \
            .github/workflows/org-app-installs.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'workspace uninstall coverage is already published'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: certify workspace uninstall and frozen restore'
          git fetch --no-tags origin agent/recursive-install-e2e
          git rebase origin/agent/recursive-install-e2e
          python3 -m py_compile scripts/org_app_installs.py
          grep -F '8cc6745c75fd46dabf2e383cbcfc14db5ff933da' \
            .github/workflows/recursive-installs.yml \
            .github/workflows/recursive-installs-stress.yml \
            .github/workflows/install-recovery.yml \
            .github/workflows/org-app-installs.yml
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/recursive-install-e2e
