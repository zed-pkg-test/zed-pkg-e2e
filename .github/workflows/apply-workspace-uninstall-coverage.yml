name: apply workspace uninstall coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/augment_workspace_uninstall_coverage.py
      - .github/workflows/apply-workspace-uninstall-coverage.yml
  push:
    branches:
      - agent/recursive-install-e2e
    paths:
      - .github/augment_workspace_uninstall_coverage.py
      - .github/workflows/apply-workspace-uninstall-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-workspace-uninstall-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out E2E branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/recursive-install-e2e
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Apply and validate workspace uninstall coverage
        run: |
          set -euo pipefail
          python3 .github/augment_workspace_uninstall_coverage.py
          python3 -m py_compile scripts/org_app_installs.py
          grep -F 'workspace uninstall left projection' scripts/org_app_installs.py
          grep -F 'workspace post-uninstall restore accessed registry artifacts' scripts/org_app_installs.py
          grep -F 'workspace restored copy mode leaked symlinks' scripts/org_app_installs.py
          git diff --check

      - name: Publish the validated script change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add scripts/org_app_installs.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'workspace uninstall coverage is already published'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: certify workspace uninstall and frozen restore'
          git fetch --no-tags origin agent/recursive-install-e2e
          git rebase origin/agent/recursive-install-e2e
          python3 -m py_compile scripts/org_app_installs.py
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/recursive-install-e2e
