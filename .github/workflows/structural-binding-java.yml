name: Java structural binder host JVM and Native Image
on:
  pull_request:
    paths:
      - 'src/compiler/shape/**'
      - 'tests/compiler/AttoStructuralBindingProbe.java'
      - 'ci/compiler/verify-structural-binding.sh'
permissions:
  contents: read
jobs:
  shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Check exact commit and run structural host witness
        env:
          ATTO_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$ATTO_EXPECTED_HEAD_SHA"
          bash ci/compiler/verify-structural-binding.sh
