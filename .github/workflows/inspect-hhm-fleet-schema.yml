name: Inspect HHM fleet schema

on:
  push:
    branches:
      - agent/add-hhm-test-fleet
    paths:
      - .github/workflows/inspect-hhm-fleet-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Print public manifest schema summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { readFleetManifest } from './scripts/read-fleet-manifest.mjs';

          const manifest = readFleetManifest(path.resolve('bootstrap/test-org-fleet.json.gz'));
          const summary = {
            schemaVersion: manifest.schemaVersion,
            profileNames: Object.keys(manifest.profiles ?? {}).sort(),
            policy: manifest.policy,
            pairs: manifest.pairs.map((pair) => ({
              sourceOrg: pair.sourceOrg,
              testOrg: pair.testOrg,
              defaultVisibility: pair.defaultVisibility,
              existingRepositories: pair.existingRepositories ?? [],
              repositoryCount: pair.repositories.length,
              samples: pair.repositories.slice(0, 4),
            })),
          };
          console.log(JSON.stringify(summary, null, 2));
          NODE
