name: One-shot Shared Auth rustfmt bridge

on:
  push:
    branches:
      - feat/den-2788-full-stack-live-r2
    paths:
      - bootstrap/shared-auth-rustfmt.once
      - .github/workflows/shared-auth-rustfmt-once.yml

permissions:
  contents: write

concurrency:
  group: shared-auth-rustfmt-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-and-repin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          path: evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Authorize the one-shot formatter and read the exact source request
        id: request
        working-directory: evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < bootstrap/shared-auth-rustfmt.once)" = \
            'FORMAT_SHARED_AUTH_RUSTFMT_V1'
          for key in repository branch expected_head; do
            value="$(jq -er --arg key "$key" '.[$key]' config/shared-auth-certification.json)"
            printf '%s=%s\n' "$key" "$value" >>"$GITHUB_OUTPUT"
          done

      - name: Check out the exact Shared Auth branch with push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.request.outputs.repository }}
          ref: ${{ steps.request.outputs.branch }}
          path: shared-auth
          fetch-depth: 0
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: true

      - name: Assert the branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C shared-auth rev-parse HEAD)" = \
            "${{ steps.request.outputs.expected_head }}"

      - name: Install stable rustfmt
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt

      - name: Format only Rust source and push the semantic no-op
        id: format
        working-directory: shared-auth
        shell: bash
        env:
          SOURCE_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check

          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            while IFS= read -r path; do
              case "$path" in
                *.rs) ;;
                *) echo "rustfmt changed a non-Rust path: $path" >&2; exit 1 ;;
              esac
            done <<<"$changed"

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.rs'
            git diff --cached --check
            git commit -m 'style(auth): apply rustfmt to certified handoff head'
            git push origin HEAD:"$SOURCE_BRANCH"
          fi

          new_sha="$(git rev-parse HEAD)"
          test "$new_sha" != "${{ steps.request.outputs.expected_head }}" || test -z "$changed"
          printf 'new_sha=%s\n' "$new_sha" >>"$GITHUB_OUTPUT"

      - name: Repin the exact source and prevent bot self-recertification
        working-directory: evidence
        shell: bash
        env:
          NEW_SHA: ${{ steps.format.outputs.new_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path('config/shared-auth-certification.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['expected_head'] = os.environ['NEW_SHA']
          config.pop('certified_head', None)
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          workflow_path = Path('.github/workflows/shared-auth-exact-head-certification.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          guard = "      github.actor != 'github-actions[bot]' &&\n"
          if guard not in workflow:
              needle = (
                  '    if: >-\n'
                  '      github.event.pull_request.head.repo.full_name == github.repository &&\n'
              )
              replacement = '    if: >-\n' + guard + (
                  '      github.event.pull_request.head.repo.full_name == github.repository &&\n'
              )
              if needle not in workflow:
                  raise SystemExit('exact-head workflow guard insertion point drifted')
              workflow = workflow.replace(needle, replacement, 1)
              workflow_path.write_text(workflow, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/shared-auth-certification.json \
            .github/workflows/shared-auth-exact-head-certification.yml
          if ! git diff --cached --quiet; then
            git commit -m 'test: repin rustfmt-clean Shared Auth head'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
