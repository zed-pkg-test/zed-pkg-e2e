# One-time cancellation of the superseded legacy recovery run.
name: cancel stale fleet recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-fleet-recovery.yml"
      - ".github/fleet-cancel/START"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.repository == 'zed-pkg-test/zed-pkg-e2e' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      STALE_RUN_ID: "30972717804"
    steps:
      - name: Cancel the superseded legacy recovery run
        shell: bash
        run: |
          set -euo pipefail
          read -r -a run_ids <<< "$STALE_RUN_IDS"

          for run_id in "${run_ids[@]}"; do
            endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            status="$(gh api "$endpoint" --jq '.status')"
            conclusion="$(gh api "$endpoint" --jq '.conclusion // ""')"

          if [[ "$status" == "completed" ]]; then
            echo "Legacy run already completed with conclusion: ${conclusion:-unknown}"
            exit 0
          fi

            status="$(gh api "$endpoint" --jq '.status')"
            if [[ "$status" != "completed" ]]; then
              echo "::error::Unable to cancel legacy recovery run $STALE_RUN_ID"
              exit 1
            fi
          done

          for _ in $(seq 1 90); do
            status="$(gh api "$endpoint" --jq '.status')"
            conclusion="$(gh api "$endpoint" --jq '.conclusion // ""')"
            if [[ "$status" == "completed" ]]; then
              echo "Legacy run stopped with conclusion: ${conclusion:-unknown}"
              exit 0
            fi
          done

          echo "::error::Legacy recovery run did not stop after cancellation"
          exit 1
