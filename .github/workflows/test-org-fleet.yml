# generated by zed-pkg-test/test-org-fleet
name: test organization fleet contract

on:
  pull_request:
    paths:
      - "bootstrap/test-org-fleet.json.gz.b64.parts/**"
      - "scripts/bootstrap-test-org-fleet.mjs"
      - "scripts/bootstrap-test-org-fleet.parts/**"
      - "scripts/test-org-fleet-integration-policy.mjs"
      - "scripts/export-test-org-fleet-index.mjs"
      - "scripts/read-fleet-manifest.mjs"
      - "scripts/validate-test-org-fleet.mjs"
      - "tests/test-org-fleet.test.mjs"
      - "tests/test-org-fleet-source-certification.test.mjs"
      - "tests/generated-plan-validator-gitlinks.test.mjs"
      - "tests/export-test-org-fleet-index.test.mjs"
      - "tests/idempotent-fleet-pr-repair.test.mjs"
      - "docs/test-org-fleet.md"
      - "docs/test-org-fleet-index.md"
      - "docs/test-org-source-certification.md"
      - ".github/fleet-handoff/START"
      - ".github/fleet-resume/START"
      - ".github/workflows/apply-test-org-fleet.yml"
      - ".github/workflows/resume-test-org-fleet.yml"
      - ".github/workflows/secure-fleet-token-handoff.yml"
      - ".github/workflows/test-org-fleet.yml"
  push:
    branches: [main]
    paths:
      - "bootstrap/test-org-fleet.json.gz.b64.parts/**"
      - "scripts/bootstrap-test-org-fleet.mjs"
      - "scripts/bootstrap-test-org-fleet.parts/**"
      - "scripts/test-org-fleet-integration-policy.mjs"
      - "scripts/export-test-org-fleet-index.mjs"
      - "scripts/read-fleet-manifest.mjs"
      - "scripts/validate-test-org-fleet.mjs"
      - "tests/test-org-fleet.test.mjs"
      - "tests/test-org-fleet-source-certification.test.mjs"
      - "tests/generated-plan-validator-gitlinks.test.mjs"
      - "tests/export-test-org-fleet-index.test.mjs"
      - "tests/idempotent-fleet-pr-repair.test.mjs"
      - "docs/test-org-fleet.md"
      - "docs/test-org-fleet-index.md"
      - "docs/test-org-source-certification.md"
      - ".github/fleet-handoff/START"
      - ".github/fleet-resume/START"
      - ".github/workflows/apply-test-org-fleet.yml"
      - ".github/workflows/resume-test-org-fleet.yml"
      - ".github/workflows/secure-fleet-token-handoff.yml"
      - ".github/workflows/test-org-fleet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-org-fleet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Parse scripts
        run: |
          node --check scripts/bootstrap-test-org-fleet.mjs
          node --check scripts/test-org-fleet-integration-policy.mjs
          node --check scripts/export-test-org-fleet-index.mjs
          node --check scripts/validate-test-org-fleet.mjs

      - name: Validate manifest
        run: node scripts/validate-test-org-fleet.mjs

      - name: Run fleet contract tests
        run: |
          node --test \
            tests/test-org-fleet.test.mjs \
            tests/test-org-fleet-source-certification.test.mjs \
            tests/generated-plan-validator-gitlinks.test.mjs \
            tests/export-test-org-fleet-index.test.mjs \
            tests/idempotent-fleet-pr-repair.test.mjs

      - name: Export canonical repository index
        run: |
          node scripts/export-test-org-fleet-index.mjs > /tmp/canonical-test-fleet-index.json
          node -e 'const p=require("/tmp/canonical-test-fleet-index.json"); if(p.expectedRepositoryCount!==360||p.managedRepositoryCount!==338||p.retainedRepositoryCount!==22) process.exit(1)'
          {
            echo '### Canonical paired test-fleet index'
            echo
            echo '```json'
            cat /tmp/canonical-test-fleet-index.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove dry run is write-free
        run: |
          env -u GH_TOKEN -u GITHUB_TOKEN \
            node scripts/bootstrap-test-org-fleet.mjs --dry-run --summary-json > /tmp/test-org-fleet-plan.json
          node -e 'const p=require("/tmp/test-org-fleet-plan.json"); if(p.mode!=="dry-run"||p.planned!==338||p.created||p.committed||p.pullRequests) process.exit(1)'
