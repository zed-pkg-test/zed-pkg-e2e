# generated by zed-pkg-test/test-org-fleet
name: test organization fleet contract

on:
  pull_request:
    paths:
      - "bootstrap/test-org-fleet.json.gz.b64.parts/**"
      - "scripts/bootstrap-test-org-fleet.mjs"
      - "scripts/bootstrap-test-org-fleet.parts/**"
      - "scripts/read-fleet-manifest.mjs"
      - "scripts/validate-test-org-fleet.mjs"
      - "tests/test-org-fleet.test.mjs"
      - "tests/git-transport-worktree.test.mjs"
      - "tests/fleet-recovery-control.test.mjs"
      - "docs/test-org-fleet.md"
      - ".github/fleet-cancel/START"
      - ".github/fleet-handoff/START"
      - ".github/fleet-resume/START"
      - ".github/workflows/apply-test-org-fleet.yml"
      - ".github/workflows/cancel-stale-fleet-recovery.yml"
      - ".github/workflows/dispatch-test-org-fleet-once.yml"
      - ".github/workflows/resume-test-org-fleet.yml"
      - ".github/workflows/secure-fleet-token-handoff.yml"
      - ".github/workflows/test-org-fleet.yml"
      - "bootstrap/execute-test-org-fleet-v2.once"
  push:
    branches: [main]
    paths:
      - "bootstrap/test-org-fleet.json.gz.b64.parts/**"
      - "scripts/bootstrap-test-org-fleet.mjs"
      - "scripts/bootstrap-test-org-fleet.parts/**"
      - "scripts/read-fleet-manifest.mjs"
      - "scripts/validate-test-org-fleet.mjs"
      - "tests/test-org-fleet.test.mjs"
      - "tests/git-transport-worktree.test.mjs"
      - "tests/fleet-recovery-control.test.mjs"
      - "docs/test-org-fleet.md"
      - ".github/fleet-cancel/START"
      - ".github/fleet-handoff/START"
      - ".github/fleet-resume/START"
      - ".github/workflows/apply-test-org-fleet.yml"
      - ".github/workflows/cancel-stale-fleet-recovery.yml"
      - ".github/workflows/dispatch-test-org-fleet-once.yml"
      - ".github/workflows/resume-test-org-fleet.yml"
      - ".github/workflows/secure-fleet-token-handoff.yml"
      - ".github/workflows/test-org-fleet.yml"
      - "bootstrap/execute-test-org-fleet-v2.once"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-org-fleet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Parse scripts
        run: |
          node --check scripts/bootstrap-test-org-fleet.mjs
          node --check scripts/validate-test-org-fleet.mjs

      - name: Validate manifest
        run: node scripts/validate-test-org-fleet.mjs

      - name: Run fleet contract tests
        run: node --test tests/test-org-fleet.test.mjs tests/git-transport-worktree.test.mjs tests/fleet-recovery-control.test.mjs

      - name: Prove dry run is write-free
        run: |
          env -u GH_TOKEN -u GITHUB_TOKEN \
            node scripts/bootstrap-test-org-fleet.mjs --dry-run --summary-json > /tmp/test-org-fleet-plan.json
          node -e 'const p=require("/tmp/test-org-fleet-plan.json"); if(p.mode!=="dry-run"||p.planned!==319||p.created||p.committed||p.pullRequests) process.exit(1)'
