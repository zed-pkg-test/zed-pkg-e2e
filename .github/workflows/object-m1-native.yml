name: Atto ObjectStorage M1 compiled guest JVM + Graal Native Image
on:
  push:
    branches: [feat/object-m1-aot-verifier-20261119]
  pull_request:
    paths:
      - 'ci/m1/**'
      - 'tools/atto_object_storage_m1.py'
      - 'src/memory/ActorRef32Arena.java'
      - 'tests/test_object_storage_m1.py'
      - 'fixtures/object_m1/**'
      - '.github/workflows/object-m1-native.yml'
permissions:
  contents: read
jobs:
  native-m1-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install GraalVM JDK25 Native Image
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: graalvm
          java-version: '25'
      - name: Execute compiled bounded Atto object guest on JVM and real Native Image
        env:
          ATTO_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: bash ci/m1/verify-object-storage-native.sh
