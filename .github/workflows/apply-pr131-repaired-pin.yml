name: apply PR 131 repaired certification pin

on:
  push:
    branches:
      - test/den-1462-pr131-repaired-head

permissions:
  contents: write

concurrency:
  group: pr131-repaired-certification-pin
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/den-1462-pr131-repaired-head
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Pin the repaired immutable exporter head
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '5ad549c544276a713dd5de353f6fbe8ddd4b53d7': 'e8367425baa545dd045fc033e5fea4396aa31554',
              '7c5445b2cd15a503c8004da98cac31451ea2f1d4': 'e8367425baa545dd045fc033e5fea4396aa31554',
          }
          for name in [
              '.github/workflows/mise-export-boundaries.yml',
              'docs/mise-export-boundaries.md',
          ]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/apply-pr131-repaired-pin.yml
          git diff --check
          grep -R 'e8367425baa545dd045fc033e5fea4396aa31554' \
            .github/workflows/mise-export-boundaries.yml \
            docs/mise-export-boundaries.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(DEN-1462): certify repaired exporter head'
          git push origin HEAD:test/den-1462-pr131-repaired-head
