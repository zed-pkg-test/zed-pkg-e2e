name: DEN-2725 refresh Windows canary

on:
  push:
    branches:
      - agent/den-2725-gitops-dispatch-certification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2725-gitops-dispatch-certification
          fetch-depth: 0

      - name: Apply the reviewed cross-platform correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('scripts/gitops_dispatch_canary.py')
          text = script.read_text(encoding='utf-8')
          old_helper = 'def executable_name(stem: str) -> str:\n    return f"{stem}.exe" if os.name == "nt" else stem\n\n\n'
          new_helper = old_helper + 'def gitops_usage(suffix: str = "") -> str:\n    return f"Usage: {executable_name(\'zed-gitops\')}{suffix}"\n\n\n'
          if text.count(old_helper) != 1:
              raise SystemExit(f'expected one executable helper marker, found {text.count(old_helper)}')
          text = text.replace(old_helper, new_helper, 1)
          replacements = {
              'require("Usage: zed-gitops validate" in combined(direct_help), combined(direct_help))': 'require(gitops_usage(" validate") in combined(direct_help), combined(direct_help))',
              'require("Usage: zed-gitops validate" in routed_help_text, routed_help_text)': 'require(gitops_usage(" validate") in routed_help_text, routed_help_text)',
              'require("Usage: zed-gitops" in combined(alias_help), combined(alias_help))': 'require(gitops_usage() in combined(alias_help), combined(alias_help))',
              'require("Usage: zed-gitops validate" in combined(precedence), combined(precedence))': 'require(gitops_usage(" validate") in combined(precedence), combined(precedence))',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one usage assertion, found {text.count(old)}: {old}')
              text = text.replace(old, new, 1)
          script.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/gitops-dispatch-canary.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          old_sha = '78557641aebf313652886a03d04d8b8c73a748f6'
          new_sha = 'ace157406d04f338698b6dc93a77021b07560e72'
          if workflow_text.count(old_sha) != 2:
              raise SystemExit(f'expected two pinned candidate references, found {workflow_text.count(old_sha)}')
          workflow.write_text(workflow_text.replace(old_sha, new_sha), encoding='utf-8')
          PY
          python3 -m py_compile scripts/gitops_dispatch_canary.py
          rm -rf scripts/__pycache__
          git diff --check

      - name: Commit the corrected canary and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-den-2725-refresh-canary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(DEN-2725): accept Windows executable suffixes'
          git push origin HEAD:agent/den-2725-gitops-dispatch-certification
