name: Atto public Rust checked shift guest qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  rust-shifts:
    if: github.head_ref == 'ci/atto-rust-checked-shifts-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify exact public Rust compiler inputs
        shell: bash
        run: |
          set -euo pipefail
          git init source
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= -c http.extraHeader= fetch --depth=1 https://github.com/atto-lang/atto-source.rs.git b46a6f12b190ac8d58417c35efc75c924efd2603
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = b46a6f12b190ac8d58417c35efc75c924efd2603
          git -C source log -1 --format='%H %T'
          test -z "$(git -C source status --porcelain)"
          test "$(git -C source hash-object src/wasm.rs)" = 8415f8752a09230fb483ce4e7abb8007c8011259
          test "$(git -C source hash-object src/check.rs)" = 4ae1f2e42ad604bd411859cc8a7ff56f1ab8a542
      - name: Build real native compiler and run focused guest checks
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --bin attoc
          ATTOC="$PWD/target/release/attoc" node tests/checked-shift-distance.mjs
      - name: Run library and browser compiler regression suite
        if: ${{ !cancelled() }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib
          rustup target add wasm32-unknown-unknown
          cargo rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          ATTOC="$PWD/target/release/attoc" node tests/conformance.mjs
