name: scintilla-cli 19 Zed dependency proof

on:
  pull_request:
    paths:
      - ".github/workflows/scintilla-cli-19-zed-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-lock-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
      SOURCE_SHA: c847e19a1474eaf0123a06a915acaecaf3c234dd
      ZED_CLI_SHA: 17412050a0f4c4f963008f0de9abf3651d42af08
      ZED_PKG_INSTALL_MODE: copy
    steps:
      - name: Checkout evidence repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Validate cross-org authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api repos/scintilla-run/scintilla-cli --silent

      - name: Configure ephemeral GitHub authorization
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Clone exact source PR head
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/scintilla-run/scintilla-cli.git source
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build immutable Zed CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/zed-pkg/zed-cli.git zed-cli
          git -C zed-cli checkout --detach "$ZED_CLI_SHA"
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_CLI_SHA"
          cargo build --manifest-path zed-cli/Cargo.toml --release --locked --bin zed
          ./zed-cli/target/release/zed --version

      - name: Resolve exact Zed package graph
        shell: bash
        run: |
          set -euo pipefail
          cd source
          ../zed-cli/target/release/zed install
          test -f .zpkg.lock
          test -f .vendor/.zed/oresoftware/api-docs/rust/Cargo.toml
          grep -F 'name = "ores-api-docs"' .vendor/.zed/oresoftware/api-docs/rust/Cargo.toml
          grep -F 'version = "0.1.0"' .vendor/.zed/oresoftware/api-docs/rust/Cargo.toml
          grep -F 'oresoftware/api-docs' .zpkg.lock
          ../zed-cli/target/release/zed install --frozen

      - name: Refresh Cargo lock against installed Zed packages
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/tmp/scintilla-cli-19-metadata.json
          grep -F 'name = "ores-api-docs"' Cargo.lock
          grep -F 'name = "ores-clis-core"' Cargo.lock

      - name: Run source tests with refreshed locks
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo test --all-targets --locked

      - name: Record immutable evidence digests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          sha256sum .zpkg.lock Cargo.lock
          printf '%s\n' "$SOURCE_SHA" > /tmp/source-sha.txt
          printf '%s\n' "$ZED_CLI_SHA" > /tmp/zed-cli-sha.txt

      - name: Upload generated lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scintilla-cli-19-generated-locks
          if-no-files-found: error
          retention-days: 7
          path: |
            source/.zpkg.lock
            source/Cargo.lock
            /tmp/source-sha.txt
            /tmp/zed-cli-sha.txt
            /tmp/scintilla-cli-19-metadata.json

      - name: Remove ephemeral GitHub authorization
        if: always()
        shell: bash
        run: git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf || true
