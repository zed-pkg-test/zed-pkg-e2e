name: IDE integration sandbox

on:
  workflow_dispatch:
  pull_request:
    paths: ["ide-integrations/**", ".github/workflows/ide-integration-sandbox.yml"]
  push:
    branches: [main]
    paths: ["ide-integrations/**", ".github/workflows/ide-integration-sandbox.yml"]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: python ide-integrations/verify_matrix.py ide-integrations/parity-matrix.json

  sublime:
    strategy:
      fail-fast: false
      matrix: {python-version: ["3.8", "3.14"]}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-sublimetext
          ref: c3153867dff0b560946c9b7e287ed50366b87e6c
          path: integration
      - uses: actions/checkout@v4
        with: {path: e2e}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - working-directory: integration
        run: python -m compileall -q zed_pkg_insights zed_sublimetext.py
      - working-directory: integration
        run: python -m unittest discover -s tests -v
      - run: python e2e/ide-integrations/sandbox_sublime.py integration
      - working-directory: integration
        run: python scripts/build-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-sublime-${{ matrix.python-version }}
          path: integration/dist/ZedPackageInsights.sublime-package
          if-no-files-found: error

  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-intellij
          ref: 7282fdbc7046bb2ba58369b59ef627211033e145
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.1.0"}
      - run: gradle --stacktrace check buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-jetbrains
          path: build/distributions/*.zip
          if-no-files-found: error

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-vscode
          ref: 9754f10e44235828547cbeeb05e43c5786673af9
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm test
      - run: npm run verify
      - run: mkdir -p dist && npx --yes @vscode/vsce@3.9.2 package --out dist/zed-package-insights.vsix
      - uses: actions/upload-artifact@v4
        with: {name: sandbox-vscode, path: dist/zed-package-insights.vsix, if-no-files-found: error}

  eclipse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-eclipse
          ref: e65e8086f328a20adf3f941e1be988d0d757dc0f
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: mvn --batch-mode test

  xcode:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-xcode
          ref: 654f96f9c1d3ee80afc3034a883cb9083caefe00
      - run: swift test
      - run: swift build -c release

  visual-studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-visual-studio
          ref: a3520ea8aa19ecbdaa4c71e77d01af6407a7e05f
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet test Zed.VisualStudio.sln --configuration Release

  qtcreator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-qtcreator
          ref: 0372ccd4100e369d9e4593d3df66d8b2b507886a
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
