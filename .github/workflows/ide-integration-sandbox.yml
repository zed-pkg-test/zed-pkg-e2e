name: IDE integration sandbox

on:
  workflow_dispatch:
  pull_request:
    paths: ["ide-integrations/**", ".github/workflows/ide-integration-sandbox.yml"]
  push:
    branches: [main]
    paths: ["ide-integrations/**", ".github/workflows/ide-integration-sandbox.yml"]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - run: python ide-integrations/verify_matrix.py ide-integrations/parity-matrix.json

  sublime:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {python-version: ["3.8", "3.14"]}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-sublimetext
          ref: c3153867dff0b560946c9b7e287ed50366b87e6c
          path: integration
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: e2e, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python-version }}"}
      - working-directory: integration
        run: python -m compileall -q zed_pkg_insights zed_sublimetext.py
      - working-directory: integration
        run: python -m unittest discover -s tests -v
      - run: python e2e/ide-integrations/sandbox_sublime.py integration
      - working-directory: integration
        run: python scripts/build-package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-sublime-${{ matrix.python-version }}
          path: integration/dist/ZedPackageInsights.sublime-package
          if-no-files-found: error

  jetbrains:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-intellij
          ref: 7282fdbc7046bb2ba58369b59ef627211033e145
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with: {gradle-version: "9.1.0"}
      - run: gradle --stacktrace check buildPlugin verifyPlugin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-jetbrains
          path: build/distributions/*.zip
          if-no-files-found: error

  vscode:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-vscode
          ref: 5171a9a7b38f8aca1a403894499bda8b79d46eb1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "22"}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run verify
      - run: xvfb-run -a npm run test:extension
      - run: mkdir -p dist && npm run package -- --out dist/zed-package-insights.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: sandbox-vscode, path: dist/zed-package-insights.vsix, if-no-files-found: error}

  eclipse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-eclipse
          ref: 58394c48e704f041bb29be7e9079806e25abd41e
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: mvn --batch-mode test

  xcode:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-xcode
          ref: e7e7030fa44496c14de7da684772c4113cfdd92f
          persist-credentials: false
      - run: swift test
      - run: swift build -c release

  visual-studio:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-visual-studio
          ref: 4c4141d3ed595fd2b6a331a5a8756f1ed0cde455
          persist-credentials: false
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with: {dotnet-version: "8.0.x"}
      - run: dotnet test Zed.VisualStudio.sln --configuration Release

  qtcreator:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-qtcreator
          ref: 1780ee33eaf8ba3b5fffa8ce3ccc8fb2efea308e
          persist-credentials: false
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
