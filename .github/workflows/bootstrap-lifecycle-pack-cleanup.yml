name: Bootstrap lifecycle publish archive cleanup

on:
  push:
    branches:
      - agent/lifecycle-shared-schema-source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-lifecycle-pack-cleanup
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/lifecycle-shared-schema-source
          path: harness
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Check out exact Python consumer fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/python-app
          ref: ad26b7c7e9706ccec2905a31cbcef67a78e0c217
          path: fixtures/python-app
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact shared-schema fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/shared-schema
          ref: 41cec5076791555d4b72e72da0a42888da0522d0
          path: fixtures/shared-schema
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact polyglot source fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/polyglot-lib
          ref: 998964aa58e49595547650b4a8da407b7a2283a9
          path: fixtures/polyglot-lib
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply precise publish archive cleanup
        working-directory: harness
        run: |
          set -euo pipefail
          python3 -B scripts/den1541_cleanup_publish_archives.py
          python3 - <<'PY'
          from pathlib import Path

          for raw in (
              "scripts/lifecycle.py",
              "tests/test_lifecycle_source_map.py",
          ):
              path = Path(raw)
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Run local and live fixture contracts
        working-directory: harness
        env:
          FIXTURE_ROOT: ${{ github.workspace }}/fixtures
        run: |
          set -euo pipefail
          python3 -B tests/test_lifecycle_source_map.py -v
          git diff --check

      - name: Commit only the permanent harness repair
        working-directory: harness
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-lifecycle-pack-cleanup.yml
          git rm scripts/den1541_cleanup_publish_archives.py
          git add scripts/lifecycle.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(DEN-1541): clean only expected publish archives"
          git push origin HEAD:agent/lifecycle-shared-schema-source
