name: complete constraint solver

on:
  pull_request:
    paths:
      - scripts/complete_constraint_solver.py
      - scripts/complete-constraint-solver.sh
      - docs/complete-constraint-solver-canary.md
      - .github/workflows/complete-constraint-solver.yml
  push:
    branches: [main]
    paths:
      - scripts/complete_constraint_solver.py
      - scripts/complete-constraint-solver.sh
      - docs/complete-constraint-solver-canary.md
      - .github/workflows/complete-constraint-solver.yml
  workflow_dispatch:
    inputs:
      zed_cli_ref:
        description: Immutable zed-cli commit to certify
        required: false
        default: 2cf69147ece5cdcc649de62dd043491de773a59b
      run_arc_smoke:
        description: Repeat the canary on the registered sonus-ci ARC scale set
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: complete-constraint-solver-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ZED_CLI_REF: ${{ github.event.inputs.zed_cli_ref || '2cf69147ece5cdcc649de62dd043491de773a59b' }}
  ZED_INTERFACES_REF: c2e049006453c26ca8ca291783f681fce75cb01f

jobs:
  hosted:
    name: Overlap, backtracking, stale constraints, diagnostics, cycles, and yank policy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require immutable component pins
        run: |
          set -euo pipefail
          [[ "$ZED_CLI_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZED_INTERFACES_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the canary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out the pinned zed-interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_REF }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install stable Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          python3 --version

      - name: Compile canaries and verify Rust formatting
        run: |
          set -euo pipefail
          python3 -m py_compile harness/scripts/complete_constraint_solver.py
          bash -n harness/scripts/complete-constraint-solver.sh
          cargo fmt --all --check --manifest-path zed-cli/Cargo.toml

      - name: Build the immutable zed binary
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed
          install -Dm755 zed-cli/target/release/zed "$RUNNER_TEMP/zed-bin/zed"
          "$RUNNER_TEMP/zed-bin/zed" --version

      - name: Run complete constraint-solver certification
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-complete-constraint-solver
        run: |
          set -euo pipefail
          test ! -e "$WORK_ROOT"
          python3 harness/scripts/complete_constraint_solver.py \
            --zed "$RUNNER_TEMP/zed-bin/zed" \
            --work-root "$WORK_ROOT"

      - name: Enforce yanked-candidate pre-acquisition boundary
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-complete-constraint-solver
        run: |
          set -euo pipefail
          bash harness/scripts/complete-constraint-solver.sh \
            "$RUNNER_TEMP/zed-bin/zed" \
            "$WORK_ROOT/yanked-candidate"

      - name: Collect failure diagnostics
        if: failure()
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-complete-constraint-solver
        run: |
          set +e
          mkdir -p "$WORK_ROOT/diagnostics"
          find "$WORK_ROOT" -maxdepth 12 -printf '%y %P -> %l\n' \
            | LC_ALL=C sort > "$WORK_ROOT/diagnostics/work-tree.txt" 2>&1
          find "$WORK_ROOT/registry" "$WORK_ROOT/yanked-candidate/registry" \
            -maxdepth 10 -type f -print0 2>/dev/null \
            | sort -z | xargs -0 -r sha256sum \
            > "$WORK_ROOT/diagnostics/registry-sha256.txt" 2>&1
          find "$WORK_ROOT" -path '*/.zpkg.lock' -type f -print \
            -exec sed -n '1,300p' {} \; \
            > "$WORK_ROOT/diagnostics/lockfiles.txt" 2>&1
          find "$WORK_ROOT" -path '*/cache/*.tar.gz' -type f -print0 2>/dev/null \
            | sort -z | xargs -0 -r sha256sum \
            > "$WORK_ROOT/diagnostics/cache-sha256.txt" 2>&1
          find "$WORK_ROOT" -name '*.log' -type f -print \
            -exec sed -n '1,400p' {} \; \
            > "$WORK_ROOT/diagnostics/logs.txt" 2>&1
          true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complete-constraint-solver-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zed-complete-constraint-solver/diagnostics
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

  arc-parity:
    name: Optional self-hosted ARC parity
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_arc_smoke }}
    runs-on: [self-hosted, linux, sonus-ci]
    timeout-minutes: 40
    steps:
      - name: Check out the canary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify ephemeral runner and execute the same canaries
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-complete-constraint-solver-arc
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test -n "$RUNNER_NAME"
          test ! -e /var/run/docker.sock
          [[ "$ZED_CLI_REF" =~ ^[0-9a-f]{40}$ ]]
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed
          test ! -e "$WORK_ROOT"
          python3 harness/scripts/complete_constraint_solver.py \
            --zed zed-cli/target/release/zed \
            --work-root "$WORK_ROOT"
          bash harness/scripts/complete-constraint-solver.sh \
            zed-cli/target/release/zed \
            "$WORK_ROOT/yanked-candidate"
