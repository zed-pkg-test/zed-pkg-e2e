name: zed inspect v1 contract

on:
  pull_request:
    paths: [".github/workflows/inspect-cli-contract.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/inspect-cli-contract.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_REF: b7036935ce3711563f1527472fc64e92bc1341aa

jobs:
  quality:
    name: exact-head Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Verify exact source and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_CLI_REF"
          cargo fmt --all --check --manifest-path zed-cli/Cargo.toml
          cargo test --locked --manifest-path zed-cli/Cargo.toml --lib inspect::tests
          cargo test --locked --manifest-path zed-cli/Cargo.toml --lib cli_model::tests
          cargo test --locked --manifest-path zed-cli/Cargo.toml --test inspect_cli
          cargo clippy --locked --manifest-path zed-cli/Cargo.toml \
            --lib --bin zed --test inspect_cli -- -D warnings

  contract:
    name: offline read-only inspect / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Build exact release binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_CLI_REF"
          cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed
      - name: Certify one-document offline non-mutating protocol
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile

          workspace = pathlib.Path.cwd()
          binary = workspace / "zed-cli" / "target" / "release" / ("zed.exe" if os.name == "nt" else "zed")
          assert binary.is_file(), binary
          temp = pathlib.Path(os.environ.get("RUNNER_TEMP") or tempfile.gettempdir())
          root = pathlib.Path(tempfile.mkdtemp(prefix="zed-inspect-", dir=temp)).resolve()
          home = pathlib.Path(tempfile.mkdtemp(prefix="zed-home-", dir=temp)).resolve()
          manifest = root / ".zpkg.toml"
          lock = root / ".zpkg.lock"
          staging = root / ".zpkg-staging"
          staging.mkdir()
          sentinel = staging / "sentinel"
          sentinel.write_text("must-survive", encoding="utf-8")
          manifest.write_text(
              '[package]\norg = "acme"\nname = "inspect-fixture"\nversion = "1.0.0"\n'
              '\n[package.repository]\nvcs = "git"\nurl = "https://example.invalid/acme/inspect-fixture"\n',
              encoding="utf-8",
          )
          lock.write_text("version = 1\n", encoding="utf-8")
          (home / "credentials.toml").write_text("malformed = [credential", encoding="utf-8")

          def snapshot(path):
              rows = {}
              for item in sorted(path.rglob("*")):
                  relative = item.relative_to(path).as_posix()
                  if item.is_symlink(): rows[relative] = ["symlink", os.readlink(item)]
                  elif item.is_file(): rows[relative] = ["file", hashlib.sha256(item.read_bytes()).hexdigest()]
                  elif item.is_dir(): rows[relative] = ["dir"]
              return rows

          environment = os.environ.copy()
          environment.update({
              "ZED_PKG_HOME": str(home),
              "ZED_PKG_TOKEN": "fake-env-token-that-must-not-escape",
              "ZED_PKG_REGISTRY": "http://127.0.0.1:9",
          })

          def inspect():
              return subprocess.run(
                  [str(binary), "--token", "fake-arg-token-that-must-not-escape",
                   "inspect", "--format", "json", "--root", str(root)],
                  cwd=root, env=environment, text=True, capture_output=True,
                  timeout=15, check=False,
              )

          before = snapshot(root)
          result = inspect()
          after = snapshot(root)
          assert result.returncode == 0, result.stderr
          assert result.stderr == "", result.stderr
          assert result.stdout.count("\n") == 1, result.stdout
          report = json.loads(result.stdout)
          assert report["schema_version"] == "1.0", report
          assert report["cli"] == {
              "implementation": "zed-pkg", "command": "inspect", "offline": True,
              "mutates_project": False, "loads_credentials": False,
          }, report
          assert report["summary"]["recovery_pending"] is True, report
          action = next(d for d in report["diagnostics"] if d["code"] == "RECOVERY_PENDING")["actions"][0]
          assert action == {
              "label": action["label"], "argv": ["zed", "install", "--frozen"],
              "mutates_project": True, "requires_network": True,
              "executes_package_code": True,
          }, action
          assert before == after
          assert sentinel.read_text(encoding="utf-8") == "must-survive"
          combined = result.stdout + result.stderr
          assert "fake-env-token-that-must-not-escape" not in combined
          assert "fake-arg-token-that-must-not-escape" not in combined

          secret = "gh" + "p_fake_manifest_secret_that_must_not_escape"
          manifest.write_text(f'[package\nsecret = "{secret}"\n', encoding="utf-8")
          malformed_before = snapshot(root)
          malformed = inspect()
          assert malformed.returncode == 0, malformed.stderr
          malformed_report = json.loads(malformed.stdout)
          assert malformed_report["summary"]["health"] == "error"
          assert any(d["code"] == "MANIFEST_INVALID" for d in malformed_report["diagnostics"])
          assert secret not in malformed.stdout + malformed.stderr
          assert malformed_before == snapshot(root)

          relative = subprocess.run(
              [str(binary), "inspect", "--format", "json", "--root", "relative"],
              cwd=root, env=environment, text=True, capture_output=True,
              timeout=15, check=False,
          )
          assert relative.returncode != 0
          assert not (root / "relative").exists()
          print("certified", os.environ.get("RUNNER_OS_NAME"), os.environ["ZED_CLI_REF"])
          PY
