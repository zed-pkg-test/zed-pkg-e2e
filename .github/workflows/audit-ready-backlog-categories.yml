name: audit remaining ready backlog categories

on:
  push:
    branches: [main]
    paths:
      - ".github/pr-merge/AUDIT-READY-CATEGORIES"

permissions:
  contents: read

concurrency:
  group: audit-ready-backlog-categories
  cancel-in-progress: false

jobs:
  audit:
    if: "${{ github.event.head_commit.message == 'chore: audit remaining ready backlog categories' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
    steps:
      - name: Validate stored fleet credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$FLEET_GH_TOKEN"
          GH_TOKEN="$FLEET_GH_TOKEN" gh api user --jq '.login' | grep -Fx ORESoftware

      - name: Check out trusted category auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Audit live exact heads without writes
        shell: bash
        run: node .github/scripts/audit-ready-backlog-categories.mjs

      - name: Upload machine-readable audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ready-backlog-categories
          path: ready-backlog-audit
          if-no-files-found: error
          retention-days: 1
