name: zed full lifecycle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zed_cli_ref:
        description: Optional immutable zed-cli commit override
        required: false
        default: ""
  repository_dispatch:
    types: [fixture-updated]
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: read

concurrency:
  group: zed-full-lifecycle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ZED_INTERFACES_REF: 8428bc574111fa148e590c8350c7855035ce2046

jobs:
  build-zed:
    name: Build immutable zed CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out lifecycle harness and reviewed pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Load immutable component pins
        id: pins
        run: |
          set -euo pipefail
          override="${{ github.event.inputs.zed_cli_ref || '' }}"
          if [[ -n "$override" ]]; then
            zed_cli_ref="$override"
          else
            zed_cli_ref="$(tr -d '[:space:]' < harness/.zed-cli-ref)"
          fi
          [[ "$zed_cli_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZED_INTERFACES_REF" =~ ^[0-9a-f]{40}$ ]]
          printf 'zed_cli_ref=%s\n' "$zed_cli_ref" >> "$GITHUB_OUTPUT"
          printf 'ZED_CLI_REF=%s\n' "$zed_cli_ref" >> "$GITHUB_ENV"
          printf 'zed-cli=%s\nzed-interfaces=%s\n' \
            "$zed_cli_ref" "$ZED_INTERFACES_REF"

      - name: Check out zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ steps.pins.outputs.zed_cli_ref }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out zed-interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_REF }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Enforce exact interface provenance
        run: |
          set -euo pipefail
          test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_REF"
          grep -F "rev = \"$ZED_INTERFACES_REF\"" zed-cli/Cargo.toml
          grep -F "rev=$ZED_INTERFACES_REF#$ZED_INTERFACES_REF" zed-cli/Cargo.lock

      - name: Install the declared Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Format and unit-test r2g
        run: |
          set -euo pipefail
          cargo fmt --all --check --manifest-path zed-cli/Cargo.toml
          cargo test --locked --manifest-path zed-cli/Cargo.toml --lib r2g::tests

      - name: Build release binary once
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed
          install -Dm755 zed-cli/target/release/zed "$RUNNER_TEMP/zed-bin/zed"
          (cd "$RUNNER_TEMP/zed-bin" && sha256sum zed | tee SHA256SUMS)
          "$RUNNER_TEMP/zed-bin/zed" --version

      - name: Upload immutable zed binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zed-bin
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  frozen-fetch-canary:
    name: External frozen fetch bundle
    needs: build-zed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out lifecycle harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out a real package fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/node-lib
          ref: main
          path: fixture
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Download immutable zed binary
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8.0.0
        with:
          name: zed-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: tooling

      - name: Verify binary checksum and fresh work root
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-frozen-fetch-canary
        run: |
          set -euo pipefail
          chmod +x tooling/zed
          (cd tooling && sha256sum --check SHA256SUMS)
          test ! -e "$WORK_ROOT"
          tooling/zed --version

      - name: Publish, lock, uninstall, fetch, replay, and reject tampering
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-frozen-fetch-canary
        run: |
          set -euo pipefail
          python3 harness/scripts/frozen_fetch_canary.py \
            --fixture-dir fixture \
            --zed tooling/zed \
            --work-root "$WORK_ROOT"

      - name: Reject missing, non-directory, and redirected output parents
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-frozen-fetch-canary
        run: |
          set -euo pipefail
          python3 harness/scripts/frozen_fetch_output_boundaries.py \
            --zed tooling/zed \
            --work-root "$WORK_ROOT"

      - name: Collect failure diagnostics
        if: failure()
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-frozen-fetch-canary
        run: |
          set +e
          mkdir -p "$WORK_ROOT/diagnostics"
          git -C fixture status --porcelain=v1 --untracked-files=all \
            > "$WORK_ROOT/diagnostics/fixture-status.txt" 2>&1
          find "$WORK_ROOT" -maxdepth 10 -printf '%y %P -> %l\n' \
            | LC_ALL=C sort > "$WORK_ROOT/diagnostics/work-tree.txt" 2>&1
          find "$WORK_ROOT/registry" -maxdepth 8 -type f -print0 2>/dev/null \
            | sort -z | xargs -0 -r sha256sum \
            > "$WORK_ROOT/diagnostics/registry-sha256.txt" 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-fetch-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zed-frozen-fetch-canary/diagnostics
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

  lifecycle:
    name: Lifecycle / ${{ matrix.repo }}
    needs: build-zed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        repo:
          - node-lib
          - node-app
          - rust-lib
          - rust-app
          - go-lib
          - go-app
          - python-lib
          - python-app
          - dart-lib
          - dart-app
          - gleam-lib
          - gleam-app
          - polyglot-lib
          - polyglot-node-app
          - polyglot-go-app
          - multiversion-lib
          - awkward-lib
          - subtree-consumer
          - submodule-consumer
          - workspace-monorepo
          - shared-schema
          - zed-pkg-e2e
    steps:
      - name: Check out lifecycle harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out fixture at its current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/${{ matrix.repo }}
          ref: main
          path: fixture
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          show-progress: false

      - name: Download immutable zed binary
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8.0.0
        with:
          name: zed-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: tooling

      - name: Verify binary checksum and clean state root
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-lifecycle/${{ matrix.repo }}
        run: |
          set -euo pipefail
          chmod +x tooling/zed
          (cd tooling && sha256sum --check SHA256SUMS)
          test ! -e "$WORK_ROOT"
          tooling/zed --version

      - name: Run full stateless lifecycle
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-lifecycle/${{ matrix.repo }}
        run: |
          set -euo pipefail
          python3 harness/scripts/lifecycle.py \
            --repo "${{ matrix.repo }}" \
            --fixture-dir fixture \
            --zed tooling/zed \
            --work-root "$WORK_ROOT"

      - name: Collect failure diagnostics
        if: failure()
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-lifecycle/${{ matrix.repo }}
        run: |
          set +e
          mkdir -p "$WORK_ROOT/diagnostics"
          git -C fixture status --porcelain=v1 --untracked-files=all \
            > "$WORK_ROOT/diagnostics/fixture-status.txt" 2>&1
          find "$WORK_ROOT" -maxdepth 8 -printf '%y %P -> %l\n' \
            | LC_ALL=C sort > "$WORK_ROOT/diagnostics/work-tree.txt" 2>&1
          find "$WORK_ROOT/registry" -maxdepth 8 -type f -print0 2>/dev/null \
            | sort -z | xargs -0 -r sha256sum \
            > "$WORK_ROOT/diagnostics/registry-sha256.txt" 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-diagnostics-${{ matrix.repo }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zed-lifecycle/${{ matrix.repo }}/diagnostics
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

  lifecycle-gate:
    name: All fixture lifecycles passed
    if: always()
    needs: [build-zed, frozen-fetch-canary, lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce aggregate result
        env:
          BUILD_RESULT: ${{ needs.build-zed.result }}
          FETCH_RESULT: ${{ needs.frozen-fetch-canary.result }}
          MATRIX_RESULT: ${{ needs.lifecycle.result }}
        run: |
          set -euo pipefail
          printf 'build-zed=%s\nfrozen-fetch=%s\nlifecycle=%s\n' \
            "$BUILD_RESULT" "$FETCH_RESULT" "$MATRIX_RESULT"
          test "$BUILD_RESULT" = success
          test "$FETCH_RESULT" = success
          test "$MATRIX_RESULT" = success
