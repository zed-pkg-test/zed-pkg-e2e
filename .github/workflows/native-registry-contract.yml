name: zed native registry contract canary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zed_interfaces_ref:
        description: Immutable zed-interfaces commit to certify
        required: false
        default: 8a9b51f63e682edaf8f709db4a679a3a493fe334

permissions:
  contents: read

concurrency:
  group: zed-native-registry-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ZED_INTERFACES_REF: ${{ github.event.inputs.zed_interfaces_ref || '8a9b51f63e682edaf8f709db4a679a3a493fe334' }}

jobs:
  native-registry-contract:
    name: Native registry schema and consumer
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Require immutable interface pin
        run: |
          set -euo pipefail
          [[ "$ZED_INTERFACES_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out canary harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact zed-interfaces candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_REF }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install stable Rust with formatter and Clippy
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Generate schema deterministically
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path zed-interfaces/Cargo.toml --example generate_schemas
          test -s zed-interfaces/schemas/native-registry-adapter-record.json
          sha256sum zed-interfaces/schemas/native-registry-adapter-record.json \
            | tee "$RUNNER_TEMP/native-registry-schema.sha256"
          cp zed-interfaces/schemas/native-registry-adapter-record.json \
            "$RUNNER_TEMP/native-registry-adapter-record.first.json"
          cargo run --locked --manifest-path zed-interfaces/Cargo.toml --example generate_schemas
          cmp "$RUNNER_TEMP/native-registry-adapter-record.first.json" \
            zed-interfaces/schemas/native-registry-adapter-record.json
          sha256sum --check "$RUNNER_TEMP/native-registry-schema.sha256"

      - name: Verify generated schema surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("zed-interfaces/schemas/native-registry-adapter-record.json")
          schema = json.loads(path.read_text(encoding="utf-8"))
          text = json.dumps(schema, sort_keys=True)
          required = (
              "NativeRegistryAdapterRecord",
              "platform_packages",
              "sha256",
              "portable",
              "meta",
              "platform",
              "npm",
              "cargo",
          )
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f"schema is missing public contract tokens: {missing}")
          PY

      - name: Run complete zed-interfaces gates
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path zed-interfaces/Cargo.toml -- --check
          cargo test --locked --manifest-path zed-interfaces/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path zed-interfaces/Cargo.toml \
            --all-targets --all-features -- -D warnings
          git -C zed-interfaces diff --check

      - name: Compile public contract from an external crate
        run: |
          set -euo pipefail
          fixture=harness/fixtures/native-registry-consumer
          cp zed-interfaces/Cargo.lock "$fixture/Cargo.lock"
          cargo run --offline --manifest-path "$fixture/Cargo.toml"
          cargo run --locked --offline --manifest-path "$fixture/Cargo.toml"

      - name: Record evidence
        if: always()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/native-registry-contract-evidence"
          cp zed-interfaces/schemas/native-registry-adapter-record.json \
            "$RUNNER_TEMP/native-registry-contract-evidence/" 2>/dev/null
          cp "$RUNNER_TEMP/native-registry-schema.sha256" \
            "$RUNNER_TEMP/native-registry-contract-evidence/" 2>/dev/null
          cp harness/fixtures/native-registry-consumer/Cargo.lock \
            "$RUNNER_TEMP/native-registry-contract-evidence/consumer-Cargo.lock" 2>/dev/null
          git -C zed-interfaces status --porcelain=v1 --untracked-files=all \
            > "$RUNNER_TEMP/native-registry-contract-evidence/interfaces-status.txt" 2>&1

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-registry-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-registry-contract-evidence
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
