name: Atto public checked arithmetic compiler qualification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  rem-mod:
    if: github.head_ref == 'ci/atto-js-ashr-and-intrinsic-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_TERMINAL_PROMPT: '0'
      SOURCE_SHA: dc69d91ac0361e65a16e2e984f6cc30dd47b1dc4
    steps:
      - name: Verify exact public compiler and proof inputs
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --depth=1 https://github.com/atto-lang/atto-source.llvm.git "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source log -1 --format='%H %T'
          test -z "$(git -C source status --porcelain)"
          test "$(git -C source hash-object tests/formal/validate_scalar_remainder_ir.py)" = aff749ca6c99ddc623c9de6007e599671456032e
          test "$(git -C source hash-object tests/formal/representative_rem_mod.ll)" = 1da16e7fde729f94584c82eea5315f249b0f1ca3
          test "$(git -C source hash-object tests/formal/verify_remainder.py)" = 15b6114e3f1ef16c4d7648911eadd149f1d22b01
          test "$(git -C source hash-object tests/fixtures/formal-dynamic-rem-mod.atto)" = 1bf1483cad2ce3c8614fc47902a6df194f4a64aa
          test "$(git -C source hash-object tests/formal/test_remainder_native.py)" = c85e82c8262d19d966b81048d71ccc12eeb74ecf
      - name: Build actual compiler and audited AOT driver dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 cmake ninja-build
          cmake -S source -B build -G Ninja -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$(llvm-config-18 --cmakedir)" -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build --target oreslang-llvmc --parallel 2
          rustc --edition=2021 -D warnings source/scripts/audit_no_gc_ir.rs -o build/oreslang-no-gc-ir-audit
          sha256sum build/oreslang-llvmc
      - name: Execute representative and actual compiler-derived proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv proof-env
          proof-env/bin/pip install --only-binary=:all: llvmlite==0.47.0 z3-solver==4.13.3.0
          proof-env/bin/python source/tests/formal/verify_remainder.py --solver "$PWD/proof-env/bin/z3"
          build/oreslang-llvmc source/tests/fixtures/formal-dynamic-rem-mod.atto > actual.ll
          cat actual.ll
          proof-env/bin/python source/tests/formal/verify_remainder.py --solver "$PWD/proof-env/bin/z3" --compiler "$PWD/build/oreslang-llvmc"
      - name: Execute actual audited native guest at O0 and O2
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guest
          for level in 0 2; do
            ORESLANG_LLVMC="$PWD/build/oreslang-llvmc" ORES_NO_GC_IR_AUDIT="$PWD/build/oreslang-no-gc-ir-audit" ORESLANG_LLVM_AOT_OPT_LEVEL="$level" CLANG=clang-18 bash source/scripts/compile-aot.sh source/tests/fixtures/formal-dynamic-rem-mod.atto "$PWD/guest/rem-mod-O$level"
            status=0
            "guest/rem-mod-O$level" || status=$?
            test "$status" = 42
            echo "REAL_ATTO_REM_MOD_GUEST_PASS O$level exit=$status"
          done
  mul-contract:
    if: github.head_ref == 'ci/atto-js-ashr-and-intrinsic-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact public contract and replay bytes
        shell: bash
        run: |
          set -euo pipefail
          git init common
          GIT_TERMINAL_PROMPT=0 git -C common -c credential.helper= -c http.extraHeader= fetch --depth=1 https://github.com/atto-lang/atto-common-source.git 222e1e0da124688a35477f5f448603084e8c6351
          git -C common checkout --detach FETCH_HEAD
          test "$(git -C common rev-parse HEAD)" = 222e1e0da124688a35477f5f448603084e8c6351
          test "$(git -C common hash-object formal/signed-product-narrowing/model.smt2)" = f4277d24521574a61c0f6665b41cfd944d50dc48
          test "$(git -C common hash-object formal/signed-product-narrowing/verify.py)" = 1d41b33159e71245ccb4ab04570d5e5d7e5d9143
      - name: Official solver replay and native differential
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv proof-env
          proof-env/bin/pip install --only-binary=:all: z3-solver==4.13.3.0
          clang --version
          proof-env/bin/python common/formal/signed-product-narrowing/verify.py --solver "$PWD/proof-env/bin/z3" --clang clang

  intrinsic-flow:
    if: github.head_ref == 'ci/atto-js-ashr-and-intrinsic-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_TERMINAL_PROMPT: '0'
      SOURCE_SHA: 397740c18a2b6700043511cb93ddb19e5e6a4240
    steps:
      - name: Verify exact public source and validator bytes
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --depth=1 https://github.com/atto-lang/atto-source.llvm.git "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source log -1 --format='%H %T'
          test -z "$(git -C source status --porcelain)"
          test "$(git -C source hash-object tests/formal/checked-intrinsic/check_intrinsic.py)" = 8b136d872ea7af6e8ce2b930e698ff88b7cda678
          test "$(git -C source hash-object tests/formal/checked-intrinsic/test_intrinsic.py)" = dbd053816b3d360b147cbb62f1c4c53faf50c458
      - name: Build actual compiler and audited AOT driver dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 cmake ninja-build
          cmake -S source -B build -G Ninja -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$(llvm-config-18 --cmakedir)" -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build --target oreslang-llvmc --parallel 2
          rustc --edition=2021 -D warnings source/scripts/audit_no_gc_ir.rs -o build/oreslang-no-gc-ir-audit
          sha256sum build/oreslang-llvmc
      - name: Verify actual compiler-generated intrinsic dataflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv proof-env
          proof-env/bin/pip install --only-binary=:all: llvmlite==0.47.0
          proof-env/bin/python source/tests/formal/checked-intrinsic/test_intrinsic.py
          cat > checked-intrinsics.atto <<'ATTO'
          pub fnc sum(int a, int b): int { return a + b; }
          pub fnc difference(int a, int b): int { return a - b; }
          pub fnc product(int a, int b): int { return a * b; }
          pub fnc negative(int a): int { return -a; }
          pub fnc main(): int { return sum(difference(product(7, 7), 5), negative(2)); }
          ATTO
          build/oreslang-llvmc checked-intrinsics.atto > actual.ll
          cat actual.ll
          for item in 'sum add' 'difference sub' 'product mul' 'negative neg'; do
            read -r symbol op <<< "$item"
            proof-env/bin/python source/tests/formal/checked-intrinsic/check_intrinsic.py actual.ll "$symbol" "$op"
          done
      - name: Run actual audited source guest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          for level in 0 2; do
            ORESLANG_LLVMC="$PWD/build/oreslang-llvmc" ORES_NO_GC_IR_AUDIT="$PWD/build/oreslang-no-gc-ir-audit" ORESLANG_LLVM_AOT_OPT_LEVEL="$level" CLANG=clang-18 bash source/scripts/compile-aot.sh checked-intrinsics.atto "$PWD/checked-O$level"
            status=0
            "./checked-O$level" || status=$?
            test "$status" -eq 42
            echo "REAL_ATTO_INTRINSIC_GUEST_PASS O$level exit=$status"
          done
  shift-contract:
    if: github.head_ref == 'ci/atto-js-ashr-and-intrinsic-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact public shift model and replay bytes
        shell: bash
        run: |
          set -euo pipefail
          git init common
          GIT_TERMINAL_PROMPT=0 git -C common -c credential.helper= -c http.extraHeader= fetch --depth=1 https://github.com/atto-lang/atto-common-source.git b2e60875ff70e7bda650e2ee7233907ec12fc1d5
          git -C common checkout --detach FETCH_HEAD
          test "$(git -C common rev-parse HEAD)" = b2e60875ff70e7bda650e2ee7233907ec12fc1d5
          test "$(git -C common hash-object formal/checked-shifts/model.smt2)" = 5810f21e892c8d0eda6ba5614f811302c5d72764
          test "$(git -C common hash-object formal/checked-shifts/verify.py)" = 2b769ea7b0057f2a13bf0c621f300b6fc799c33f
      - name: Run official solver and independent witnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv proof-env
          proof-env/bin/pip install --only-binary=:all: z3-solver==4.13.3.0
          proof-env/bin/python common/formal/checked-shifts/verify.py --solver "$PWD/proof-env/bin/z3" --witnesses

  js-ashr:
    if: github.head_ref == 'ci/atto-js-ashr-and-intrinsic-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: '0'
      SOURCE_SHA: b24d157951913cdb25dec0d1aab13f914ce27d2e
    steps:
      - name: Verify exact public JS compiler source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --depth=1 https://github.com/atto-lang/atto-source.js.git "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source log -1 --format='%H %T'
          test -z "$(git -C source status --porcelain)"
          test "$(git -C source hash-object src/program-v2.mjs)" = c676063e413a21fd4b43f6afad36405dda4858ca
          test "$(git -C source hash-object src/program-ir-v2.mjs)" = 03fcc4b98445cb48c4c9fb4dbac311a9f12e711f
          test "$(git -C source hash-object src/transpile-worker.mjs)" = 0fb97f5cf2734c6420fa590bc6fe1435ad913d4b
          test "$(git -C source hash-object tests/checked-ashr-parity.test.mjs)" = 0daa382f5b3790755dd5aaffeb22de824c040a58
      - name: Execute actual generated ESM and Worker guest suite
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node --version
          node --test tests/checked-ashr-parity.test.mjs
      - name: Execute existing numeric and worker regression gates
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node --test tests/named-integer-operations.test.mjs tests/java-canonical-worker-operators.test.mjs tests/java-checked-quotient-trap.test.mjs tests/current-main-numeric-integration.test.mjs
