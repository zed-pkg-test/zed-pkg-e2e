name: Atto public checked bitwise conformance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  bitwise-corpus:
    if: github.head_ref == 'ci/atto-js-ashr-and-intrinsic-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify pinned public conformance and JS compiler trees
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          for entry in 'corpus atto-platform-conformance 6a6538b439e4822c36caee63f5295d166919e88b' 'compiler atto-source.js 95f4ca22abd60036417c986954b5ed8cb4b88e42'; do
            read -r dir repo sha <<< "$entry"
            git init "$dir"
            git -C "$dir" -c credential.helper= -c http.extraHeader= fetch --depth=1 "https://github.com/atto-lang/$repo.git" "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
            git -C "$dir" log -1 --format='%H %T'
            test -z "$(git -C "$dir" status --porcelain)"
          done
          test "$(git -C corpus hash-object contracts/bitwise-operators-v2.json)" = 568918c29393bb96b3d214ad39274f0417c1db6b
          test "$(git -C corpus hash-object tests/bitwise-operators-v2.test.mjs)" = ccdaf049b8071f66a955945a3cdeb22a536aa542
      - name: Execute legacy and current source integrity and reference suites
        shell: bash
        working-directory: corpus
        run: |
          set -euo pipefail
          node --test tests/bitwise-operators-v1.test.mjs tests/bitwise-operators-v2.test.mjs
      - name: Execute exact v2 source via actual JS compiler and Worker paths
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {compileProgramV2} from './compiler/src/program-v2.mjs';
          import {transpile_to_worker} from './compiler/src/transpile-worker.mjs';
          const m=JSON.parse(readFileSync('./corpus/contracts/bitwise-operators-v2.json'));
          const mod=code=>import('data:text/javascript;charset=utf-8,'+encodeURIComponent(code));
          for(const [name,compile,run] of [
            ['program-v2',compileProgramV2,async code=>(await mod(code)).main()],
            ['worker',s=>transpile_to_worker(s).module_source,async code=>BigInt((await (await (await mod(code)).create_tenant({tenant:'v2',generation:1})).on_message()).value)]
          ]){
            for(const c of m.cases){
              const source=readFileSync('./corpus/'+c.path,'utf8');
              if(c.outcome==='guest-42')assert.equal(await run(compile(source)),42n,c.id);
              else if(c.outcome==='invalid-shift-count')assert.throws(()=>compile(source),/E_SHIFT_DISTANCE/,c.id);
              else if(c.outcome==='runtime-shift-count'){
                const code=compile(source);
                await assert.rejects(()=>run(code),/E_GUEST_SHIFT_DISTANCE/,c.id);
              }else if(c.outcome==='compile-type-reject')assert.throws(()=>compile(source),c.id);
              else assert.fail('unknown outcome');
              console.log('REAL_BITWISE_V2_PASS',name,c.id,c.outcome);
            }
          }
          JS
