name: Atto formatter provenance exact main reconciliation
on:
  push:
    branches: ['ci/atto-format-provenance-retest-20261126']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Bind exact public source
        run: |
          set -euo pipefail
          git init source
          cd source
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-format.git 35b2f3a8aae90a3a6e87beb3672b45fdad95ff8a
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 35b2f3a8aae90a3a6e87beb3672b45fdad95ff8a
          test "$(git rev-parse HEAD^{tree})" = aa91e0385d56893e11e2c2af1515ddfe220374c2
      - name: Rust formatter and visibility regression
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked --test export_visibility_provenance
          cargo test --locked --all-targets
      - name: JavaScript formatter suite
        working-directory: source
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          git diff --exit-code HEAD
