name: Leddy package graph canary

on:
  pull_request:
    paths:
      - ".github/workflows/leddy-package-graph.yml"
      - "scripts/leddy-package-graph.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/leddy-package-graph.yml"
      - "scripts/leddy-package-graph.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leddy-package-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_REF: fe4b4662fb252166b18c48f9c048f5888ec8df44
  LEDDY_INTERFACES_REF: 7d8ef79f1353aa6ed23e47739172a7500cab6f25
  LEDDY_LIB_REF: 2a9a0cd43180d4be1f09b1fd98ec00ead9203795
  LEDDY_CLIENTS_REF: c672cedcbcfc71b0310cde2e494c407cecd6ae32
  LEDDY_MONOREPO_REF: 37ac9bd7c1868b75ae59e63a4d931071ade05123

jobs:
  package-graph:
    name: Leddy graph / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Require immutable pins
        run: |
          set -euo pipefail
          for pin in "$ZED_CLI_REF" "$LEDDY_INTERFACES_REF" "$LEDDY_LIB_REF" "$LEDDY_CLIENTS_REF" "$LEDDY_MONOREPO_REF"; do
            [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          done

      - name: Check out test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out exact zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out exact Leddy interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: led-dynamo/leddy-interfaces
          ref: ${{ env.LEDDY_INTERFACES_REF }}
          path: leddy-interfaces
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out exact Leddy lib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: led-dynamo/leddy-lib
          ref: ${{ env.LEDDY_LIB_REF }}
          path: leddy-lib
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out exact Leddy clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: led-dynamo/leddy-clients
          ref: ${{ env.LEDDY_CLIENTS_REF }}
          path: leddy-clients
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check out exact Leddy monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: led-dynamo/leddy-monorepo
          ref: ${{ env.LEDDY_MONOREPO_REF }}
          path: leddy-monorepo
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: zed-cli
          shared-key: leddy-package-graph-${{ matrix.os }}

      - name: Build exact zed binary
        run: |
          set -euo pipefail
          bash -n harness/scripts/leddy-package-graph.sh
          cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed
          zed-cli/target/release/zed --version

      - name: Run isolated Leddy package graph canary
        run: |
          set -o pipefail
          bash harness/scripts/leddy-package-graph.sh \
            "$GITHUB_WORKSPACE/zed-cli/target/release/zed" \
            "$GITHUB_WORKSPACE/leddy-interfaces" \
            "$GITHUB_WORKSPACE/leddy-lib" \
            "$GITHUB_WORKSPACE/leddy-clients" \
            "$GITHUB_WORKSPACE/leddy-monorepo" \
            "$RUNNER_TEMP/leddy-package-graph" \
            2>&1 | tee "$RUNNER_TEMP/leddy-package-graph.log"

      - name: Upload bounded diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leddy-package-graph-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leddy-package-graph.log
            ${{ runner.temp }}/leddy-package-graph/**/*.log
            ${{ runner.temp }}/leddy-package-graph/**/.zpkg.lock
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
