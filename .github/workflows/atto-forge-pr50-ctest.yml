name: Atto Forge PR50 exact-tree full native CTest
on:
  push:
    branches:
      - ci/atto-forge-pr50-full-ctest-20261120
permissions:
  contents: read
jobs:
  ctest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Forge source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:source)" = "d245e9d8af61a26abbc2bd0303ea8382b1682194"
          echo SOURCE_TREE_SHA=$(git rev-parse HEAD:source)
          echo SOURCE_COMMIT=270cec9b8a62246ffb0d05399a7e7ce68fd791d1
      - name: Toolchains
        run: |
          ${{ matrix.cxx }} --version | head -n 1
          cmake --version | head -n 1
      - name: Configure
        run: cmake -S source -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DATTO_FORGE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Full CTest
        run: ctest --test-dir build --output-on-failure -j 2
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-pr50-${{ matrix.cxx }}-ctest
          path: build/Testing/
          if-no-files-found: ignore
