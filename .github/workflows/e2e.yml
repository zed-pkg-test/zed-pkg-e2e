name: browser e2e (fixtures)

# Boots the registry stack via the suite that owns it (zed-pkg/zed-e2e), then
# publishes this org's real fixture repos and drives the UI against them in a
# real browser.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every cross-repository input is immutable. Updating one of these pins is an
  # intentional dependency change, not an ambient change to a default branch.
  ZED_E2E_REF: 5ccd57316ae39c3a3692fb4cfbda2f8a4dd74aa0
  ZED_CLI_REF: 3a91d64abf1fc0bdee6eab2ff804113b1429849f
  ZED_INTERFACES_REF: dc0e0a0620b9462817950b552d3d334a184b1cb1
  ZED_API_REF: 93de2808e0c19a39bf8350abc6cd3104b729e5bc
  ZED_WEB_REF: bb6d9a7094fd9a8d13224865b32e9c362eea1b03
  NODE_LIB_REF: 2d41e658a382fdff27ef87a0db24dbaff280a685
  RUST_LIB_REF: f2534ffafbc4f7e900075dfc8e48b9259aced2fe
  GO_LIB_REF: e09dec6790a60ba75d5d338eece1068a4b8454b1
  PYTHON_LIB_REF: b2db8ce2962fbaae690db7a9dabd14eb1d0362de
  POLYGLOT_LIB_REF: e62ceb6337324a294d4fc861692a267ff0db97d0

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require immutable source pins
        run: |
          set -euo pipefail
          for value in \
            "$ZED_E2E_REF" "$ZED_CLI_REF" "$ZED_INTERFACES_REF" \
            "$ZED_API_REF" "$ZED_WEB_REF" "$NODE_LIB_REF" \
            "$RUST_LIB_REF" "$GO_LIB_REF" "$PYTHON_LIB_REF" \
            "$POLYGLOT_LIB_REF"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done

      - name: Check out this suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zed-pkg-e2e
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out zed-e2e
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-e2e
          ref: ${{ env.ZED_E2E_REF }}
          path: zed-e2e
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      # Keep production components as sibling checkouts. Each is pinned
      # independently, and the candidate CLI's declared interface revision must
      # match ZED_INTERFACES_REF.
      - name: Check out zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Check out zed-interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_REF }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Check out zed-api-server.rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-api-server.rs
          ref: ${{ env.ZED_API_REF }}
          path: zed-api-server.rs
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Check out zed-web-server.rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-web-server.rs
          ref: ${{ env.ZED_WEB_REF }}
          path: zed-web-server.rs
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      # The fixture repos whose pages this suite asserts on.
      - name: Check out node-lib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/node-lib
          ref: ${{ env.NODE_LIB_REF }}
          path: node-lib
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Check out rust-lib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/rust-lib
          ref: ${{ env.RUST_LIB_REF }}
          path: rust-lib
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Check out go-lib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/go-lib
          ref: ${{ env.GO_LIB_REF }}
          path: go-lib
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Check out python-lib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/python-lib
          ref: ${{ env.PYTHON_LIB_REF }}
          path: python-lib
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Check out polyglot-lib
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg-test/polyglot-lib
          ref: ${{ env.POLYGLOT_LIB_REF }}
          path: polyglot-lib
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: zed-pkg-e2e/.github/workflows/e2e.yml

      - name: Install pinned Rust toolchain action
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            zed-pkg-e2e/package-lock.json
            zed-e2e/package-lock.json

      - name: Install this suite reproducibly
        working-directory: zed-pkg-e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npx --no-install playwright install --with-deps chromium

      - name: Bring the registry stack up
        working-directory: zed-e2e
        env:
          # Official pgvector 0.8.6 + Postgres 16 Bookworm, pinned to the
          # linux/amd64 manifest used by GitHub's ubuntu-24.04 runners.
          ZED_E2E_PG_IMAGE: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:84a355869251af1a3379cfc9fa7b4dbf962c03f642a4bb7b339a203925071c43
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run stack:up

      - name: Drive the fixtures through a browser
        working-directory: zed-pkg-e2e
        env:
          ZED_E2E_API_URL: http://127.0.0.1:48080
          ZED_E2E_WEB_URL: http://127.0.0.1:48081
          ZED_E2E_DATABASE_URL: postgres://zed:zed@127.0.0.1:55432/zed_e2e
          ZED_E2E_HOME: ${{ runner.temp }}/zed-pkg-fixture-home
          ZED_BIN: ${{ github.workspace }}/zed-cli/target/debug/zed
          ZED_E2E_API_BIN: ${{ github.workspace }}/zed-api-server.rs/target/debug/zed-api-server
        run: npm run e2e

      - name: Capture stack diagnostics
        if: ${{ failure() }}
        run: |
          set +e
          destination="zed-pkg-e2e/test-results/stack"
          mkdir -p "$destination"
          if test -d zed-e2e/.stack; then
            cp -a zed-e2e/.stack/. "$destination/"
          fi
          docker logs zed-e2e-postgres > "$destination/postgres.log" 2>&1 || true
          for log in "$destination"/*.log; do
            test -f "$log" || continue
            printf '\n===== %s =====\n' "$log"
            cat "$log"
          done

      - name: Tear the stack down
        if: ${{ always() }}
        working-directory: zed-e2e
        run: npm run stack:down || true

      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            zed-pkg-e2e/playwright-report
            zed-pkg-e2e/test-results
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
