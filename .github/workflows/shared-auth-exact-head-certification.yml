name: Shared Auth exact-head certification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: shared-auth-exact-head-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  certify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/den-2788-full-stack-live-r2'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shared_auth_test
          POSTGRES_USER: shared_auth
          POSTGRES_PASSWORD: shared_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U shared_auth -d shared_auth_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Check out the requesting evidence head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: evidence-repo
          fetch-depth: 0
          persist-credentials: true

      - name: Read and authorize the exact certification request
        id: request
        working-directory: evidence-repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < bootstrap/shared-auth-configurable-issuer.once)" = \
            'CERTIFY_SHARED_AUTH_CONFIGURABLE_ISSUER_V1'
          jq -e '.repository == "shared-auth/shared-auth-server.rs"' \
            config/shared-auth-certification.json >/dev/null
          jq -e '.independent_test_repository == "shared-auth-test/server-api-contract-e2e"' \
            config/shared-auth-certification.json >/dev/null
          for key in \
            repository \
            branch \
            expected_head \
            independent_test_repository \
            independent_test_head; do
            value="$(jq -er --arg key "$key" '.[$key]' config/shared-auth-certification.json)"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done

      - name: Check out the exact private Shared Auth candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.request.outputs.repository }}
          ref: ${{ steps.request.outputs.expected_head }}
          path: shared-auth
          fetch-depth: 0
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false

      - name: Check out the independent Shared Auth test contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.request.outputs.independent_test_repository }}
          ref: ${{ steps.request.outputs.independent_test_head }}
          path: shared-auth-tests
          fetch-depth: 1
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: false

      - name: Assert immutable source and independent test pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C shared-auth rev-parse HEAD)" = \
            "${{ steps.request.outputs.expected_head }}"
          test "$(git -C shared-auth-tests rev-parse HEAD)" = \
            "${{ steps.request.outputs.independent_test_head }}"
          test -z "$(git -C shared-auth config --local --get-all http.https://github.com/.extraheader || true)"
          node --check shared-auth-tests/scripts/verify-zpkg-handoff-certified-head-v2.mjs

      - name: Run the independent exact-source contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-repo/evidence/shared-auth
          node shared-auth-tests/scripts/verify-zpkg-handoff-certified-head-v2.mjs \
            --source-root shared-auth \
            --lock shared-auth-tests/zpkg-handoff-lock.json \
            --expected-sha "${{ steps.request.outputs.expected_head }}" \
            --json-output evidence-repo/evidence/shared-auth/shared-auth-test-contract-v2.json
          jq -e \
            --arg sha "${{ steps.request.outputs.expected_head }}" \
            '.source.actualSha == $sha and .certification.exactHead == true and .certification.currentDependencyApis == true and .certification.boundedCsrfCookie == true' \
            evidence-repo/evidence/shared-auth/shared-auth-test-contract-v2.json >/dev/null

      - name: Install the Rust verification toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply declarative schema and validate realms
        working-directory: shared-auth
        env:
          PGPASSWORD: shared_auth_test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence-repo/evidence/shared-auth
          psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -v ON_ERROR_STOP=1 \
            -f db/schema.sql \
            >../evidence-repo/evidence/shared-auth/schema-apply.log
          python3 -m unittest scripts/test_validate_auth_realms.py
          python3 scripts/validate_auth_realms.py \
            --contract config/auth-realms.contract.json \
            --schema db/schema.sql \
            --realm-source src/realm.rs
          psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -Atc \
            "select to_regclass('shared_auth.browser_authorization_codes') is not null" | grep -Fx t
          redis-cli -h 127.0.0.1 ping | grep -Fx PONG

      - name: Prove database first-use, replay, PKCE, redirect, client, and expiry boundaries
        env:
          PGPASSWORD: shared_auth_test
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into shared_auth.browser_authorization_codes (
            code_hash,
            client_id,
            redirect_uri,
            return_path,
            supabase_project,
            code_challenge,
            encrypted_tokens,
            created_at,
            expires_at
          ) values
            (
              repeat('a', 43),
              'zpkg',
              'https://app.zpkg.net/auth/shared/callback',
              '/dashboard',
              'zpkg',
              repeat('b', 43),
              repeat('e', 64),
              now(),
              now() + interval '90 seconds'
            ),
            (
              repeat('c', 43),
              'zpkg',
              'https://app.zpkg.net/auth/shared/callback',
              '/dashboard',
              'zpkg',
              repeat('d', 43),
              repeat('f', 64),
              now(),
              now() + interval '90 seconds'
            ),
            (
              repeat('g', 43),
              'zpkg',
              'https://app.zpkg.net/auth/shared/callback',
              '/dashboard',
              'zpkg',
              repeat('h', 43),
              repeat('i', 64),
              now() - interval '120 seconds',
              now() - interval '60 seconds'
            ),
            (
              repeat('j', 43),
              'zpkg',
              'https://app.zpkg.net/auth/shared/callback',
              '/dashboard',
              'zpkg',
              repeat('k', 43),
              repeat('l', 64),
              now(),
              now() + interval '90 seconds'
            );

          do $$
          declare
            first_count integer;
            replay_count integer;
            wrong_pkce_count integer;
            wrong_redirect_count integer;
            wrong_client_count integer;
            expired_count integer;
          begin
            with redeemed as (
              update shared_auth.browser_authorization_codes
              set consumed_at = now()
              where code_hash = repeat('a', 43)
                and client_id = 'zpkg'
                and redirect_uri = 'https://app.zpkg.net/auth/shared/callback'
                and consumed_at is null
                and expires_at > now()
                and code_challenge = repeat('b', 43)
              returning encrypted_tokens, supabase_project
            ) select count(*) into first_count from redeemed;

            with redeemed as (
              update shared_auth.browser_authorization_codes
              set consumed_at = now()
              where code_hash = repeat('a', 43)
                and client_id = 'zpkg'
                and redirect_uri = 'https://app.zpkg.net/auth/shared/callback'
                and consumed_at is null
                and expires_at > now()
                and code_challenge = repeat('b', 43)
              returning encrypted_tokens, supabase_project
            ) select count(*) into replay_count from redeemed;

            with redeemed as (
              update shared_auth.browser_authorization_codes
              set consumed_at = now()
              where code_hash = repeat('c', 43)
                and client_id = 'zpkg'
                and redirect_uri = 'https://app.zpkg.net/auth/shared/callback'
                and consumed_at is null
                and expires_at > now()
                and code_challenge = repeat('x', 43)
              returning encrypted_tokens, supabase_project
            ) select count(*) into wrong_pkce_count from redeemed;

            with redeemed as (
              update shared_auth.browser_authorization_codes
              set consumed_at = now()
              where code_hash = repeat('c', 43)
                and client_id = 'zpkg'
                and redirect_uri = 'https://evil.example/callback'
                and consumed_at is null
                and expires_at > now()
                and code_challenge = repeat('d', 43)
              returning encrypted_tokens, supabase_project
            ) select count(*) into wrong_redirect_count from redeemed;

            with redeemed as (
              update shared_auth.browser_authorization_codes
              set consumed_at = now()
              where code_hash = repeat('c', 43)
                and client_id = 'other-client'
                and redirect_uri = 'https://app.zpkg.net/auth/shared/callback'
                and consumed_at is null
                and expires_at > now()
                and code_challenge = repeat('d', 43)
              returning encrypted_tokens, supabase_project
            ) select count(*) into wrong_client_count from redeemed;

            with redeemed as (
              update shared_auth.browser_authorization_codes
              set consumed_at = now()
              where code_hash = repeat('g', 43)
                and client_id = 'zpkg'
                and redirect_uri = 'https://app.zpkg.net/auth/shared/callback'
                and consumed_at is null
                and expires_at > now()
                and code_challenge = repeat('h', 43)
              returning encrypted_tokens, supabase_project
            ) select count(*) into expired_count from redeemed;

            if first_count <> 1 then
              raise exception 'first redemption count %, expected 1', first_count;
            end if;
            if replay_count <> 0 then
              raise exception 'replay count %, expected 0', replay_count;
            end if;
            if wrong_pkce_count <> 0 then
              raise exception 'wrong PKCE count %, expected 0', wrong_pkce_count;
            end if;
            if wrong_redirect_count <> 0 then
              raise exception 'wrong redirect count %, expected 0', wrong_redirect_count;
            end if;
            if wrong_client_count <> 0 then
              raise exception 'wrong client count %, expected 0', wrong_client_count;
            end if;
            if expired_count <> 0 then
              raise exception 'expired count %, expected 0', expired_count;
            end if;
          end
          $$;
          SQL

      - name: Prove concurrent redemption consumes exactly once
        env:
          PGPASSWORD: shared_auth_test
        shell: bash
        run: |
          set -euo pipefail
          redeem_sql="with redeemed as (
            update shared_auth.browser_authorization_codes
            set consumed_at = now()
            where code_hash = repeat('j', 43)
              and client_id = 'zpkg'
              and redirect_uri = 'https://app.zpkg.net/auth/shared/callback'
              and consumed_at is null
              and expires_at > now()
              and code_challenge = repeat('k', 43)
            returning encrypted_tokens, supabase_project
          ) select count(*) from redeemed;"

          psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -Atc "$redeem_sql" \
            >evidence-repo/evidence/shared-auth/concurrent-a.txt &
          pid_a=$!
          psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -Atc "$redeem_sql" \
            >evidence-repo/evidence/shared-auth/concurrent-b.txt &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"

          total=$(awk '{ total += $1 } END { print total + 0 }' \
            evidence-repo/evidence/shared-auth/concurrent-a.txt \
            evidence-repo/evidence/shared-auth/concurrent-b.txt)
          test "$total" = 1
          test "$(psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -Atc \
            "select count(*) from shared_auth.browser_authorization_codes where code_hash=repeat('j',43) and consumed_at is not null")" = 1

      - name: Run exact locked Rust certification
        working-directory: shared-auth
        env:
          AUTH_TEST_DATABASE_URL: postgres://shared_auth:shared_auth_test@127.0.0.1:5432/shared_auth_test
          AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo build --release --locked
          git diff --exit-code

      - name: Persist exact-head certification evidence
        working-directory: evidence-repo
        shell: bash
        env:
          CERTIFIED_SHA: ${{ steps.request.outputs.expected_head }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          INDEPENDENT_TEST_SHA: ${{ steps.request.outputs.independent_test_head }}
        run: |
          set -euo pipefail
          mkdir -p evidence/shared-auth
          jq --arg sha "$CERTIFIED_SHA" '.expected_head = $sha | .certified_head = $sha' \
            config/shared-auth-certification.json >config/shared-auth-certification.json.tmp
          mv config/shared-auth-certification.json.tmp config/shared-auth-certification.json
          jq -n \
            --arg sha "$CERTIFIED_SHA" \
            --arg test_sha "$INDEPENDENT_TEST_SHA" \
            '{
              schema: 2,
              repository: "shared-auth/shared-auth-server.rs",
              commit: $sha,
              postgres_schema: true,
              postgres_first_use: 1,
              postgres_replay: 0,
              postgres_wrong_pkce: 0,
              postgres_wrong_redirect: 0,
              postgres_wrong_client: 0,
              postgres_expired: 0,
              postgres_concurrent_successes: 1,
              redis_ping: true,
              realm_contract: true,
              fmt: true,
              check: true,
              clippy: true,
              tests: true,
              release_build: true,
              configured_supabase_issuer: true,
              hosted_endpoint_test: true,
              self_hosted_endpoint_test: true,
              current_crypto_apis: true,
              bounded_csrf_cookie: true,
              independent_test_repository: "shared-auth-test/server-api-contract-e2e",
              independent_test_commit: $test_sha,
              independent_contract_v2: true,
              production_certified: false
            }' >evidence/shared-auth/exact-head-certification.json
          cat >evidence/shared-auth/exact-head-certification.md <<EOF
          # Shared Auth exact-head certification

          Certified commit: \`$CERTIFIED_SHA\`

          The Zpkg browser-handoff source passed the independent Shared Auth test contract,
          declarative PostgreSQL schema application, realm validation, Redis reachability,
          first-use/replay/PKCE/redirect/client/expiry database boundaries, concurrent
          single-consumer redemption, locked formatting, compile, Clippy with warnings denied,
          all-target tests, and a release build.

          Independent contract commit: \`$INDEPENDENT_TEST_SHA\`.

          This is disposable test-environment evidence, not production Supabase, RDS,
          Kubernetes, browser, or traffic certification.
          EOF
          git rm bootstrap/shared-auth-configurable-issuer.once
          git add config/shared-auth-certification.json evidence/shared-auth
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-2788): record Shared Auth exact-head certification'
          git push origin HEAD:"$HEAD_BRANCH"
