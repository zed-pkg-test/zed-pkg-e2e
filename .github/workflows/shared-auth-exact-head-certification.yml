name: Shared Auth exact-head certification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: shared-auth-exact-head-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  certify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/den-2788-full-stack-live-r2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shared_auth_test
          POSTGRES_USER: shared_auth
          POSTGRES_PASSWORD: shared_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U shared_auth -d shared_auth_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out the requesting evidence head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: evidence-repo
          fetch-depth: 0
          persist-credentials: true

      - name: Read and authorize the exact certification request
        id: request
        working-directory: evidence-repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < bootstrap/shared-auth-configurable-issuer.once)" = \
            'CERTIFY_SHARED_AUTH_CONFIGURABLE_ISSUER_V1'
          jq -e '.repository == "shared-auth/shared-auth-server.rs"' \
            config/shared-auth-certification.json >/dev/null
          for key in repository branch expected_head; do
            value="$(jq -er --arg key "$key" '.[$key]' config/shared-auth-certification.json)"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done

      - name: Check out the exact private Shared Auth candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.request.outputs.repository }}
          ref: ${{ steps.request.outputs.branch }}
          path: shared-auth
          fetch-depth: 0
          token: ${{ secrets.FLEET_GH_TOKEN }}
          persist-credentials: true

      - name: Assert and apply the bounded issuer correction with regression tests
        working-directory: shared-auth
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.request.outputs.expected_head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/handoff/mod.rs')
          text = path.read_text()

          cloud_only = re.compile(
              r'''(?mx)
              ^[ ]{8}let[ ]endpoint[ ]=[ ]format!\(
              [ ]*"https://\{\}\.supabase\.co/auth/v1/token\?grant_type=password",
              [ ]*project\.project_ref
              [ ]*\);
              '''
          )
          text, count = cloud_only.subn(
              '        let endpoint = supabase_password_token_endpoint(project);',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one cloud-only token endpoint, found {count}')

          helper = '''fn supabase_password_token_endpoint(project: &SupabaseProject) -> String {
              format!(
                  "{}/token?grant_type=password",
                  project.issuer().trim_end_matches('/')
              )
          }

          '''
          anchor = 'impl HandoffService {\n'
          if 'fn supabase_password_token_endpoint(' in text:
              raise SystemExit('endpoint helper unexpectedly exists at the locked source head')
          if text.count(anchor) != 1:
              raise SystemExit('HandoffService implementation anchor drifted')
          text = text.replace(anchor, helper + anchor, 1)

          tests = r'''

          #[cfg(test)]
          mod endpoint_tests {
              use serde_json::json;

              use super::supabase_password_token_endpoint;
              use crate::config::SupabaseProject;

              fn project(project_ref: &str, issuer: Option<&str>) -> SupabaseProject {
                  let mut value = json!({
                      "name": "zpkg-test",
                      "project_ref": project_ref
                  });
                  if let Some(issuer) = issuer {
                      value["issuer"] = json!(issuer);
                  }
                  serde_json::from_value(value).expect("valid Supabase project fixture")
              }

              #[test]
              fn derives_hosted_password_endpoint_from_default_issuer() {
                  let project = project("abcdefghijklmnopqrst", None);
                  assert_eq!(
                      supabase_password_token_endpoint(&project),
                      "https://abcdefghijklmnopqrst.supabase.co/auth/v1/token?grant_type=password"
                  );
              }

              #[test]
              fn honors_explicit_self_hosted_issuer_and_trims_trailing_slash() {
                  let project = project(
                      "unused-for-explicit-issuer",
                      Some("http://127.0.0.1:54321/auth/v1/"),
                  );
                  assert_eq!(
                      supabase_password_token_endpoint(&project),
                      "http://127.0.0.1:54321/auth/v1/token?grant_type=password"
                  );
              }
          }
          '''
          if 'mod endpoint_tests' in text:
              raise SystemExit('endpoint regression tests unexpectedly exist at the locked source head')
          path.write_text(text.rstrip() + tests + '\n')
          PY
          grep -Fq 'supabase_password_token_endpoint(project)' src/handoff/mod.rs
          grep -Fq "project.issuer().trim_end_matches('/')" src/handoff/mod.rs
          grep -Fq 'derives_hosted_password_endpoint_from_default_issuer' src/handoff/mod.rs
          grep -Fq 'honors_explicit_self_hosted_issuer_and_trims_trailing_slash' src/handoff/mod.rs
          ! grep -Fq 'https://{}.supabase.co/auth/v1/token' src/handoff/mod.rs

      - name: Install the Rust verification toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply declarative schema and validate realms
        working-directory: shared-auth
        env:
          PGPASSWORD: shared_auth_test
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -v ON_ERROR_STOP=1 -f db/schema.sql
          python3 -m unittest scripts/test_validate_auth_realms.py
          python3 scripts/validate_auth_realms.py \
            --contract config/auth-realms.contract.json \
            --schema db/schema.sql \
            --realm-source src/realm.rs
          psql -h 127.0.0.1 -U shared_auth -d shared_auth_test -Atc \
            "select to_regclass('shared_auth.browser_authorization_codes') is not null" | grep -Fx t

      - name: Run exact locked Rust certification
        working-directory: shared-auth
        env:
          AUTH_TEST_DATABASE_URL: postgres://shared_auth:shared_auth_test@127.0.0.1:5432/shared_auth_test
          AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo build --release --locked
          git diff --check

      - name: Commit the certified Shared Auth head
        id: shared_auth_commit
        working-directory: shared-auth
        shell: bash
        env:
          BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          git add src/handoff/mod.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(auth): derive Supabase password endpoint from configured issuer'
          git push origin HEAD:"$BRANCH"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Persist evidence and consume the one-shot request
        working-directory: evidence-repo
        shell: bash
        env:
          CERTIFIED_SHA: ${{ steps.shared_auth_commit.outputs.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p evidence/shared-auth
          jq --arg sha "$CERTIFIED_SHA" '.expected_head = $sha | .certified_head = $sha' \
            config/shared-auth-certification.json > config/shared-auth-certification.json.tmp
          mv config/shared-auth-certification.json.tmp config/shared-auth-certification.json
          jq -n --arg sha "$CERTIFIED_SHA" '{
            schema: 1,
            repository: "shared-auth/shared-auth-server.rs",
            commit: $sha,
            postgres_schema: true,
            redis_configured: true,
            realm_contract: true,
            fmt: true,
            check: true,
            clippy: true,
            tests: true,
            release_build: true,
            supabase_endpoint_from_issuer: true,
            hosted_endpoint_test: true,
            self_hosted_endpoint_test: true
          }' > evidence/shared-auth/exact-head-certification.json
          cat > evidence/shared-auth/exact-head-certification.md <<EOF
          # Shared Auth exact-head certification

          Certified commit: \`$CERTIFIED_SHA\`

          The Zpkg browser-handoff head passed declarative PostgreSQL schema application,
          auth-realm validation, locked Rust formatting, compile, Clippy with warnings denied,
          all-target tests, and a release build with PostgreSQL and Redis configured. Password
          handoff derives the token endpoint from the configured Supabase issuer. Dedicated
          regression tests cover both hosted defaults and explicit self-hosted issuers.
          EOF
          rm -f .github/workflows/repair-shared-auth-configurable-issuer.yml
          git rm bootstrap/shared-auth-configurable-issuer.once
          git add config/shared-auth-certification.json evidence/shared-auth
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-2788): record Shared Auth exact-head certification'
          git push origin HEAD:"$HEAD_BRANCH"
