name: Exact Forge raw Future native guests
on: [push]
permissions: {}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify immutable public source without API requests
        run: |
          set -euo pipefail
          git init source
          GIT_TERMINAL_PROMPT=0 git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.forge.git 62c70f19853c4854e05d684049e91f5ba9579a08
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 62c70f19853c4854e05d684049e91f5ba9579a08
          test "$(git -C source rev-parse HEAD^{tree})" = 889024d576dbc9fc10a4c5cf6f8a0ef41721b64a
          test "$(git -C source write-tree)" = 889024d576dbc9fc10a4c5cf6f8a0ef41721b64a
      - name: Build Forge and execute actual native guests
        working-directory: source
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target oresforge --parallel 2
          bash verification/test-counted-ready-shared-native.sh build/oresforge contracts/counted-ready-v1
