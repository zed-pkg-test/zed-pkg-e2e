name: Cranelift exact named aggregate scalar execution and object emission
on:
  push:
    branches: ['ci/cranelift-aggregate-aot-0718834-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify exact public source
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/atto-lang/atto-source.cranelift.git 0718834b1e376bbfda3f8f5996d37f314ee1747e
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 0718834b1e376bbfda3f8f5996d37f314ee1747e
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 2dd7a28f4d4ff1eb26d28d2853f04944fabcbf1f
      - name: Run repository-pinned compiler and aggregate guest tests
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked --test named_aggregate_aot_allocations -- --nocapture
          cargo test --locked --test named_aggregate_guest -- --nocapture
          cargo test --locked --all-targets
          cargo build --locked --release
          sha256sum target/release/orescranelift
          echo "Named aggregate AOT object harness and separate JIT tests are distinct scopes."
