name: workstation Cloudflare inventory v2
run-name: workstation Cloudflare inventory v2 @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/workstation-cloudflare-inventory-v2.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/workstation-cloudflare-inventory-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workstation-cloudflare-inventory-v2
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/workstation-cloudflare-inventory-v2.yml

      - name: Validate immutable safety markers
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/workstation-cloudflare-inventory-v2.yml
          grep -qF 'rsa_padding_mode:oaep' "$workflow"
          grep -qF 'rsa_oaep_md:sha256' "$workflow"
          grep -qF 'Destroy credential material' "$workflow"
          grep -qF 'Authorization: Bearer' "$workflow"
          git diff --check HEAD^ HEAD

  inventory:
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'zed-pkg-test/zed-pkg-e2e' &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_NUMBER: 158
      CONFIRMATION: inspect-zpkg-workstation-tunnel-v2
      ACCOUNT_ID: 62b833940607839add74bd2379cac303
      TUNNEL_ID: 2eb5c6d9-a2b7-4c5e-9222-2f43e91f90e1
      ZPKG_ZONE_ID: b559136046dcffc550ee8b3ed49cdf09
    steps:
      - name: Check out exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Receive one run-bound encrypted Cloudflare token
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 16)"
          private_key="$RUNNER_TEMP/cf-private.pem"
          public_key="$RUNNER_TEMP/cf-public.pem"
          encrypted="$RUNNER_TEMP/cf-token.bin"
          payload="$RUNNER_TEMP/cf-payload.json"
          token_file="$RUNNER_TEMP/cf-api-token"
          matches="$RUNNER_TEMP/cf-matches"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout -out "$public_key" >/dev/null 2>&1
          key_b64="$(base64 -w0 < "$public_key")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="CF_WORKSTATION_V2_PUBLIC_KEY protocol=1 run_id=${run_id} key_b64=${key_b64} confirm=${CONFIRMATION}" >/dev/null
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "token_file=${token_file}" >> "$GITHUB_OUTPUT"
          echo "HANDSHAKE_READY run_id=${run_id} issue=${ISSUE_NUMBER}"

          prefix="CF_WORKSTATION_V2_CIPHERTEXT protocol=1 run_id=${run_id} data="
          ciphertext=''
          for _ in $(seq 1 360); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq ".[] | select(.body | startswith(\"${prefix}\")) | .body" > "$matches"
            count="$(awk 'NF { n += 1 } END { print n + 0 }' "$matches")"
            if [ "$count" -gt 1 ]; then
              echo "duplicate ciphertexts for ${run_id}" >&2
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              line="$(cat "$matches")"
              ciphertext="${line#"$prefix"}"
              break
            fi
            sleep 5
          done
          test -n "$ciphertext"
          printf '%s' "$ciphertext" | base64 -d > "$encrypted"
          openssl pkeyutl -decrypt -inkey "$private_key" -in "$encrypted" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out "$payload"
          jq -e --arg run_id "$run_id" --arg confirm "$CONFIRMATION" '
            .run_id == $run_id and .confirm == $confirm and
            (.cf_api_token | type == "string" and length >= 20)
          ' "$payload" >/dev/null
          token="$(jq -r .cf_api_token "$payload")"
          echo "::add-mask::${token}"
          printf '%s' "$token" > "$token_file"
          chmod 600 "$token_file"
          rm -f "$encrypted" "$payload" "$matches"

      - name: Read live tunnel and Access routing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN_FILE: ${{ steps.handoff.outputs.token_file }}
          RUN_ID: ${{ steps.handoff.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          umask 077
          token="$(cat "$TOKEN_FILE")"
          api=https://api.cloudflare.com/client/v4
          raw="$RUNNER_TEMP/cf-raw"
          out="$RUNNER_TEMP/workstation-cloudflare-inventory.json"
          mkdir -p "$raw"

          get_required() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              "${api}$2" > "$raw/$1.json"
            jq -e '.success == true' "$raw/$1.json" >/dev/null
          }
          get_optional() {
            if ! curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              "${api}$2" > "$raw/$1.json"; then
              jq -n '{success:false,result:null}' > "$raw/$1.json"
            fi
          }

          get_required verify '/user/tokens/verify'
          get_required tunnels "/accounts/${ACCOUNT_ID}/cfd_tunnel?is_deleted=false&per_page=100"
          get_required config "/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_ID}/configurations"
          get_optional connections "/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_ID}/connections"
          get_optional access "/accounts/${ACCOUNT_ID}/access/apps?per_page=200"
          get_optional dns "/zones/${ZPKG_ZONE_ID}/dns_records?per_page=500"

          jq -n \
            --arg tunnel_id "$TUNNEL_ID" \
            --slurpfile verify "$raw/verify.json" \
            --slurpfile tunnels "$raw/tunnels.json" \
            --slurpfile config "$raw/config.json" \
            --slurpfile connections "$raw/connections.json" \
            --slurpfile access "$raw/access.json" \
            --slurpfile dns "$raw/dns.json" '
            {
              schema: "cloudflare.workstation-route/v2",
              token_status: ($verify[0].result.status // "unknown"),
              tunnel: (($tunnels[0].result // []) | map(select(.id == $tunnel_id or .name == "zpkg-registry-local")) | map({id,name,status,remote_config,created_at})),
              ingress: (($config[0].result.config.ingress // $config[0].result.ingress // []) | map({hostname,service,originRequest})),
              connectors: (($connections[0].result // []) | map({id,colo_name,opened_at,origin_ip,is_pending_reconnect,uuid})),
              access_apps: (($access[0].result // []) | map({id,name,domain,type,session_duration})),
              tunnel_dns: (($dns[0].result // []) | map(select(((.content // "") | ascii_downcase | contains("cfargotunnel.com")) or ((.content // "") | ascii_downcase | contains(($tunnel_id | ascii_downcase)))) | {id,type,name,content,proxied,ttl}))
            }
          ' > "$out"
          jq -e '.tunnel | length == 1' "$out" >/dev/null
          jq . "$out"

          payload_b64="$(base64 -w0 < "$out")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="CF_WORKSTATION_V2_RESULT protocol=1 run_id=${RUN_ID} payload_b64=${payload_b64}" >/dev/null

      - name: Upload non-secret route inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workstation-cloudflare-route-${{ github.run_id }}
          path: ${{ runner.temp }}/workstation-cloudflare-inventory.json
          if-no-files-found: error
          retention-days: 7

      - name: Destroy credential material
        if: always()
        shell: bash
        run: |
          shred -u \
            "$RUNNER_TEMP/cf-private.pem" \
            "$RUNNER_TEMP/cf-public.pem" \
            "$RUNNER_TEMP/cf-token.bin" \
            "$RUNNER_TEMP/cf-payload.json" \
            "$RUNNER_TEMP/cf-api-token" \
            2>/dev/null || true
          rm -rf "$RUNNER_TEMP/cf-matches" "$RUNNER_TEMP/cf-raw"
