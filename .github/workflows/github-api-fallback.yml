name: GitHub and Cloudflare fallback harness

on:
  pull_request:
    paths:
      - ".github/workflows/github-api-fallback.yml"
      - "scripts/github_api_fallback.py"
      - "scripts/zed_github_cloudflare_e2e.py"
      - "docs/github-api-fallback-canary.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-api-fallback.yml"
      - "scripts/github_api_fallback.py"
      - "scripts/zed_github_cloudflare_e2e.py"
      - "docs/github-api-fallback-canary.md"

permissions:
  contents: read

concurrency:
  group: github-cloudflare-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contract:
    name: Fallback harness contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Compile and exercise credential-free contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/github_api_fallback.py \
            scripts/zed_github_cloudflare_e2e.py
          python3 scripts/github_api_fallback.py \
            --work-root "$RUNNER_TEMP/github-api-contract" \
            --skip-network
          python3 scripts/zed_github_cloudflare_e2e.py \
            --work-root "$RUNNER_TEMP/github-cloudflare-contract" \
            --skip-network

      - name: Explain live ownership boundary
        run: |
          cat <<'EOF'
          The write-capable workflow lives in zed-pkg-test/github-api-fallback-canary.
          GitHub Actions tokens are repository-scoped; a harness token must not be
          assumed to have Release write permission in a sibling repository.
          EOF
