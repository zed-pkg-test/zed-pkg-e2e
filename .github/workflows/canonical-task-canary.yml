name: canonical task CLI canary

on:
  pull_request:
    paths:
      - .github/workflows/canonical-task-canary.yml
      - scripts/canonical_task_canary.py
      - compat/tasks/**
  workflow_dispatch:
    inputs:
      candidate:
        description: Full immutable zed-pkg/zed-cli commit to certify
        required: false
        default: 4c708dcece916a81caace9d82083a523a297475c

permissions:
  contents: read

concurrency:
  group: canonical-task-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ZED_CLI_COMMIT: ${{ inputs.candidate || '4c708dcece916a81caace9d82083a523a297475c' }}

jobs:
  certify:
    name: canonical task / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out independent certification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: product/zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify immutable product identity
        run: |
          set -euo pipefail
          [[ "$ZED_CLI_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C product/zed-cli rev-parse HEAD)" = "$ZED_CLI_COMMIT"

      - name: Install Rust and Python
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Build exact release binaries
        working-directory: product/zed-cli
        run: |
          set -euo pipefail
          cargo build --locked --release --bin zed --bin zed-task

      - name: Select platform binary paths
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed"
          staged="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed-task"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            zed="${zed}.exe"
            staged="${staged}.exe"
          fi
          echo "ZED_BINARY=$zed" >> "$GITHUB_ENV"
          echo "ZED_TASK_BINARY=$staged" >> "$GITHUB_ENV"

      - name: Run independent black-box certification
        run: |
          set -euo pipefail
          python -m py_compile scripts/canonical_task_canary.py
          python scripts/canonical_task_canary.py \
            --zed "$ZED_BINARY" \
            --zed-task "$ZED_TASK_BINARY" \
            --candidate "$ZED_CLI_COMMIT" \
            --work "$RUNNER_TEMP/canonical-task-canary" \
            --evidence "artifacts/canonical-task-${RUNNER_OS}-${RUNNER_ARCH}.json"
          git diff --exit-code
          git -C product/zed-cli diff --exit-code

      - name: Upload exact-head evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-task-${{ runner.os }}-${{ runner.arch }}-${{ env.ZED_CLI_COMMIT }}
          path: artifacts/canonical-task-${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 14
