name: live-mutex cross-org e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [test/live-mutex-cross-e2e-20260925]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-fencing-e2e:
    name: live-mutex-rs fencing formal clients
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact live-mutex-rs PR head
        uses: actions/checkout@v4
        with:
          repository: ORESoftware/live-mutex-rs
          ref: 9d00c73be8177cb41e24908e695918ec36f44897
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Formal fencing model
        run: cargo test --locked --test formal_fencing_model -- --nocapture
      - name: Client fencing surface
        run: cargo test --locked --test formal_client_fencing_surface -- --nocapture
      - name: Real broker external-effect fencing
        run: cargo test --locked --test fencing_external_effects -- --nocapture
      - name: Polyglot protocol parity
        run: bash clients/check-protocol-parity.sh
      - name: Set up BEAM client runtimes
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.18'
      - name: Erlang fencing-token client tests
        working-directory: clients/erlang
        run: make test
      - name: Elixir fencing-token client tests
        working-directory: clients/elixir
        run: mix test
      - name: OCaml fencing-token client tests
        working-directory: clients/ocaml
        run: |
          command -v ocamlc >/dev/null || (sudo apt-get update && sudo apt-get install -y ocaml)
          make test

  node-fencing-e2e:
    name: live-mutex Broker1 fencing formal clients
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LMX_TEST_TIMEOUT_MS: '900000'
      LMX_TEST_INACTIVITY_TIMEOUT_MS: '300000'
    steps:
      - name: Checkout exact live-mutex PR head
        uses: actions/checkout@v4
        with:
          repository: ORESoftware/live-mutex
          ref: 3158b77939777dbbab96f691879467a03d340546
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build Broker1 artifacts
        run: npm run build
      - name: Formal fencing model
        run: npx -y ts-node@10.9.2 test/formal-fencing-model-test.ts
      - name: Client fencing surface
        run: npx -y ts-node@10.9.2 test/formal-client-fencing-surface-test.ts
      - name: Set up F# client runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: F# fencing-token client tests
        working-directory: clients/fsharp
        run: dotnet fsi fencing-token-tests.fsx
      - name: Legacy Python3 fencing-token client tests
        working-directory: clients/python3
        run: |
          python3 - <<'PY'
          import main
          assert main.fencing_token_from_response({'fencingToken': 9007199254740991}) == 9007199254740991
          for bad in (None, 0, -1, True, 1.5, 9007199254740992):
              try:
                  main.fencing_token_from_response({'fencingToken': bad})
              except main.InvalidFencingTokenError:
                  pass
              else:
                  raise AssertionError('accepted unsafe fencing token: %r' % (bad,))
          print('legacy Python3 fencing-token checks passed')
          PY
      - name: Broker1 fencing authority hardening
        run: npx -y ts-node@10.9.2 test/fencing-authority-hardening-test.ts
      - name: Real Broker1 external-effect fencing
        run: npx -y ts-node@10.9.2 test/fencing-external-effects-test.ts

  zed-roundtrip:
    name: zed roundtrip ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: live-mutex-rs
            repository: ORESoftware/live-mutex-rs
            sha: 9d00c73be8177cb41e24908e695918ec36f44897
          - name: live-mutex
            repository: ORESoftware/live-mutex
            sha: 3158b77939777dbbab96f691879467a03d340546
    steps:
      - name: Checkout exact source PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - name: Checkout pinned zed-pkg CLI
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-cli
          ref: 17412050a0f4c4f963008f0de9abf3651d42af08
          path: zed-cli
          persist-credentials: false
      - name: Build pinned zed CLI
        run: |
          rustup update stable
          rustup default stable
          cargo build --manifest-path zed-cli/Cargo.toml --release --locked --bin zed
      - name: Validate source manifest
        working-directory: source
        run: ../zed-cli/target/release/zed validate
      - name: Pack deterministic source artifact
        working-directory: source
        run: ../zed-cli/target/release/zed pack
      - name: Install and smoke-test through isolated Zed registry
        working-directory: source
        run: ../zed-cli/target/release/zed r2g
