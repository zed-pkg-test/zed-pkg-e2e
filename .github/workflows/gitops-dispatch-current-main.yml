name: zed gitops current-main exact-head canary

on:
  pull_request:
    paths:
      - .github/workflows/gitops-dispatch-current-main.yml
      - docs/gitops-dispatch-current-main.md
      - fixtures/external_dispatch_probe.rs
      - scripts/gitops_dispatch_canary.py
      - scripts/gitops_dispatch_canary_entry.py
      - scripts/gitops_dispatch_trailing_options.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-dispatch-current-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ZED_CLI_COMMIT: 17fe649a364a341745b7c98b8a67a4599ef9fd6f
  ZED_CLI_PARENT: 4d598520bc5cd24b739b4571bf2fb7f46b0ec5ee

jobs:
  certify:
    name: exact-parent gitops dispatch / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Check out independent certification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact product candidate and parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: product/zed-cli
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Require exact immutable ancestry and eight-file delta
        run: |
          set -euo pipefail
          [[ "$ZED_CLI_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZED_CLI_PARENT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C product/zed-cli rev-parse HEAD)" = "$ZED_CLI_COMMIT"
          test "$(git -C product/zed-cli rev-parse HEAD^)" = "$ZED_CLI_PARENT"
          changed="$(git -C product/zed-cli diff --name-only "$ZED_CLI_PARENT" "$ZED_CLI_COMMIT")"
          expected=$'.zpkg.toml\ndocs/gitops-validator.md\nscripts/validate-zed-package-graph.sh\nsrc/completion.rs\nsrc/external_subcommands.rs\nsrc/lib.rs\nsrc/main.rs\ntests/external_gitops_dispatch.rs'
          if [[ "$changed" != "$expected" ]]; then
            printf 'unexpected product delta:\n%s\n' "$changed" >&2
            exit 1
          fi
          git -C product/zed-cli diff --check "$ZED_CLI_PARENT" "$ZED_CLI_COMMIT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate fixed harness and product quality gates
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/gitops_dispatch_canary.py \
            scripts/gitops_dispatch_canary_entry.py \
            scripts/gitops_dispatch_trailing_options.py
          rm -rf scripts/__pycache__
          cargo fmt --manifest-path product/zed-cli/Cargo.toml --all --check
          cargo test --manifest-path product/zed-cli/Cargo.toml --locked --lib external_subcommands::tests
          cargo test --manifest-path product/zed-cli/Cargo.toml --locked --test external_gitops_dispatch
          cargo clippy --manifest-path product/zed-cli/Cargo.toml --locked \
            --lib --bin zed --bin zed-gitops --test external_gitops_dispatch -- -D warnings
          bash product/zed-cli/scripts/validate-zed-package-graph.sh

      - name: Build exact release binaries
        run: |
          set -euo pipefail
          cargo build --manifest-path product/zed-cli/Cargo.toml --locked --release \
            --bin zed --bin zed-gitops

      - name: Select platform paths and compile untrusted probe
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed"
          gitops="$GITHUB_WORKSPACE/product/zed-cli/target/release/zed-gitops"
          probe="$RUNNER_TEMP/zed-dispatch-probe"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            zed="${zed}.exe"
            gitops="${gitops}.exe"
            probe="${probe}.exe"
          fi
          rustc --edition=2024 fixtures/external_dispatch_probe.rs -O -o "$probe"
          echo "ZED_BINARY=$zed" >> "$GITHUB_ENV"
          echo "ZED_GITOPS_BINARY=$gitops" >> "$GITHUB_ENV"
          echo "DISPATCH_PROBE_BINARY=$probe" >> "$GITHUB_ENV"

      - name: Run independent black-box certification
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/gitops_dispatch_canary_entry.py \
            --zed "$ZED_BINARY" \
            --zed-gitops "$ZED_GITOPS_BINARY" \
            --probe "$DISPATCH_PROBE_BINARY" \
            --product product/zed-cli \
            --candidate "$ZED_CLI_COMMIT" \
            --work "$RUNNER_TEMP/gitops-dispatch-current-main" \
            --evidence "artifacts/gitops-dispatch-${RUNNER_OS}-${RUNNER_ARCH}.json"
          python scripts/gitops_dispatch_trailing_options.py \
            --zed "$ZED_BINARY" \
            --probe "$DISPATCH_PROBE_BINARY" \
            --candidate "$ZED_CLI_COMMIT" \
            --work "$RUNNER_TEMP/gitops-dispatch-trailing" \
            --evidence "artifacts/gitops-dispatch-trailing-${RUNNER_OS}-${RUNNER_ARCH}.json"

      - name: Record exact-parent evidence and require no source mutation
        run: |
          set -euo pipefail
          git -C product/zed-cli diff --exit-code
          git -C product/zed-cli diff --cached --exit-code
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifacts = Path('artifacts')
          binaries = {
              'zed': Path(os.environ['ZED_BINARY']),
              'zed-gitops': Path(os.environ['ZED_GITOPS_BINARY']),
          }
          evidence = {
              '$schema': 'zed-pkg-test/gitops-dispatch-current-main/v1',
              'candidate': os.environ['ZED_CLI_COMMIT'],
              'parent': os.environ['ZED_CLI_PARENT'],
              'runner': {
                  'os': os.environ['RUNNER_OS'],
                  'arch': os.environ['RUNNER_ARCH'],
              },
              'binaries': {
                  name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for name, path in binaries.items()
              },
              'result': 'passed',
          }
          output = artifacts / f"gitops-dispatch-parent-{os.environ['RUNNER_OS']}-{os.environ['RUNNER_ARCH']}.json"
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm -rf scripts/__pycache__
          status="$(git status --porcelain --untracked-files=all | grep -vE '^\?\? (artifacts|product)/' || true)"
          if [[ -n "$status" ]]; then
            printf 'unexpected harness drift:\n%s\n' "$status" >&2
            exit 1
          fi

      - name: Upload immutable certification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitops-dispatch-current-main-${{ runner.os }}-${{ runner.arch }}-${{ env.ZED_CLI_COMMIT }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
