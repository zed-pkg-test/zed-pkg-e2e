name: DEN-3017 zedignore union assembly canary

on:
  push:
    branches:
      - alexanderdmills/den-3017-zedignore-union
    paths:
      - .github/workflows/den-3017-assembly-canary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-3017-assembly-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ZED_CLI_STAGING_REF: f6f125fa2465325687a6a678ed3a6c9a958fda30
  ZED_CLI_BASE_REF: 1ab18fcb2ff884e82af4cac4513d7b983a23c84a
  ZED_INTERFACES_REF: ab784d43c9add1bdd527f832a719fdcc3c9491c8

jobs:
  assemble:
    name: assemble and test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025

    steps:
      - name: Require immutable inputs
        run: |
          set -euo pipefail
          [[ "$ZED_CLI_STAGING_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZED_CLI_BASE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZED_INTERFACES_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact staged patch carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_STAGING_REF }}
          path: zed-cli
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Verify exact parent and patch carrier
        run: |
          set -euo pipefail
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_CLI_STAGING_REF"
          test "$(git -C zed-cli rev-parse HEAD^)" = "$ZED_CLI_BASE_REF"
          test -f zed-cli/.github/den-3017-apply.py.gz.b64
          test "$(find zed-cli/.github -maxdepth 1 -name 'den-3017-apply*' | wc -l | tr -d ' ')" = 1

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Assemble the candidate from the exact patch carrier
        working-directory: zed-cli
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          payload = Path('.github/den-3017-apply.py.gz.b64').read_bytes()
          Path(os.environ['RUNNER_TEMP'], 'den-3017-apply.py').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 "$RUNNER_TEMP/den-3017-apply.py"
          cargo update -p zed-interfaces --precise "$ZED_INTERFACES_REF"
          rm .github/workflows/den-3017-apply.yml .github/den-3017-apply.py.gz.b64
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          grep -F "rev = \"$ZED_INTERFACES_REF\"" Cargo.toml
          grep -F "$ZED_INTERFACES_REF" Cargo.lock

      - name: Run focused conflict-aware union tests
        working-directory: zed-cli
        run: |
          set -euo pipefail
          cargo test --locked --lib publish_rules
          cargo test --locked --lib manifest_and_zedignore_exclusions_are_a_conflict_safe_union
          cargo test --locked --lib same_source_negation_can_cancel_an_earlier_manifest_exclusion
          cargo test --locked --lib polyglot_source_ignore_excludes_the_target_input

      - name: Run complete library test suite
        working-directory: zed-cli
        run: cargo test --locked --lib

      - name: Run strict lint gate
        if: runner.os == 'Linux'
        working-directory: zed-cli
        run: cargo clippy --locked --lib -- -D warnings

      - name: Build evidence snapshot
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/den-3017-evidence"
          mkdir -p "$evidence"
          git -C zed-cli diff --binary HEAD > "$evidence/den-3017.patch"
          git -C zed-cli diff --name-status HEAD > "$evidence/changed-files.txt"
          git -C zed-cli diff --stat HEAD > "$evidence/diff-stat.txt"
          printf '%s\n' "$ZED_CLI_BASE_REF" > "$evidence/zed-cli-base.txt"
          printf '%s\n' "$ZED_INTERFACES_REF" > "$evidence/zed-interfaces-candidate.txt"
          tar --exclude=.git --exclude=target -czf "$evidence/zed-cli-den-3017-source.tar.gz" -C zed-cli .
          sha256sum "$evidence"/* > "$evidence/SHA256SUMS"

      - name: Upload reproducible source evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-3017-assembled-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/den-3017-evidence
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  gate:
    name: all assembly platforms passed
    if: always()
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce aggregate result
        env:
          MATRIX_RESULT: ${{ needs.assemble.result }}
        run: |
          set -euo pipefail
          printf 'den-3017-assembly=%s\n' "$MATRIX_RESULT"
          test "$MATRIX_RESULT" = success
