name: DEN-2996 candidate goldens

on:
  push:
    branches:
      - alexanderdmills/den-2996-lock-evidence-not-topology-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-2996-candidate-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      SOURCE_DATE_EPOCH: "0"

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run focused lock-evidence tests
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s harness \
            -p 'test_github_inventory_lock_evidence.py' \
            -v

      - name: Generate candidate JSON, DOT and Mermaid goldens
        run: |
          set -euo pipefail
          mkdir -p candidate-goldens
          python harness/github_dependency_inventory.py \
            --fixture fixtures/github-dependency-inventory/fixture.json \
            --org ACME \
            --repo acme/app \
            --include zed,git-submodule,nix \
            --format json \
            --output candidate-goldens/inventory.json
          python harness/github_dependency_inventory.py \
            --fixture fixtures/github-dependency-inventory/fixture.json \
            --org ACME \
            --repo acme/app \
            --include zed,git-submodule,nix \
            --format dot \
            --output candidate-goldens/inventory.dot
          python harness/github_dependency_inventory.py \
            --fixture fixtures/github-dependency-inventory/fixture.json \
            --org ACME \
            --repo acme/app \
            --include zed,git-submodule,nix \
            --format mermaid \
            --output candidate-goldens/inventory.mmd
          python - <<'PY'
          import hashlib
          from pathlib import Path

          for path in sorted(Path("candidate-goldens").iterdir()):
              data = path.read_bytes()
              print(f"{path.name}\t{len(data)}\t{hashlib.sha256(data).hexdigest()}")
          PY

      - name: Upload candidate goldens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-2996-candidate-goldens-${{ github.sha }}
          path: candidate-goldens
          if-no-files-found: error
          retention-days: 3
