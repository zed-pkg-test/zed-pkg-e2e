name: global Git submodule compatibility mode

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-global-git-submodule-mode-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ZED_CLI_REF: ff166471338e46729b7cf892b44240452a56ace6
  ZED_INTERFACES_REF: c2e049006453c26ca8ca291783f681fce75cb01f

jobs:
  contract:
    name: Contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Check out acceptance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact merged zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REF }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact interface contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_REF }}
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify immutable inputs
        run: |
          set -euo pipefail
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_CLI_REF"
          test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_REF"
          test "$(tr -d '\r\n' < harness/.zed-cli-global-git-submodule-mode-ref)" = "$ZED_CLI_REF"
          grep -F "rev = \"$ZED_INTERFACES_REF\"" zed-cli/Cargo.toml
          test -z "${ZED_PKG_TOKEN:-}"

      - name: Install the declared Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          git --version
          python3 --version

      - name: Enforce source and formatting contracts
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-cache" \
            python3 -m py_compile harness/scripts/git_submodule_global_mode.py
          git -C harness diff --check
          git -C zed-cli diff --check
          git -C zed-interfaces diff --check
          cargo fmt --all --check --manifest-path zed-cli/Cargo.toml

      - name: Run focused product checks
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path zed-cli/Cargo.toml --lib \
            cli::tests::git_submodule_switch_is_global_boolish_and_does_not_consume_specs
          cargo test --locked --manifest-path zed-cli/Cargo.toml --lib \
            git_submodules::cli::tests
          cargo test --locked --manifest-path zed-cli/Cargo.toml --test git_submodule_interop_cli
          if [ "$RUNNER_OS" = Linux ]; then
            cargo clippy --locked --manifest-path zed-cli/Cargo.toml --all-targets -- -D warnings
          fi

      - name: Build the exact release binary
        run: cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed

      - name: Run the black-box compatibility contract
        env:
          WORK_ROOT: ${{ runner.temp }}/zed-global-git-submodule-mode
        run: |
          set -euo pipefail
          test ! -e "$WORK_ROOT"
          python3 harness/scripts/git_submodule_global_mode.py \
            --zed zed-cli/target/release/zed \
            --work-root "$WORK_ROOT"
          python3 - "$WORK_ROOT/evidence/evidence.json" <<'PY'
          import json
          import pathlib
          import sys

          evidence = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert evidence["schema"] == "zed.git-submodule-global-mode-evidence/v1"
          assert len(evidence["checks"]) == 9
          assert evidence["network_credentials"] is False
          assert evidence["public_registry_mutation"] is False
          PY

      - name: Require clean source checkouts
        run: |
          set -euo pipefail
          test -z "$(git -C harness status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C zed-cli status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C zed-interfaces status --porcelain=v1 --untracked-files=all)"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-git-submodule-mode-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zed-global-git-submodule-mode/evidence
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
