name: materialize native-registry canary for merged product

on:
  push:
    branches:
      - agent/native-registry-canary-merged-product
    paths:
      - .github/workflows/materialize-native-registry-canary-merged-product.yml

permissions:
  contents: read

concurrency:
  group: materialize-native-registry-canary-merged-product-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out clean current-main canary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/native-registry-canary-merged-product
          path: harness
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Check out merged native-registry product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 29addea1aca138133632c453b142c8fb0e0535cb
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Materialize reviewed five-file canary delta
        working-directory: harness
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/native-registry-contract-canary
          source_ref=origin/agent/native-registry-contract-canary
          for path in \
            .github/workflows/native-registry-contract.yml \
            docs/native-registry-contract-canary.md \
            fixtures/native-registry-consumer/Cargo.toml \
            fixtures/native-registry-consumer/src/main.rs \
            fixtures/native-registry-consumer/tests/topology.rs; do
            mkdir -p "$(dirname "$path")"
            git show "$source_ref:$path" > "$path"
          done
          python3 - <<'PY'
          from pathlib import Path

          merged = "29addea1aca138133632c453b142c8fb0e0535cb"
          stale = {
              "a6aaad6911c845be7d8069d67f9bef82c85452b7",
              "ac8b36c0261ad59cf73b3b06c78c13be8370fcfa",
              "134dfa55562ca6dd5d5a0c3c7499ba410826ba69",
          }
          for raw in (
              ".github/workflows/native-registry-contract.yml",
              "docs/native-registry-contract-canary.md",
              "fixtures/native-registry-consumer/Cargo.toml",
              "fixtures/native-registry-consumer/src/main.rs",
              "fixtures/native-registry-consumer/tests/topology.rs",
          ):
              path = Path(raw)
              text = path.read_text()
              for candidate in stale:
                  text = text.replace(candidate, merged)
              path.write_text(text)
          PY
          git diff --check

      - name: Install stable Rust quality toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Certify merged product and external consumer
        run: |
          set -euo pipefail
          cd zed-interfaces
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo run --locked --example generate_schemas
          git diff --exit-code -- schemas/native-registry-adapter-record.json
          cd ../harness
          fixture=fixtures/native-registry-consumer
          cp ../zed-interfaces/Cargo.lock "$fixture/Cargo.lock"
          cargo run --offline --manifest-path "$fixture/Cargo.toml"
          cargo run --locked --offline --manifest-path "$fixture/Cargo.toml"
          cargo test --offline --manifest-path "$fixture/Cargo.toml"
          cargo test --locked --offline --manifest-path "$fixture/Cargo.toml"

      - name: Commit only the current-main canary product
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-native-registry-canary-merged-product.yml
          git add \
            .github/workflows/native-registry-contract.yml \
            docs/native-registry-contract-canary.md \
            fixtures/native-registry-consumer/Cargo.toml \
            fixtures/native-registry-consumer/src/main.rs \
            fixtures/native-registry-consumer/tests/topology.rs \
            .github/workflows/materialize-native-registry-canary-merged-product.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-1420): certify merged native-registry product'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/native-registry-canary-merged-product
