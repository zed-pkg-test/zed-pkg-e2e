name: merge ready portfolios through GraphQL and credential-free validation

on:
  push:
    branches: [main]
    paths:
      - ".github/pr-merge/MERGE-GRAPHQL-READY-PORTFOLIOS"

permissions:
  contents: read

concurrency:
  group: merge-graphql-ready-portfolios
  cancel-in-progress: false

jobs:
  discover:
    if: "${{ github.event.head_commit.message == 'chore: merge ready portfolios through GraphQL' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
    steps:
      - name: Check out trusted GraphQL and git discovery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Discover exact heads through GraphQL and archive public branches with git
        shell: bash
        run: node .github/scripts/discover-graphql-ready-portfolios.mjs

      - name: Upload immutable exact-head portfolio archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graphql-ready-portfolio-bundle
          path: graphql-portfolio-bundle
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out trusted credential-free validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download exact archives without a fleet credential
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: graphql-ready-portfolio-bundle
          path: portfolio-bundle

      - name: Install only the factory contract test dependencies
        shell: bash
        run: python3 -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7'

      - name: Validate exact archives with every GitHub credential removed
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          FLEET_GH_TOKEN: ""
        run: python3 .github/scripts/validate-ready-portfolios.py

      - name: Upload credential-free validation result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graphql-ready-portfolio-validation
          path: portfolio-validated
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FLEET_GH_TOKEN: ${{ secrets.FLEET_GH_TOKEN }}
    steps:
      - name: Check out trusted GraphQL exact-head merger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download credential-free validation result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: graphql-ready-portfolio-validation
          path: portfolio-validated

      - name: Revalidate, promote, merge, and exact-head verify through GraphQL
        shell: bash
        run: node .github/scripts/merge-graphql-validated-portfolios.mjs
